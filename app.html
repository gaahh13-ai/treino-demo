<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEVO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{color-scheme:light;--txt:#e8eaee;--muted:#9aa0ab;--line:#262a33;--pink:#7fff00;--pink-deep:#5fbf00}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{min-height:100vh;background:linear-gradient(180deg,#0a0b0d,#15171c 45%,#15171c);color:var(--txt)}
  nav.top{background:rgba(253,244,248,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  nav.top .in{max-width:1040px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;justify-content:space-between}
  .logo{height:32px}
  .logout{border:1.5px solid var(--pink);color:var(--pink-deep);background:#15171c;border-radius:12px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
  .top-acoes{display:flex;align-items:center;gap:12px}
  .perfil-av{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;padding:0;width:56px}
  .av-thumb{width:38px;height:38px;border-radius:9px;overflow:hidden;background:#1d2027;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--pink-deep)}
  .av-thumb img{width:100%;height:100%;object-fit:cover}
  .av-thumb.av-money{font-size:20px;font-weight:800;color:var(--pink-deep)}
  .av-thumb.av-help{font-size:20px;font-weight:800;color:var(--pink-deep)}
  .ajuda-dicas{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .aj-item{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
  .aj-item b{font-size:13.5px;color:var(--txt)}
  .aj-item span{font-size:12.5px;color:var(--muted);line-height:1.4}
  .aj-wa{width:100%;display:block;text-align:center;text-decoration:none}
  .ajuda-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62)}
  .ajuda-pop{position:fixed;top:70px;right:16px;width:min(360px,92vw);background:#15171c;border-radius:16px;padding:20px;
    border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.4)}
  .ajuda-pop h3{font-size:17px;font-weight:800;color:var(--pink-deep)}
  .presenca-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .presenca-tit{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .presenca-btns{display:flex;gap:8px;flex-wrap:wrap}
  /* Assinatura / planos */
  .assin-tabs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .assin-tab{padding:26px 18px;border:2px solid var(--line);border-radius:16px;background:#15171c;cursor:pointer;
    font-size:18px;font-weight:800;color:var(--txt);transition:.15s}
  .assin-tab:hover{border-color:var(--pink)}
  .assin-tab.active{border-color:var(--pink);background:linear-gradient(120deg,#1d2027,#262a33);color:var(--pink-deep)}
  .plano-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .plano-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:22px;background:#15171c;display:flex;flex-direction:column}
  .plano-card.destaque{border:2px solid var(--pink)}
  .pl-badge{position:absolute;top:-11px;right:16px;background:var(--pink-deep);color:#fff;font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
  .pl-nome{font-size:19px;font-weight:800}
  .pl-preco{font-size:28px;font-weight:800;color:var(--pink-deep);margin:6px 0 16px}
  .pl-preco-sub{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
  .pl-lista{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:9px;flex:1}
  .pl-lista li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.35;color:var(--txt)}
  .pl-lista li.no{color:var(--muted)}
  .pl-ic{font-weight:800;flex:none}
  .pl-lista li.ok .pl-ic{color:#15803d}
  .pl-lista li.no .pl-ic{color:#c2410c}
  .pl-btn{width:100%}
  @media(max-width:760px){ .assin-tabs,.plano-grid{grid-template-columns:1fr} }
  .av-cap{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}
  /* perfil resumido */
  .perfil-foto{text-align:center;margin:6px 0 20px}
  .foto-btn{position:relative;border:none;background:none;cursor:pointer;padding:0;display:inline-block}
  .foto-preview{width:112px;height:112px;border-radius:50%;overflow:hidden;background:#1d2027;border:3px solid var(--pink);
    display:flex;align-items:center;justify-content:center;font-size:46px}
  .foto-preview img{width:100%;height:100%;object-fit:cover}
  .foto-plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:34px;font-weight:700;
    text-shadow:0 1px 8px rgba(0,0,0,.55);pointer-events:none}
  .foto-cap{margin-top:8px;font-weight:700;font-size:13px;color:var(--pink-deep)}
  .acc{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:#15171c;overflow:hidden}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px;background:none;border:none;cursor:pointer;text-align:left}
  .acc-txt{display:flex;flex-direction:column;gap:3px}
  .acc-tit{font-weight:800;font-size:15px;color:var(--txt)}
  .acc-sub{font-size:12.5px;color:var(--pink-deep);font-weight:600}
  .acc-chev{color:var(--pink-deep);font-size:22px;line-height:1;transition:transform .2s}
  .acc.open .acc-chev{transform:rotate(90deg)}
  .acc-body{display:none;padding:0 16px 16px}
  .acc.open .acc-body{display:block}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 60px}
  .hello{font-size:21px;font-weight:800;margin-bottom:4px}
  .role-chip{display:inline-block;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;margin-bottom:18px}
  .chip-creator{background:#1d2027;color:#7fff00}
  .chip-professional{background:#1d2027;color:#1d4ed8}
  .chip-student{background:#1d2027;color:#7fff00}

  .shell{display:grid;grid-template-columns:212px 1fr;gap:20px;align-items:start}
  .sidebar{background:#15171c;border:1px solid var(--line);border-radius:18px;padding:10px;
           box-shadow:0 8px 22px rgba(180,90,140,.06);position:sticky;top:86px}
  .navitem{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;
           padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;text-align:left}
  .navitem:hover{background:#1d2027}
  .navitem.active{background:linear-gradient(120deg,#1d2027,#262a33);color:var(--pink-deep);font-weight:800}
  .navitem .ico{font-size:15px;line-height:1}
  .navgroup{display:flex;flex-direction:column;gap:2px}
  .navsubs{display:none;margin:2px 0 4px 10px;padding-left:10px;border-left:1px solid var(--line);
           flex-direction:column;gap:2px}
  .navgroup.open .navsubs{display:flex}
  .navsub{padding:9px 12px;font-size:13px;font-weight:600;opacity:.92}
  /* Financeiro */
  .fin-topo{display:flex;align-items:center;gap:12px}
  .fin-mes{font-weight:800;font-size:16px;min-width:150px;text-align:center}
  .fin-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .fin-kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .fin-kpi .fk-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .fin-kpi b{font-size:18px}
  .fin-kpi.ok b{color:#15803d}
  .fin-kpi.warn b{color:#be123c}
  .fin-row{display:grid;grid-template-columns:1.4fr .9fr 1fr .8fr auto;align-items:center;gap:10px;
           padding:11px 4px;border-bottom:1px solid var(--line)}
  .fin-nome{font-weight:700;font-size:14px}
  .fin-campo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .fin-in{width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .fin-in.fin-dia{width:56px}
  .fin-tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
  .fin-tag.pg{background:#122110;color:#15803d}
  .fin-tag.pe{background:#2a2410;color:#b45309}
  .fin-tag.at{background:#2a1416;color:#be123c}
  .fin-btn{padding:8px 12px;font-size:13px;white-space:nowrap}
  .fin-aluno{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .fin-al-plano{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .fin-al-mes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .fin-al-mesnome{font-weight:800;font-size:14px;min-width:140px}
  .fin-al-hist{border-top:1px dashed var(--line);padding-top:10px}
  .fin-hist-tit{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .fin-hist-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px}
  @media(max-width:760px){
    .fin-cards{grid-template-columns:repeat(2,1fr)}
    .fin-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
    .fin-nome{grid-column:1/-1}
    .fin-ac{grid-column:1/-1}
    .fin-btn{width:100%}
  }

  .panel h2{font-size:18px;font-weight:800;margin-bottom:14px}
  .card{background:#15171c;border:1px solid var(--line);border-radius:18px;padding:22px;
        box-shadow:0 8px 22px rgba(180,90,140,.06);margin-bottom:16px}
  .card h3{font-size:15px;font-weight:800;color:var(--pink-deep);margin-bottom:8px}
  .card p{font-size:14px;color:var(--muted);line-height:1.55}
  .btn{display:inline-block;border:none;border-radius:12px;padding:11px 20px;font-weight:700;font-size:14px;color:#fff;cursor:pointer;text-decoration:none;
       background:linear-gradient(120deg,#7fff00,#5fbf00);box-shadow:0 6px 16px rgba(236,72,153,.2);margin-top:8px}
  .btn.small{padding:8px 14px;font-size:13px;box-shadow:none}
  .btn.ghost{background:#15171c;color:var(--pink-deep);border:1.5px solid var(--line)}
  .tag{display:inline-block;background:#2a2410;color:#b45309;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid #fed7aa}
  #loading{text-align:center;padding:80px 20px;color:var(--muted)}
  .student-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .student-row:last-child{border-bottom:none}
  .student-row .name{font-weight:700;font-size:14px}
  .student-row .meta{font-size:12px;color:var(--muted)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
  .field input:focus,.field textarea:focus{outline:2px solid #5fbf00;border-color:#5fbf00}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .msg{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:9px;display:none;line-height:1.45}
  .msg.err{display:block;background:#2a1416;color:#c0392b}
  .msg.ok{display:block;background:#122110;color:#1a8a4a}
  .msg.warn{display:block;background:#2a2410;color:#b45309}
  .field input[readonly]{background:#1d2027;color:var(--pink-deep);font-weight:800;cursor:not-allowed}
  .meta-cliente{margin-top:2px}

  /* tela "Meus alunos": detalhe + coluna de alunos */
  .alunos-layout{display:grid;grid-template-columns:1fr 258px;gap:16px;align-items:start;margin-bottom:16px}
  .alunos-col{background:#15171c;border:1px solid var(--line);border-radius:18px;padding:14px;
    box-shadow:0 8px 22px rgba(180,90,140,.06);position:sticky;top:86px}
  .alunos-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .alunos-head h3{font-size:14px;font-weight:800;color:var(--pink-deep)}
  .aluno-search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:10px;font-family:inherit}
  .aluno-search:focus{outline:2px solid #5fbf00;border-color:#5fbf00}
  #alunosLista{max-height:60vh;overflow-y:auto}
  .aluno-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
    border:none;background:none;padding:10px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--txt);cursor:pointer}
  .aluno-item:hover{background:#1d2027}
  .aluno-item.sel{background:linear-gradient(120deg,#1d2027,#262a33);color:var(--pink-deep);font-weight:800}
  .aluno-item .ai-n{font-size:11px;font-weight:800;color:var(--muted);background:#1d2027;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
  .aluno-detalhe{min-height:130px}
  .det-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .det-nome{font-size:18px;font-weight:800}
  .det-sub{font-size:12.5px;color:var(--muted);margin-top:3px;margin-bottom:16px}
  .det-acoes{display:flex;flex-direction:column;gap:8px;max-width:280px}
  .det-acoes .btn{width:100%;text-align:center}
  .det-acoes .btn.ativo{border-color:var(--pink-deep);color:var(--pink-deep);background:#0a0b0d;font-weight:800}
  .prox-aval{background:#1d2027;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
  .prox-aval .pa-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .prox-aval .pa-lbl{font-size:13px;font-weight:700}
  .prox-aval .pa-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .prox-aval input{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .det-acoes .btn{margin-top:0}
  @media(max-width:760px){
    .alunos-layout{grid-template-columns:1fr}
    .alunos-col{position:static;order:-1}
    #alunosLista{max-height:230px}
  }

  /* biblioteca de exercícios */
  .chip-f{border:1px solid var(--line);background:#15171c;color:var(--muted);border-radius:999px;
    padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .chip-f.sel{background:linear-gradient(120deg,#1d2027,#262a33);color:var(--pink-deep);border-color:transparent}
  .ex-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ex-row:last-child{border-bottom:none}
  .ex-thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
  .ex-thumb.ph{display:flex;align-items:center;justify-content:center;background:#1d2027;font-size:20px}
  .ex-info{flex:1;min-width:0}
  .ex-nome{font-weight:700;font-size:14px}
  .ex-meta{font-size:12px;color:var(--muted);margin-top:2px}

  /* montador de ficha (profissional) */
  .fx-row{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
  .fx-row:last-of-type{border-bottom:none}
  .fx-topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .fx-nome{font-weight:700;font-size:13.5px}
  .fx-campos{display:flex;gap:8px;flex-wrap:wrap}
  .fx-campos label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;gap:3px}
  .fx-campos input{width:64px;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .fx-obs{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
  .fx-obs:focus{outline:2px solid #5fbf00;border-color:#5fbf00}
  .fx-add{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .fx-add select{flex:1;min-width:160px;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:13px}
  /* treino (aluno) */
  .tr-ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#15171c}
  .tr-nome{font-weight:800;font-size:14.5px}
  .tr-presc{font-size:13px;color:var(--txt);margin-top:3px}
  .tr-presc b{color:var(--pink-deep)}
  .ficha-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 12px;background:#1d2027;border:1px solid var(--line);border-radius:12px}
  .ficha-head select{padding:8px;border:1px solid var(--line);border-radius:9px;font-size:12.5px}

  /* execução do treino (aluno, tela dedicada) */
  .exec-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:66px;z-index:5;
    background:linear-gradient(180deg,#0a0b0d,#0a0b0dee);padding:10px 0}
  .exec-titulo{font-size:16px;font-weight:800}
  .exec-timer{background:linear-gradient(120deg,#7fff00,#5fbf00);color:#fff;font-weight:800;text-align:center;
    padding:12px;border-radius:14px;margin-bottom:12px;font-size:16px}
  .ex-card{background:#15171c;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(180,90,140,.05)}
  .ex-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ex-card-nome{font-weight:800;font-size:15px}
  .ex-check{border:1.5px solid var(--line);background:#15171c;border-radius:10px;width:40px;height:40px;
    font-size:18px;cursor:pointer;color:var(--muted);flex:0 0 auto;transition:.15s}
  .ex-check:hover{border-color:var(--pink)}
  .ex-card.done{background:#12160b;border-color:#bbeccb}
  .ex-card.done .ex-check{background:#122110;border-color:#bbeccb;color:#1a8a4a;font-weight:800}
  .ex-card.done .ex-card-nome{color:#1a8a4a;text-decoration:line-through;text-decoration-color:#bbeccb}
  .ex-card.done .ex-detalhe{display:none}
  .ser-head{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;font-size:10px;font-weight:800;color:var(--muted);
    text-transform:uppercase;margin:12px 0 6px;text-align:center}
  .ser-row{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
  .ser-num{font-weight:800;color:var(--pink-deep);text-align:center;font-size:13px}
  .ser-in{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center}
  .ser-in:focus{outline:2px solid #5fbf00;border-color:#5fbf00}
  .ser-ok{border:1.5px solid var(--line);background:#15171c;border-radius:10px;padding:10px 0;font-size:15px;cursor:pointer;color:var(--muted)}
  .ser-ok.done{background:#122110;border-color:#bbeccb;color:#1a8a4a;font-weight:800}
  .carga-linha{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .carga-linha label{font-size:12px;font-weight:700;color:var(--muted)}
  .carga-in{width:110px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px;text-align:center;font-weight:700}
  .carga-in:focus{outline:2px solid #5fbf00;border-color:#5fbf00}
  .carga-un{font-size:13px;color:var(--muted);font-weight:700}
  .exec-crono{font-size:12px;font-weight:800;color:var(--pink-deep);background:#15171c;border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;white-space:nowrap}
  /* acesso destacado ao treino (dashboard do aluno) */
  .treino-hero{background:linear-gradient(120deg,#1d2027,#262a33);border:1px solid transparent;border-radius:16px;
    padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .treino-hero .ico-big{font-size:38px;line-height:1}
  .treino-hero h3{margin:0 0 4px;color:var(--pink-deep)}
  .treino-hero p{margin:0;font-size:13px;color:var(--txt)}
  .treino-hero .btn{margin-top:0}

<body>
<nav class="top"><div class="in">

</div></nav>

<div class="wrap">
  <div id="loading">Carregando…</div>
  <div id="content" style="display:none"></div>
</div>

<script>
  const SUPABASE_URL = "https://qubjknesswejsddcapom.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1YmprbmVzc3dlanNkZGNhcG9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNTYzNTYsImV4cCI6MjA5OTkzMjM1Nn0._nDLQ_Q5wN-4eNS0jf-lnyhGHixoZ5_SdXvTvBV_d3E";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
  });

  let ME = null, STUDENTS = [], INVITES = [], ASSESS = [], VIEW = null, EDIT_ID = null, ASSESS_S = null, MANUAL_CALC = false;
  let SELECTED_STUDENT = null, ATIVOS_CACHE = [];
  let EXERCICIOS = [], EX_FILTRO = "";
  let FICHA = null, FICHA_DIAS = [], FICHA_DIA = null, FICHAS_TODAS = [], FICHA_READONLY = false;
  let ALUNO_DIAS = [], ALUNO_DIA = null, ALUNO_EXS = [], ULTIMO_POR_DIA = {};
  let EXEC_SESSAO = null, EXEC_LOGS = {}, ULTIMAS = {}, EXEC_INICIO = null, CRONO_INT = null;
  let EXEC_DIA = null, EXEC_EXS = [], EXEC_DUR = null, RATE_NOTA = 0;
  let EXEC_FEITOS = new Set(), INATIV_INT = null;

  // campos das avaliações
  const DOBRAS = [
    ["tricipital","Tricipital"], ["subescapular","Subescapular"], ["peitoral","Peitoral"],
    ["axilar_media","Axilar média"], ["suprailiaca","Suprailíaca"], ["abdominal","Abdominal"], ["coxa","Coxa"]
  ];
  const PERIMETROS = [
    ["ombro","Ombro"], ["braco_relaxado","Braço relaxado"], ["braco_contraido","Braço contraído"],
    ["cintura","Cintura"], ["abdominal","Abdominal"], ["quadril","Quadril"],
    ["coxa","Coxa"], ["panturrilha","Panturrilha"]
  ];
  const GERAIS = [
    ["weight","Peso"," kg"], ["height","Altura"," cm"], ["body_fat","% Gordura","%"],
    ["lean_mass","Massa magra"," kg"], ["fat_mass","Massa gorda"," kg"]
  ];

  /* sessão expira em 1 hora */
  const DURACAO_MS = 12*60*60*1000;
  function marcarInicio(){ if(!localStorage.getItem("sessao_inicio")) localStorage.setItem("sessao_inicio", String(Date.now())); }
  async function expirouSessao(){
    const ini = Number(localStorage.getItem("sessao_inicio")||0);
    if(ini && Date.now()-ini > DURACAO_MS){
      localStorage.removeItem("sessao_inicio");
      await sb.auth.signOut();
      location.href = "login.html?expirou=1";
      return true;
    }
    return false;
  }
  setInterval(expirouSessao, 60*1000);

  async function sair(){ localStorage.removeItem("sessao_inicio"); await sb.auth.signOut(); location.href = "login.html"; }
  function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
  function fmtDate(d){ if(!d) return "—"; const p=String(d).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
  function shortId(id){ return String(id||"").slice(0,8); }
  function primeiroNome(){ const n=(ME.full_name||"").trim(); return n?n.split(/\s+/)[0]:""; }
  function nomeAluno(s){ return s ? (s.full_name || s.email || ("Aluno "+shortId(s.id))) : "Aluno"; }

  /* ================= INÍCIO ================= */
  async function init(){
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){
      session = await new Promise(res=>{
        const t=setTimeout(()=>res(null), 2500);
        sb.auth.onAuthStateChange((_e,s)=>{ if(s){ clearTimeout(t); res(s); } });
      });
    }
    if(!session){ location.href = "login.html"; return; }
    marcarInicio();
    if(await expirouSessao()) return;
    const user = session.user;
    let { data: profile } = await sb.from("profiles").select("*").eq("id", user.id).single();
    if(!profile) profile = { id:user.id, role:"student", full_name:null, professional_id:null, status:"active" };
    ME = { ...profile, email: user.email };
    // aluno: só mostra "Meu treino" se o profissional já montou algum treino
    if(ME.role === "student"){
      const { count } = await sb.from("ficha_dias").select("id",{count:"exact",head:true}).eq("student_id", ME.id);
      ALUNO_TREINO = (count||0) > 0;
    }
    // profissional voltando do dashboard de um aluno (?aluno=<id>): reabrir esse aluno
    const alunoParam = new URLSearchParams(location.search).get("aluno");
    if(ME.role !== "student" && alunoParam) PENDING_SELECT = alunoParam;
    montar();
  }
  let PENDING_SELECT = null;
  let ALUNO_TREINO = false;
  function alunoTemTreino(){ return ALUNO_TREINO; }

  /* profissionais com o módulo de treino habilitado (por enquanto por e-mail).
     Depois vira uma configuração por profissional no banco. */
  const TREINO_ATIVO = ["teste@profissional.com.br"];
  function temTreino(){ return TREINO_ATIVO.includes((ME.email||"").toLowerCase()); }

  /* ================= MENU / LAYOUT ================= */
  function menuFor(role){
    if(role === "student"){
      const menu = [
        {id:"dash",       label:"Dashboard"},
        {id:"avaliacoes", label:"Avaliações Físicas"}
      ];
      return menu;
    }
    const m = [
      {id:"alunos", label:"Meus alunos", sub:[
        {id:"cadastrar", label:"Cadastrar aluno"},
        {id:"inativos",  label:"Alunos inativos"}
      ]}
    ];
    // módulo de treino só para profissionais habilitados (personal). Nutri (LEVO) não vê.
    if(temTreino()){
      m.push({id:"exercicios", label:"Exercícios"});
      m.push({id:"desempenho", label:"Desempenho"});
    }
    m.push({id:"financeiro", label:"Financeiro"});
    if(role === "creator") m.push({id:"admin", label:"Painel do criador"});
    return m;
  }

  function montar(){
    const role = ME.role || "student";
    const rotulo = {creator:"Criador", professional:"Profissional", student:"Aluno"}[role] || role;
    const first = primeiroNome();
    renderTopo();

    // aluno arquivado: sem menu, só o aviso
    if(role === "student" && ME.status === "archived"){
      document.getElementById("content").innerHTML = `
        <div class="hello">${first ? "Olá, "+esc(first) : "Olá!"}</div>
        <div class="card"><h3>⏸️ Acompanhamento inativo</h3>
        <p>Seu acompanhamento está pausado no momento, então o painel fica indisponível.
           Seu histórico continua guardado. Fale com seu personal trainer para reativar.</p></div>`;
      mostrar();
      return;
    }

    const itens = menuFor(role).map(i=>{
      const main = `<button class="navitem" id="nav_${i.id}" onclick="go('${i.id}')"><span class="lbl">${i.label}</span></button>`;
      if(i.sub && i.sub.length){
        const subs = i.sub.map(s=>
          `<button class="navitem navsub" id="nav_${s.id}" onclick="go('${s.id}')"><span class="lbl">${s.label}</span></button>`).join("");
        return `<div class="navgroup" id="grp_${i.id}">${main}<div class="navsubs">${subs}</div></div>`;
      }
      return main;
    }).join("");

    document.getElementById("content").innerHTML = `
      <div class="hello">${first ? "Olá, "+esc(first)+" 👋" : "Olá! 👋"}</div>
      <div class="role-chip chip-${role}">${rotulo}</div>
      <div class="shell">
        <aside class="sidebar">${itens}</aside>
        <section class="panel" id="panel"></section>
      </div>`;
    mostrar();

    const inicial = !first ? "perfil" : (role === "student" ? "dash" : "alunos");
    go(inicial);
  }

  function mostrar(){
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
  }

  // topo direito (todos os perfis): assinatura · ajuda (+menu) · perfil (foto ou inicial)
  function renderTopo(){
    const box = document.getElementById("topAcoes");
    if(!box || !ME) return;
    const nome = (ME.full_name||"").trim();
    const inicial = nome ? esc(nome[0].toUpperCase()) : "?";
    const avatarInner = ME.avatar ? `<img src="${esc(ME.avatar)}" alt="">` : inicial;
    const gatilho = `<button class="perfil-av" onclick="abrirMenu(event,'perfilMenu')">
           <span class="av-thumb">${avatarInner}</span>
           <span class="av-cap">perfil</span>
         </button>`;
    const assinatura = `<button class="perfil-av" onclick="assinaturaInfo()">
           <span class="av-thumb av-money">$</span>
           <span class="av-cap">assinatura</span>
         </button>`;
    const ajuda = `<button class="perfil-av" onclick="abrirAjuda()">
           <span class="av-thumb av-help">?</span>
           <span class="av-cap">ajuda</span>
         </button>`;
    const menuItems = `
      <button onclick="go('perfil')">Meu perfil</button>
      <button onclick="sair()">Sair</button>`;
    box.innerHTML = `<div class="top-tiles">
           ${assinatura}
           <span class="menu-anchor">
             ${ajuda}
             <span class="menu-drop" id="perfilMenu">${menuItems}</span>
           </span>
           ${gatilho}
         </div>`;
  }

  function go(id){
    VIEW = id;
    if(typeof pararDescanso==="function") pararDescanso();
    const cont = document.getElementById("content"); if(cont) cont.classList.remove("modo-treino");
    // mantém o cronômetro do treino rodando ao navegar; só encerra se não há treino ativo
    if(!EXEC_SESSAO && typeof pararCronoTreino==="function") pararCronoTreino();
    document.querySelectorAll(".navitem").forEach(b=>b.classList.remove("active"));
    const nav = document.getElementById("nav_"+id); if(nav) nav.classList.add("active");
    // expande o grupo "Meus alunos" quando estiver em qualquer subitem
    document.querySelectorAll(".navgroup").forEach(g=>g.classList.remove("open"));
    if(["alunos","cadastrar","inativos"].includes(id)){
      const grp = document.getElementById("grp_alunos"); if(grp) grp.classList.add("open");
    }
    const p = document.getElementById("panel"); if(!p) return;

    if(id === "dash")      p.innerHTML = viewDash();
    else if(id === "avaliacoes"){ p.innerHTML = viewAvaliacoes(); carregarMinhasAvaliacoes(); }
    else if(id === "meutreino"){  p.innerHTML = viewMeuTreino();  carregarMeuTreino(); }
    else if(id === "consultas"){  p.innerHTML = viewConsultas();  carregarMinhasConsultas(); }
    else if(id === "perfil"){ p.innerHTML = viewPerfil(); }
    else if(id === "assinatura"){ p.innerHTML = viewAssinatura(); }
    else if(id === "admin")p.innerHTML = viewAdmin();
    else if(id === "alunos"){    p.innerHTML = viewAlunos();    loadStudents(); }
    else if(id === "cadastrar"){ p.innerHTML = viewCadastrar(); loadStudents(); }
    else if(id === "exercicios"){ p.innerHTML = viewExercicios(); loadExercicios(); }
    else if(id === "desempenho"){ p.innerHTML = viewDesempenho(); carregarDesempenho(); }
    else if(id === "financeiro"){ p.innerHTML = viewFinanceiro(); carregarFinanceiro(); }
    else if(id === "inativos"){  p.innerHTML = viewInativos();  loadStudents(); }
    atualizarPill();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  // pílula flutuante "treino em andamento" (aparece fora da tela de execução)
  function atualizarPill(){
    let pill = document.getElementById("treinoPill");
    if(EXEC_SESSAO){
      if(!pill){ pill = document.createElement("div"); pill.id="treinoPill"; pill.className="treino-pill"; document.body.appendChild(pill); }
      pill.innerHTML = `<span class="tp-lbl">🏋️ Treino em andamento</span>
        <span class="tp-crono js-crono">⏲️ 00:00</span>
        <button class="tp-go" onclick="retomarTreino()">Retomar</button>
        <button class="tp-x" title="Descartar treino" onclick="descartarDoPill()">✕</button>`;
      tickCrono();
    } else if(pill){ pill.remove(); }
  }
  function retomarTreino(){
    if(!EXEC_SESSAO || !EXEC_DIA) return;
    renderExecucao(EXEC_DIA, EXEC_EXS);
  }
  async function descartarDoPill(){
    if(!confirm("Descartar este treino em andamento? Nada será registrado.")) return;
    await descartarTreino();
  }

  /* ================= TELAS: ALUNO ================= */
  function viewDash(){
    const heroTreino = (ME.role === "student" && alunoTemTreino()) ? `
      <div class="treino-hero">
        <div class="ico-big">🏋️</div>
        <div style="flex:1;min-width:180px">
          <h3>Seu treino de hoje</h3>
          <p>Veja o treino que seu personal montou, siga as orientações e registre suas cargas.</p>
        </div>
        <button class="btn" onclick="go('meutreino')">Acessar meu treino →</button>
      </div>` : "";
    return `<h2>Dashboard</h2>
      ${heroTreino}
      <div class="card">
        <h3>📊 Sua evolução</h3>
        <p>Acompanhe seu peso, composição corporal e a frequência dos seus treinos ao longo do tempo.</p>
        <a class="btn" href="dashboard.html">Abrir meu dashboard →</a>
      </div>`;
  }

  async function conectarPeloDash(){
    const msg = document.getElementById("ctaMsg");
    const { data: bot, error } = await sb.rpc("meu_bot_telegram");
    if(error || !bot){
      msg.className="msg err";
      msg.textContent="Seu personal trainer ainda não ativou os reports por Telegram.";
      return;
    }
    gerarLinkTelegram(bot, "ctaMsg");
  }

  function cardTelegram(){
    return `
      <div class="card">
        <h3>💬 Reports pelo Telegram</h3>
        <div id="tgBox"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  async function carregarTelegram(){
    const box = document.getElementById("tgBox");
    if(!box) return;
    const { data: bot, error } = await sb.rpc("meu_bot_telegram");
    if(error || !bot){
      box.innerHTML = `<div class="empty">Seu personal trainer ainda não ativou os reports por Telegram.</div>`;
      return;
    }
    if(ME.telegram_chat_id){
      box.innerHTML = `
        <p>✅ <b>Conectado.</b> É só mandar mensagem para <b>@${esc(bot)}</b> contando como foi o seu dia —
           treino, alimentação, sono — com as suas palavras. Eu registro tudo automaticamente.</p>
        <a class="btn small" href="https://t.me/${encodeURIComponent(bot)}" target="_blank">Abrir conversa</a>
        <button class="btn small ghost" onclick="gerarLinkTelegram('${esc(bot)}')">Reconectar</button>`;
      return;
    }
    box.innerHTML = `
      <p>Envie seus reports por mensagem, do jeito que preferir escrever. Conecte uma vez e pronto.</p>
      <button class="btn small" onclick="gerarLinkTelegram('${esc(bot)}')">Conectar meu Telegram</button>
      <div class="msg" id="tgMsg"></div>`;
  }

  async function gerarLinkTelegram(bot, idMsg){
    const msg = document.getElementById(idMsg || "tgMsg");
    const { data: token, error } = await sb.rpc("meu_token_telegram");
    if(error || !token){
      if(msg){ msg.className="msg err"; msg.textContent="Não consegui gerar seu link agora. Tente de novo."; }
      return;
    }
    if(msg){
      msg.className="msg ok";
      msg.textContent="Abrindo o Telegram… toque em INICIAR para concluir e depois recarregue esta página.";
    }
    window.open(`https://t.me/${bot}?start=${token}`, "_blank");
  }

  async function definirSenha(){
    const p1=document.getElementById("np1").value, p2=document.getElementById("np2").value;
    const msg=document.getElementById("pwMsg"), btn=document.getElementById("pwBtn");
    if(p1.length<6){ msg.className="msg err"; msg.textContent="A senha precisa ter ao menos 6 caracteres."; return; }
    if(p1!==p2){ msg.className="msg err"; msg.textContent="As senhas não coincidem."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.auth.updateUser({ password:p1 });
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro: "+error.message; return; }
    msg.className="msg ok"; msg.textContent="Senha salva! Já pode entrar com e-mail e senha.";
    document.getElementById("np1").value=""; document.getElementById("np2").value="";
  }

  /* ---------- ALUNO: AVALIAÇÕES FÍSICAS ---------- */
  function viewAvaliacoes(){
    return `<h2>Avaliações Físicas</h2>
      <div class="card">
        <h3>Próxima avaliação</h3>
        <div id="proxAvalAluno" style="margin-top:8px"><div class="empty">Carregando…</div></div>
      </div>
      <div class="card">
        <h3>📋 Minhas avaliações</h3>
        <p>Todos os dados levantados pelo seu personal trainer, da mais recente para a mais antiga.</p>
        <div id="avalBox" style="margin-top:12px"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  function fmtDataHora(v){
    if(!v) return "—";
    const d = new Date(v);
    if(isNaN(d)) return fmtDate(v);
    return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  function med(rot, val, un){
    if(val==null || val==="") return "";
    return `<div class="med"><span>${rot}</span><b>${Number(val).toLocaleString("pt-BR",{maximumFractionDigits:1})}${un}</b></div>`;
  }

  async function carregarMinhasAvaliacoes(){
    carregarProxAvalAluno();
    const box = document.getElementById("avalBox");
    const { data, error } = await sb.from("assessments").select("*")
      .eq("student_id", ME.id).order("date",{ascending:false});
    if(!box) return;
    if(error){ box.innerHTML = `<div class="empty">Erro ao carregar: ${esc(error.message)}</div>`; return; }
    if(!data || !data.length){
      box.innerHTML = `<div class="empty">Você ainda não tem avaliações registradas.<br>Elas aparecerão aqui assim que seu personal trainer lançar a primeira.</div>`;
      return;
    }
    AVAL_SEXO = ME.sex || "";
    box.innerHTML = data.map((a,idx)=>avaliacaoDetalhe(a,idx)).join("");
  }

  async function carregarProxAvalAluno(){
    const box = document.getElementById("proxAvalAluno");
    if(!box) return;
    const { data } = await sb.from("consultations").select("scheduled_at,notes")
      .eq("student_id", ME.id).order("scheduled_at",{ascending:true});
    const agora = new Date();
    const futuras = (data||[]).filter(c=>new Date(c.scheduled_at) >= agora);
    if(futuras.length){
      const p = futuras[0];
      box.innerHTML = `<div class="proxima">
          <div class="quando">${fmtDataHora(p.scheduled_at)}</div>
          ${p.notes ? `<div class="obs">${esc(p.notes)}</div>` : ""}
        </div>`;
    }else{
      box.innerHTML = `<div class="empty">Nenhuma data de avaliação agendada ainda.</div>`;
    }
  }

  /* ---------- ALUNO: MEU TREINO ---------- */
  function viewMeuTreino(){
    return `<h2>Meu treino</h2>
      <div class="card">
        <h3>🏋️ Treino montado pelo seu personal</h3>
        <div id="treinoResumo"></div>
        <div id="treinoBoxAluno"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  // "há X dias" a partir de uma data
  function haQuantoTempo(v){
    if(!v) return null;
    const d = new Date(v); if(isNaN(d)) return null;
    const dias = Math.floor((Date.now() - d.getTime())/86400000);
    if(dias <= 0) return "hoje";
    if(dias === 1) return "ontem";
    return "há " + dias + " dias";
  }

  async function carregarMeuTreino(){
    const { data: fichas } = await sb.from("fichas").select("*").eq("student_id", ME.id).eq("ativa", true).limit(1);
    const box = document.getElementById("treinoBoxAluno");
    if(!fichas || !fichas.length){ if(box) box.innerHTML = `<div class="empty">Seu personal ainda não montou um treino.</div>`; return; }
    const ficha = fichas[0];
    const { data: dias } = await sb.from("ficha_dias").select("*").eq("ficha_id", ficha.id).order("ordem");
    ALUNO_DIAS = dias || [];
    if(!ALUNO_DIAS.length){ if(box) box.innerHTML = `<div class="empty">Seu personal ainda não adicionou os dias do treino.</div>`; return; }
    ALUNO_DIA = null; // abre a lista sem nenhum treino aberto; só abre ao clicar
    // carrega os exercícios de todos os dias de uma vez
    const { data: exs } = await sb.from("ficha_exercicios").select("*").eq("ficha_id", ficha.id).order("ordem");
    ALUNO_EXS = exs || [];
    // último treino executado por dia (sessões finalizadas)
    ULTIMO_POR_DIA = {};
    const { data: sess } = await sb.from("sessoes").select("dia_id,data")
      .eq("student_id", ME.id).eq("finalizada", true).order("data",{ascending:false});
    (sess||[]).forEach(s=>{ if(s.dia_id && !(s.dia_id in ULTIMO_POR_DIA)) ULTIMO_POR_DIA[s.dia_id] = s.data; });
    renderResumoTreinos();
    renderAlunoExs();
    await retomarTreinoLS();
  }

  // retoma um treino em andamento após recarregar a página (via localStorage)
  async function retomarTreinoLS(){
    if(EXEC_SESSAO) { atualizarPill(); return; }
    let t; try{ t = JSON.parse(localStorage.getItem("treino_ativo")||"null"); }catch(e){ t=null; }
    if(!t || !t.id) return;
    const { data: s } = await sb.from("sessoes").select("*").eq("id", t.id).single();
    if(!s || s.finalizada){ limparTreinoLS(); return; }
    const dia = ALUNO_DIAS.find(d=>d.id===t.diaId);
    if(!dia){ limparTreinoLS(); return; }
    EXEC_SESSAO = s; EXEC_INICIO = t.inicio || Date.now();
    EXEC_DIA = dia; EXEC_EXS = ALUNO_EXS.filter(x=>x.dia_id===t.diaId);
    EXEC_FEITOS = new Set(); EXEC_LOGS = {};
    // recupera as cargas já registradas nesta sessão
    const { data: sf } = await sb.from("series_feitas").select("id,ficha_exercicio_id,carga").eq("sessao_id", s.id);
    (sf||[]).forEach(r=>{ if(r.ficha_exercicio_id) EXEC_LOGS[r.ficha_exercicio_id] = { id:r.id, carga:r.carga }; });
    retomarCrono(); iniciarInatividade(); atualizarPill();
  }

  // lista de treinos disponíveis x último dia treinado (estilo MFIT)
  function renderResumoTreinos(){
    const r = document.getElementById("treinoResumo");
    if(!r) return;
    r.innerHTML = `<div class="treino-lista">` + ALUNO_DIAS.map(d=>{
      const qtd = ALUNO_EXS.filter(x=>x.dia_id===d.id).length;
      const ult = haQuantoTempo(ULTIMO_POR_DIA[d.id]);
      const ultTxt = ult ? `Último treino: ${ult}` : "Você ainda não fez este treino";
      return `<button class="treino-linha ${d.id===ALUNO_DIA?"sel":""}" onclick="selDiaAluno('${d.id}')">
        <span>
          <span class="tl-nome">${esc(d.label)}</span>
          <span class="tl-ult">${qtd} exercício${qtd===1?"":"s"} · ${ultTxt}</span>
        </span>
        <span class="tl-seta">›</span>
      </button>`;
    }).join("") + `</div>`;
  }

  function selDiaAluno(id){ ALUNO_DIA = id; renderResumoTreinos(); renderAlunoExs(); window.scrollTo({top:0,behavior:"smooth"}); }

  // ícone/emoji por grupo muscular (placeholder até termos imagens/GIFs reais)
  function iconeExercicio(x){
    const t = ((x.grupo||"") + " " + (x.nome_cache||"")).toLowerCase();
    if(/perna|quadr|leg|agach?|afundo|glúte|gluteo|panturr|coxa/.test(t)) return "🦵";
    if(/peito|supino|crucifixo|peck/.test(t)) return "🫁";
    if(/costa|remada|pux|puxada|barra|dorsal/.test(t)) return "🔙";
    if(/ombro|desenvolv|elevação|elevacao|deltoid/.test(t)) return "🙆";
    if(/bíceps|biceps|rosca/.test(t)) return "💪";
    if(/tríceps|triceps|testa|corda|francês|frances/.test(t)) return "🦾";
    if(/abd|core|prancha|obliqu/.test(t)) return "🧘";
    if(/aeró|aero|corrida|esteira|bike|cardio/.test(t)) return "🏃";
    return "🏋️";
  }

  function renderAlunoExs(){
    const box = document.getElementById("treinoBoxAluno");
    if(!box) return;
    if(!ALUNO_DIA){ box.innerHTML = `<div class="empty">Selecione um treino acima para ver os exercícios.</div>`; return; }
    const lista = ALUNO_EXS.filter(x=>x.dia_id===ALUNO_DIA);
    const dia = ALUNO_DIAS.find(d=>d.id===ALUNO_DIA);
    if(!lista.length){ box.innerHTML = `<div class="empty">Sem exercícios neste dia.</div>`; return; }
    const titulo = `<div style="font-weight:800;font-size:15px;margin:14px 0 4px">${esc(dia?dia.label:"Treino")}</div>`;
    const podeMarcar = (ME.modalidade||"online") !== "presencial";
    const btnIniciar = podeMarcar
      ? `<button class="btn" style="margin:6px 0 14px" onclick="iniciarTreino('${ALUNO_DIA}')">▶ Iniciar este treino</button>`
      : `<div class="tr-obs" style="margin:6px 0 14px">📍 Treino presencial — a presença é registrada pelo seu personal.</div>`;
    box.innerHTML = titulo + btnIniciar + lista.map(x=>{
      const partes = [];
      if(x.series!=null && x.reps) partes.push(`<b>${x.series}x${esc(x.reps)}</b>`);
      else if(x.series!=null) partes.push(`<b>${x.series} séries</b>`);
      if(x.carga_alvo!=null) partes.push(`${x.carga_alvo} kg`);
      if(x.descanso_seg!=null) partes.push(`descanso ${x.descanso_seg}s`);
      const img = x.media_url ? `<img src="${esc(x.media_url)}" alt="">` : iconeExercicio(x);
      return `<div class="tr-ex">
        <div class="tr-ex-row">
          <div class="ex-thumb-al">${img}</div>
          <div class="tr-ex-body">
            <div class="tr-nome">${esc(x.nome_cache||"Exercício")}</div>
            <div class="tr-presc">${partes.join(" · ")||"—"}</div>
            ${x.obs?`<div class="tr-obs">📝 ${esc(x.obs)}</div>`:""}
          </div>
        </div>
      </div>`;
    }).join("");
  }

  /* ---------- ALUNO: EXECUÇÃO DO TREINO (tela dedicada) ---------- */
  async function iniciarTreino(diaId){
    const dia = ALUNO_DIAS.find(d=>d.id===diaId);
    const exs = ALUNO_EXS.filter(x=>x.dia_id===diaId);
    if(!exs.length){ alert("Este treino não tem exercícios."); return; }

    // cria a sessão
    const { data: sess, error } = await sb.from("sessoes").insert({
      student_id: ME.id, professional_id: dia.professional_id,
      dia_id: diaId, ficha_id: dia.ficha_id, finalizada: false
    }).select().single();
    if(error){ alert("Erro ao iniciar: "+error.message); return; }
    EXEC_SESSAO = sess;
    EXEC_LOGS = {};

    // carga da última vez, por exercício
    const exIds = exs.map(e=>e.exercicio_id).filter(Boolean);
    ULTIMAS = {};
    if(exIds.length){
      const { data: hist } = await sb.from("series_feitas").select("exercicio_id,carga,created_at")
        .eq("student_id", ME.id).in("exercicio_id", exIds)
        .not("sessao_id","is",null).order("created_at",{ascending:false}).limit(300);
      (hist||[]).forEach(h=>{ if(h.exercicio_id && !(h.exercicio_id in ULTIMAS) && h.carga!=null) ULTIMAS[h.exercicio_id]=h.carga; });
    }
    EXEC_DIA = dia; EXEC_EXS = exs;
    EXEC_FEITOS = new Set();
    renderExecucao(dia, exs);
    iniciarCronoTreino();
    iniciarInatividade();
    salvarTreinoLS();
  }

  /* estado do treino ativo salvo no aparelho — sobrevive a recarregar / navegar */
  function salvarTreinoLS(){
    if(!EXEC_SESSAO || !EXEC_DIA) return;
    try{ localStorage.setItem("treino_ativo", JSON.stringify({ id:EXEC_SESSAO.id, inicio:EXEC_INICIO, diaId:EXEC_DIA.id })); }catch(e){}
  }
  function limparTreinoLS(){ try{ localStorage.removeItem("treino_ativo"); }catch(e){} }

  /* aviso de inatividade: 15 min sem marcar nenhum exercício */
  function iniciarInatividade(){
    clearInterval(INATIV_INT);
    INATIV_INT = setInterval(()=>{ if(EXEC_SESSAO && EXEC_FEITOS.size===0) mostrarNudgeInatividade(); }, 15*60*1000);
  }
  function pararInatividade(){ clearInterval(INATIV_INT); }
  function mostrarNudgeInatividade(){
    if(document.getElementById("nudgeModal")) return;
    const ov = document.createElement("div");
    ov.id = "nudgeModal"; ov.className = "modal-ov";
    ov.innerHTML = `
      <div class="modal-cx">
        <h3 style="margin:0 0 6px">Ainda está treinando? 🏋️</h3>
        <p class="meta-sm" style="margin:0 0 16px">Faz um tempo que você começou e ainda não marcou nenhum exercício. Se já terminou, não esqueça de <b>finalizar o treino</b> para ele ser registrado.</p>
        <button class="btn" style="width:100%;margin-bottom:8px" onclick="fecharNudge()">Continuar treinando</button>
        <button class="btn ghost" style="width:100%" onclick="fecharNudge();retomarTreino();finalizarTreino()">Encerrar treino</button>
      </div>`;
    document.body.appendChild(ov);
  }
  function fecharNudge(){ const m=document.getElementById("nudgeModal"); if(m) m.remove(); }

  function renderExecucao(dia, exs){
    const p = document.getElementById("panel");
    const cards = exs.map((x,i)=>{
      const ult = ULTIMAS[x.exercicio_id];
      const alvo = [];
      if(x.series!=null && x.reps) alvo.push(`${x.series}x${esc(x.reps)}`);
      if(x.carga_alvo!=null) alvo.push(`alvo ${x.carga_alvo} kg`);
      const descBtn = (x.descanso_seg!=null) ?
        `<button class="desc-btn" onclick="descanso(${x.descanso_seg})">⏱️ Descansar ${x.descanso_seg}s</button>` : "";
      return `<div class="ex-card${EXEC_FEITOS.has(x.id)?" done":""}" id="exc_${x.id}">
        <div class="ex-card-top">
          <div class="ex-card-nome">${esc(x.nome_cache||"Exercício")}</div>
          <button class="ex-check" onclick="toggleExDone('${x.id}')" title="Marcar como concluído">✓</button>
        </div>
        <div class="ex-detalhe">
          <div class="meta-sm">${alvo.join(" · ")}${ult!=null?` · última vez: ${ult} kg`:""}</div>
          ${x.obs?`<div class="tr-obs" style="margin-top:8px">📝 ${esc(x.obs)}</div>`:""}
          <div class="carga-linha">
            <label>Carga usada</label>
            <input class="carga-in" type="number" step="0.5" placeholder="${ult!=null?ult:"kg"}" value="${(EXEC_LOGS[x.id]&&EXEC_LOGS[x.id].carga!=null)?EXEC_LOGS[x.id].carga:(ult??"")}"
                   onchange="salvarCarga('${x.id}','${x.exercicio_id||""}',this.value)">
            <span class="carga-un">kg</span>
            ${descBtn}
          </div>
        </div>
      </div>`;
    }).join("");

    p.innerHTML = `
      <div class="exec-top">
        <button class="btn small ghost" title="Voltar (o treino continua contando)" onclick="minimizarTreino()">←</button>
        <div style="flex:1;text-align:center">
          <div class="exec-titulo">${esc(dia.label)}</div>
          <span class="exec-crono js-crono" id="execCrono">⏲️ 00:00</span>
        </div>
        <span style="width:40px"></span>
      </div>
      ${cards}
      <button class="btn" style="width:100%;margin-top:8px" onclick="finalizarTreino()">✅ Finalizar treino</button>`;
    const cont = document.getElementById("content"); if(cont) cont.classList.add("modo-treino");
    const pill = document.getElementById("treinoPill"); if(pill) pill.remove();
    tickCrono();
    window.scrollTo({top:0});
  }

  function toggleExDone(id){
    const card = document.getElementById("exc_"+id);
    if(!card) return;
    const done = card.classList.toggle("done");
    if(done) EXEC_FEITOS.add(id); else EXEC_FEITOS.delete(id);
  }
  function minimizarTreino(){ go("meutreino"); }   // volta ao app; o treino continua ativo (pílula + cronômetro)

  async function salvarCarga(fichaExId, exId, carga){
    let atual = EXEC_LOGS[fichaExId] || {};
    atual.carga = carga===""?null:Number(carga);
    EXEC_LOGS[fichaExId] = atual;
    const payload = {
      sessao_id: EXEC_SESSAO.id, student_id: ME.id, professional_id: EXEC_SESSAO.professional_id,
      ficha_exercicio_id: fichaExId, exercicio_id: exId||null, serie_num: 1,
      carga: atual.carga, reps: null
    };
    if(atual.id){ await sb.from("series_feitas").update(payload).eq("id", atual.id); }
    else {
      const { data } = await sb.from("series_feitas").insert(payload).select("id").single();
      if(data) EXEC_LOGS[fichaExId].id = data.id;
    }
  }

  async function salvarSerie(fichaExId, exId, serie, carga, reps){
    const chave = fichaExId + "_" + serie;
    let atual = EXEC_LOGS[chave] || { carga:null, reps:null };
    if(carga!==null) atual.carga = carga===""?null:Number(carga);
    if(reps!==null)  atual.reps  = reps===""?null:Number(reps);
    EXEC_LOGS[chave] = atual;
    const payload = {
      sessao_id: EXEC_SESSAO.id, student_id: ME.id, professional_id: EXEC_SESSAO.professional_id,
      ficha_exercicio_id: fichaExId, exercicio_id: exId||null, serie_num: serie,
      carga: atual.carga, reps: atual.reps
    };
    if(atual.id){ await sb.from("series_feitas").update(payload).eq("id", atual.id); }
    else {
      const { data } = await sb.from("series_feitas").insert(payload).select("id").single();
      if(data) EXEC_LOGS[chave].id = data.id;
    }
  }

  let TIMER_INT = null;
  // cronômetro de descanso flutuante — funciona tanto na visão do treino quanto na execução
  function descanso(seg){
    clearInterval(TIMER_INT);
    let bar = document.getElementById("descFloat");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "descFloat"; bar.className = "desc-float";
      document.body.appendChild(bar);
    }
    let t = seg;
    const render = (txt)=>{ bar.innerHTML = `<span id="descTxt">${txt}</span>
      <button onclick="pararDescanso()">Parar</button>`; };
    const tick = ()=>{
      if(t<=0){ clearInterval(TIMER_INT);
        pararDescanso();
        try{ navigator.vibrate && navigator.vibrate([400,150,400,150,400]); }catch(e){}
        mostrarFimDescanso();
        return; }
      render("⏱️ Descanso: " + t + "s"); t--;
    };
    tick(); TIMER_INT = setInterval(tick, 1000);
  }
  function pararDescanso(){
    clearInterval(TIMER_INT);
    const bar = document.getElementById("descFloat");
    if(bar) bar.remove();
  }
  // alerta grande de fim de descanso (vibra + símbolo + botão OK)
  function mostrarFimDescanso(){
    if(document.getElementById("restDone")) return;
    const ov = document.createElement("div");
    ov.id = "restDone"; ov.className = "rest-done-ov";
    ov.innerHTML = `
      <div class="rest-done-cx">
        <div class="rest-done-ico">✓</div>
        <div class="rest-done-txt">Descanso concluído!</div>
        <div class="rest-done-sub">Bora para a próxima série 💪</div>
        <button class="btn" onclick="fecharFimDescanso()">OK, continuar</button>
      </div>`;
    document.body.appendChild(ov);
  }
  function fecharFimDescanso(){
    try{ navigator.vibrate && navigator.vibrate(0); }catch(e){}
    const m = document.getElementById("restDone"); if(m) m.remove();
  }

  // cronômetro de DURAÇÃO do treino (conta pra cima desde o iniciar)
  function tickCrono(){
    if(!EXEC_INICIO) return;
    const s = Math.floor((Date.now()-EXEC_INICIO)/1000);
    const txt = "⏲️ " + String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
    document.querySelectorAll(".js-crono").forEach(el=> el.textContent = txt);
  }
  function iniciarCronoTreino(){ clearInterval(CRONO_INT); EXEC_INICIO = Date.now(); tickCrono(); CRONO_INT = setInterval(tickCrono, 1000); }
  function retomarCrono(){ clearInterval(CRONO_INT); if(!EXEC_INICIO) EXEC_INICIO = Date.now(); tickCrono(); CRONO_INT = setInterval(tickCrono, 1000); }
  function pausarCrono(){ clearInterval(CRONO_INT); }                 // mantém EXEC_INICIO
  function pararCronoTreino(){ clearInterval(CRONO_INT); EXEC_INICIO = null; }

  function finalizarTreino(){
    const total = EXEC_EXS.length;
    const feitos = EXEC_FEITOS.size;
    const faltam = total - feitos;
    if(faltam > 0){
      if(document.getElementById("faltaModal")) return;
      const ov = document.createElement("div");
      ov.id = "faltaModal"; ov.className = "modal-ov";
      ov.innerHTML = `
        <div class="modal-cx">
          <h3 style="margin:0 0 6px">Exercícios não concluídos</h3>
          <p class="meta-sm" style="margin:0 0 16px">Você marcou <b>${feitos} de ${total}</b> exercícios. ${faltam===1?"Falta 1 exercício":"Faltam "+faltam+" exercícios"} sem check. Deseja encerrar mesmo assim?</p>
          <button class="btn" style="width:100%;margin-bottom:8px" onclick="fecharFaltaModal();irParaAvaliacao()">Encerrar mesmo assim</button>
          <button class="btn ghost" style="width:100%" onclick="fecharFaltaModal()">↩️ Voltar ao treino</button>
        </div>`;
      document.body.appendChild(ov);
      return;
    }
    irParaAvaliacao();
  }
  function fecharFaltaModal(){ const m=document.getElementById("faltaModal"); if(m) m.remove(); }

  // vai para a tela de avaliação do treino
  function irParaAvaliacao(){
    pararDescanso();
    EXEC_DUR = EXEC_INICIO ? Math.floor((Date.now()-EXEC_INICIO)/60000) : null;
    pausarCrono();
    RATE_NOTA = 0;
    renderAvaliacaoTreino();
  }

  function renderAvaliacaoTreino(){
    const p = document.getElementById("panel");
    const estrelas = [1,2,3,4,5].map(n=>`<button class="rate-star" data-n="${n}" onclick="setNota(${n})">★</button>`).join("");
    p.innerHTML = `
      <div class="exec-top"><div class="exec-titulo" style="flex:1;text-align:center">Como foi o treino?</div></div>
      <div class="ex-card">
        <p class="meta-sm" style="margin:0 0 12px">${EXEC_DUR!=null?`Treino de ${EXEC_DUR} min. `:""}Dê uma nota e, se quiser, deixe um comentário para seu personal.</p>
        <div class="rate-stars" id="rateStars">${estrelas}</div>
        <div class="rate-lbl" id="rateLbl">Toque nas estrelas para avaliar</div>
        <textarea id="rateComentario" class="rate-txt" placeholder="Como você se sentiu? Alguma dor, dificuldade ou recado para o personal? (opcional)"></textarea>
        <button class="btn" style="width:100%;margin-top:4px" onclick="concluirComAvaliacao()">✅ Concluir treino</button>
        <button class="btn ghost" style="width:100%;margin-top:8px" onclick="cancelarAvaliacao()">↩️ Voltar ao treino</button>
      </div>`;
    window.scrollTo({top:0});
  }

  function setNota(n){
    RATE_NOTA = n;
    document.querySelectorAll("#rateStars .rate-star").forEach(b=> b.classList.toggle("on", Number(b.dataset.n) <= n));
    const labels = {1:"Muito puxado 😣",2:"Difícil 😅",3:"Ok 🙂",4:"Bom 💪",5:"Excelente 🔥"};
    const l = document.getElementById("rateLbl"); if(l) l.textContent = labels[n] || "";
  }

  function cancelarAvaliacao(){
    renderExecucao(EXEC_DIA, EXEC_EXS);
    retomarCrono();
  }

  async function concluirComAvaliacao(){
    const cEl = document.getElementById("rateComentario");
    const coment = cEl && cEl.value.trim() ? cEl.value.trim() : null;
    const dur = EXEC_DUR;
    pararCronoTreino(); pararInatividade(); limparTreinoLS();
    // tenta salvar nota+comentário; se as colunas ainda não existem, finaliza mesmo assim
    const { error } = await sb.from("sessoes").update({ finalizada:true, nota: RATE_NOTA||null, comentario: coment }).eq("id", EXEC_SESSAO.id);
    if(error){ await sb.from("sessoes").update({ finalizada:true }).eq("id", EXEC_SESSAO.id); }
    EXEC_SESSAO = null;
    go("meutreino");
    const msg = dur!=null ? `✅ Treino registrado em ${dur} min! Bom trabalho. 💪` : "✅ Treino registrado! Bom trabalho. 💪";
    setTimeout(()=>{ const b=document.getElementById("treinoBoxAluno"); if(b) b.insertAdjacentHTML("afterbegin", `<div class="msg ok" style="display:block">${msg}</div>`); }, 400);
  }

  function sairExecucao(){
    if(document.getElementById("sairModal")) return;
    const ov = document.createElement("div");
    ov.id = "sairModal"; ov.className = "modal-ov";
    ov.innerHTML = `
      <div class="modal-cx">
        <h3 style="margin:0 0 6px">Sair do treino?</h3>
        <p class="meta-sm" style="margin:0 0 16px">As cargas que você já registrou ficam guardadas se você salvar. Para contar como treino concluído, use “✅ Finalizar treino”.</p>
        <button class="btn" style="width:100%;margin-bottom:8px" onclick="salvarESair()">💾 Salvar e sair</button>
        <button class="btn ghost" style="width:100%;margin-bottom:8px" onclick="descartarTreino()">🗑️ Sair sem salvar</button>
        <button class="btn ghost" style="width:100%" onclick="fecharModalSair()">↩️ Voltar ao treino</button>
      </div>`;
    document.body.appendChild(ov);
  }
  function fecharModalSair(){ const m = document.getElementById("sairModal"); if(m) m.remove(); }

  async function salvarESair(){
    fecharModalSair();
    pararDescanso(); pararCronoTreino();
    EXEC_SESSAO = null;

  function redimensionarImagem(file, max){
    return new Promise((res, rej)=>{
      const img = new Image();
      img.onload = ()=>{
        const escala = Math.min(1, max/Math.max(img.width, img.height));
        const cw = Math.round(img.width*escala), ch = Math.round(img.height*escala);
        const cv = document.createElement("canvas"); cv.width=cw; cv.height=ch;
        cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
        res(cv.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  async function uploadFoto(ev){
    const file = ev.target.files && ev.target.files[0];
    const msg = document.getElementById("fotoMsg");
    if(!file) return;
    if(msg){ msg.className="msg"; msg.textContent="Enviando…"; }
    try{
      const dataUrl = await redimensionarImagem(file, 256);
      const { error } = await sb.from("profiles").update({ avatar:dataUrl }).eq("id", ME.id);
      if(error){ if(msg){ msg.className="msg err"; msg.textContent="Erro ao salvar: "+error.message; } return; }
      ME.avatar = dataUrl;
      const pv = document.getElementById("fotoPreview"); if(pv) pv.innerHTML = `<img src="${esc(dataUrl)}" alt="">`;
      const rem = document.getElementById("fotoRem"); if(rem) rem.style.display = "";
      if(msg){ msg.className="msg ok"; msg.textContent="✅ Foto atualizada!"; }
      renderTopo();
    }catch(e){ if(msg){ msg.className="msg err"; msg.textContent="Não consegui processar a imagem."; } }
  }

  async function assinarPlano(nome){

    if(!plano){ alert("O LEVO Light é gratuito — não há o que pagar. 🙂"); return; }
    try{
      const { data:{ session } } = await sb.auth.getSession();
      if(!session){ alert("Faça login para assinar."); return; }
      const resp = await fetch(SUPABASE_URL + "/functions/v1/criar-assinatura", {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Authorization": "Bearer " + session.access_token

        body: JSON.stringify({ plano })
      });
      const data = await resp.json().catch(()=>({}));
      if(!resp.ok || !data.init_point){
        alert("Não consegui iniciar a assinatura: " + (data.error || ("erro "+resp.status)));
        return;

      // redireciona para o checkout do Mercado Pago
      window.location.href = data.init_point;

  async function loadExercicios(){
    const { data, error } = await sb.from("exercicios").select("*").order("grupo").order("nome");
    if(error){ const b=document.getElementById("exLista"); if(b) b.innerHTML=`<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
    EXERCICIOS = data || [];
    EX_FILTRO = "";
    const f = document.getElementById("exFiltros");
    if(f){
      const grupos = [...new Set(EXERCICIOS.map(e=>e.grupo).filter(Boolean))].sort();
      f.innerHTML = [`<button class="chip-f sel" data-g="" onclick="filtrarGrupo('')">Todos</button>`]
        .concat(grupos.map(g=>`<button class="chip-f" data-g="${esc(g)}" onclick="filtrarGrupo('${esc(g)}')">${esc(g)}</button>`)).join("");
    }
    renderExercicios();
  }

  function filtrarGrupo(g){
    EX_FILTRO = g;
    document.querySelectorAll("#exFiltros .chip-f").forEach(b=>b.classList.toggle("sel", (b.dataset.g||"")===g));
    renderExercicios();
  }

  function renderExercicios(){
    const box = document.getElementById("exLista");
    if(!box) return;
    const q = (document.getElementById("exBusca")||{}).value?.toLowerCase().trim() || "";
    let lista = EXERCICIOS;
    if(EX_FILTRO) lista = lista.filter(e=>e.grupo===EX_FILTRO);
    if(q) lista = lista.filter(e=>(e.nome||"").toLowerCase().includes(q));
    if(!lista.length){ box.innerHTML = `<div class="empty">Nenhum exercício encontrado.</div>`; return; }
    box.innerHTML = lista.map(e=>{
      const meu = e.professional_id === ME.id;
      const thumb = e.media_url
        ? `<img class="ex-thumb" src="${esc(e.media_url)}" alt="" onerror="this.style.display='none'">`
        : `<div class="ex-thumb ph">🏋️</div>`;
      return `<div class="ex-row">
        ${thumb}
        <div class="ex-info">
          <div class="ex-nome">${esc(e.nome)}</div>
          <div class="ex-meta">${esc(e.grupo||"")}${e.equipamento?" · "+esc(e.equipamento):""}${meu?' · <span class="tag">meu</span>':""}</div>
        </div>
        ${meu?`<button class="btn small ghost" onclick="excluirExercicio('${e.id}')" title="Excluir">🗑</button>`:""}
      </div>`;
    }).join("");
  }

  async function salvarExercicio(){
    const nome = document.getElementById("ex_nome").value.trim();
    const msg = document.getElementById("exMsg"), btn = document.getElementById("exBtn");
    if(!nome){ msg.className="msg err"; msg.textContent="Digite o nome do exercício."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.from("exercicios").insert({
      professional_id: ME.id,
      nome,
      grupo: document.getElementById("ex_grupo").value,
      equipamento: document.getElementById("ex_equip").value.trim() || null,
      media_url: document.getElementById("ex_media").value.trim() || null,
      instrucao: document.getElementById("ex_instr").value.trim() || null
    });
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro: "+error.message; return; }
    msg.className="msg ok"; msg.textContent="✅ Exercício adicionado!";
    ["ex_nome","ex_equip","ex_media","ex_instr"].forEach(id=>document.getElementById(id).value="");
    loadExercicios();
  }

  async function excluirExercicio(id){
    if(!confirm("Excluir este exercício da sua biblioteca?")) return;
    const { error } = await sb.from("exercicios").delete().eq("id", id);
    if(error){ alert("Erro: "+error.message); return; }

  /* ---------- PROFISSIONAL: FINANCEIRO ---------- */
  let FIN_COMP = null;            // 'YYYY-MM' em foco
  let FIN_MENS = {};              // student_id -> {valor, dia_venc}
  let FIN_PAGS = {};             // student_id -> {id, valor, pago_em}

  function fmtBRL(n){
    return "R$ " + (Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function compAtual(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  function compLabel(c){
    const [y,m]=c.split("-").map(Number);
    const nomes=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
    return nomes[m-1]+" de "+y;
  }

  function viewFinanceiro(){
    if(!FIN_COMP) FIN_COMP = compAtual();
    return `<h2>Financeiro</h2>
      <div class="card">
        <div class="fin-topo">
          <button class="chev" onclick="finMudarMes(-1)">‹</button>
          <div class="fin-mes" id="finMes">${compLabel(FIN_COMP)}</div>
          <button class="chev" onclick="finMudarMes(1)">›</button>
        </div>
        <p class="meta-sm" style="margin-top:2px">Controle de mensalidades dos alunos. Defina o valor e o dia de vencimento de cada um e registre os pagamentos do mês.</p>
        <div id="finCards" class="fin-cards" style="margin:14px 0"></div>
        <div id="finLista"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  async function carregarFinanceiro(){
    if(!FIN_COMP) FIN_COMP = compAtual();
    if(!STUDENTS.length){
      const { data: studs } = await sb.from("profiles").select("*").eq("professional_id", ME.id);
      STUDENTS = studs || [];
    }
    // planos (mensalidades)
    const { data: mens } = await sb.from("mensalidades").select("*").eq("professional_id", ME.id);
    FIN_MENS = {}; (mens||[]).forEach(m=>{ FIN_MENS[m.student_id] = m; });
    // pagamentos da competência em foco
    const { data: pags } = await sb.from("pagamentos").select("*").eq("professional_id", ME.id).eq("competencia", FIN_COMP);
    FIN_PAGS = {}; (pags||[]).forEach(p=>{ FIN_PAGS[p.student_id] = p; });
    renderFinanceiro();
  }

  function finStatus(sid){
    const pago = FIN_PAGS[sid];
    if(pago) return "pago";
    const m = FIN_MENS[sid] || {};
    const dia = m.dia_venc || 5;
    const [y,mo] = FIN_COMP.split("-").map(Number);
    const venc = new Date(y, mo-1, dia, 23,59,59);
    return (Date.now() > venc.getTime()) ? "atrasado" : "pendente";
  }

  function renderFinanceiro(){
    const mesEl = document.getElementById("finMes"); if(mesEl) mesEl.textContent = compLabel(FIN_COMP);
    const ativos = STUDENTS.filter(s => (s.status||"active") === "active");
    const lista = document.getElementById("finLista");
    const cards = document.getElementById("finCards");
    if(!lista) return;

    let recebido=0, aReceber=0, atraso=0;
    ativos.forEach(s=>{
      const m = FIN_MENS[s.id] || {}; const v = Number(m.valor)||0;
      const st = finStatus(s.id);
      if(st==="pago")      recebido += Number((FIN_PAGS[s.id]||{}).valor ?? v);
      else if(st==="atrasado") atraso += v;
      else                 aReceber += v;
    });

    if(cards){
      cards.innerHTML = `
        <div class="fin-kpi ok"><span class="fk-lbl">Recebido</span><b>${fmtBRL(recebido)}</b></div>
        <div class="fin-kpi"><span class="fk-lbl">A receber</span><b>${fmtBRL(aReceber)}</b></div>
        <div class="fin-kpi warn"><span class="fk-lbl">Em atraso</span><b>${fmtBRL(atraso)}</b></div>
        <div class="fin-kpi"><span class="fk-lbl">Alunos ativos</span><b>${ativos.length}</b></div>`;
    }

    if(!ativos.length){ lista.innerHTML = `<div class="empty">Nenhum aluno ativo.</div>`; return; }

    const rows = ativos.map(s=>{
      const m = FIN_MENS[s.id] || {};
      const valor = Number(m.valor)||0;
      const dia = m.dia_venc || 5;
      const st = finStatus(s.id);
      const chip = st==="pago"     ? `<span class="fin-tag pg">Pago</span>`
                 : st==="atrasado" ? `<span class="fin-tag at">Atrasado</span>`
                 :                    `<span class="fin-tag pe">Pendente</span>`;
      const acao = st==="pago"
        ? `<button class="btn ghost fin-btn" onclick="desfazerPagamento('${s.id}')">Desfazer</button>`
        : `<button class="btn fin-btn" onclick="registrarPagamento('${s.id}')">Registrar pagamento</button>`;
      return `<div class="fin-row">
        <div class="fin-nome">${esc(s.full_name||"Aluno")}</div>
        <label class="fin-campo">R$ <input id="finVal_${s.id}" class="fin-in" type="number" step="0.01" min="0" value="${valor}" onchange="salvarMens('${s.id}')"></label>
        <label class="fin-campo">venc. dia <input id="finDia_${s.id}" class="fin-in fin-dia" type="number" min="1" max="28" value="${dia}" onchange="salvarMens('${s.id}')"></label>
        <div class="fin-st">${chip}</div>
        <div class="fin-ac">${acao}</div>
      </div>`;
    }).join("");
    lista.innerHTML = rows;
  }

  function finMudarMes(delta){
    let [y,m] = FIN_COMP.split("-").map(Number);
    m += delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    FIN_COMP = y+"-"+String(m).padStart(2,"0");
    carregarFinanceiro();
  }

  async function salvarMens(sid){
    const vEl = document.getElementById("finVal_"+sid);
    const dEl = document.getElementById("finDia_"+sid);
    const valor = Math.max(0, Number(vEl && vEl.value)||0);
    let dia = Math.round(Number(dEl && dEl.value)||5); dia = Math.min(28, Math.max(1, dia));
    const { error } = await sb.from("mensalidades")
      .upsert({ student_id:sid, professional_id:ME.id, valor, dia_venc:dia }, { onConflict:"student_id" });
    if(error){ alert("Não consegui salvar: "+error.message); return; }
    FIN_MENS[sid] = { student_id:sid, valor, dia_venc:dia };
    renderFinanceiro();
  }

  async function registrarPagamento(sid){
    const m = FIN_MENS[sid] || {};
    const valor = Number(m.valor)||0;
    const { data, error } = await sb.from("pagamentos")
      .upsert({ student_id:sid, professional_id:ME.id, competencia:FIN_COMP, valor, pago_em:new Date().toISOString() },
              { onConflict:"student_id,competencia" })
      .select().single();
    if(error){ alert("Não consegui registrar: "+error.message); return; }
    FIN_PAGS[sid] = data;
    renderFinanceiro();
  }

  async function desfazerPagamento(sid){
    const { error } = await sb.from("pagamentos").delete().eq("student_id", sid).eq("competencia", FIN_COMP);
    if(error){ alert("Não consegui desfazer: "+error.message); return; }
    delete FIN_PAGS[sid];
    renderFinanceiro();
  }

  /* ---------- FINANCEIRO DIRETO DO ALUNO (atalho na tela do aluno) ---------- */
  let FIN_AL = { id:null, comp:null, mens:null, pags:[] };
  function statusFinComp(comp, dia, pago){
    if(pago) return "pago";
    const [y,mo] = comp.split("-").map(Number);
    const venc = new Date(y, mo-1, dia||5, 23,59,59);
    return Date.now() > venc.getTime() ? "atrasado" : "pendente";
  }
  async function verFinanceiroAluno(id){
    const el = document.getElementById("finList_"+id);
    if(!el) return;
    const btn = document.getElementById("btnFin");
    if(el.innerHTML){ el.innerHTML=""; if(btn) btn.classList.remove("ativo"); return; }
    if(btn) btn.classList.add("ativo");
    el.innerHTML = `<div class="empty">Carregando…</div>`;
    FIN_AL.id = id; FIN_AL.comp = FIN_AL.comp || compAtual();
    const { data: mensArr } = await sb.from("mensalidades").select("*").eq("student_id", id);
    FIN_AL.mens = (mensArr && mensArr[0]) || null;
    const { data: pags } = await sb.from("pagamentos").select("*").eq("student_id", id).order("competencia",{ascending:false});
    FIN_AL.pags = pags || [];
    renderFinAluno(id);
  }
  function renderFinAluno(id){
    const el = document.getElementById("finList_"+id); if(!el) return;
    const m = FIN_AL.mens || {};
    const valor = Number(m.valor)||0;
    const dia = m.dia_venc || 5;
    const comp = FIN_AL.comp;
    const pagComp = FIN_AL.pags.find(p=>p.competencia===comp);
    const st = statusFinComp(comp, dia, !!pagComp);
    const chip = st==="pago"     ? `<span class="fin-tag pg">Pago</span>`
               : st==="atrasado" ? `<span class="fin-tag at">Atrasado</span>`
               :                    `<span class="fin-tag pe">Pendente</span>`;
    const acao = pagComp
      ? `<button class="btn ghost small" onclick="finAlunoPagar('${id}',false)">Desfazer</button>`
      : `<button class="btn small" onclick="finAlunoPagar('${id}',true)">Registrar pagamento</button>`;
    const hist = FIN_AL.pags.length
      ? FIN_AL.pags.slice(0,8).map(p=>`<div class="fin-hist-row"><span>${compLabel(p.competencia)}</span><span class="fin-tag pg">Pago · ${fmtBRL(p.valor)}</span></div>`).join("")
      : `<div class="meta-sm">Nenhum pagamento registrado ainda.</div>`;
    el.innerHTML = `<div class="fin-aluno">
      <div class="fin-al-plano">
        <label class="fin-campo">Mensalidade R$ <input id="finAlVal_${id}" class="fin-in" type="number" step="0.01" min="0" value="${valor}"></label>
        <label class="fin-campo">venc. dia <input id="finAlDia_${id}" class="fin-in fin-dia" type="number" min="1" max="28" value="${dia}"></label>
        <button class="btn small ghost" onclick="finAlunoSalvarPlano('${id}')">Salvar</button>
      </div>
      <div class="fin-al-mes">
        <button class="chev" onclick="finAlunoMes('${id}',-1)">‹</button>
        <span class="fin-al-mesnome">${compLabel(comp)}</span>
        <button class="chev" onclick="finAlunoMes('${id}',1)">›</button>
        ${chip}
        ${acao}
      </div>
      <div class="fin-al-hist"><div class="fin-hist-tit">Últimos pagamentos</div>${hist}</div>
    </div>`;
  }
  function finAlunoMes(id, delta){
    let [y,m] = (FIN_AL.comp||compAtual()).split("-").map(Number);
    m += delta; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    FIN_AL.comp = y+"-"+String(m).padStart(2,"0");
    renderFinAluno(id);
  }
  async function finAlunoSalvarPlano(id){
    const v = Math.max(0, Number((document.getElementById("finAlVal_"+id)||{}).value)||0);
    let d = Math.round(Number((document.getElementById("finAlDia_"+id)||{}).value)||5); d = Math.min(28, Math.max(1, d));
    const { error } = await sb.from("mensalidades")
      .upsert({ student_id:id, professional_id:ME.id, valor:v, dia_venc:d }, { onConflict:"student_id" });
    if(error){ alert("Não consegui salvar: "+error.message); return; }
    FIN_AL.mens = { student_id:id, valor:v, dia_venc:d };
    renderFinAluno(id);
  }
  async function finAlunoPagar(id, pagar){
    if(pagar){
      const valor = Number((FIN_AL.mens||{}).valor)||0;
      const { data, error } = await sb.from("pagamentos")
        .upsert({ student_id:id, professional_id:ME.id, competencia:FIN_AL.comp, valor, pago_em:new Date().toISOString() },
                { onConflict:"student_id,competencia" }).select().single();
      if(error){ alert("Não consegui registrar: "+error.message); return; }
      FIN_AL.pags = FIN_AL.pags.filter(p=>p.competencia!==FIN_AL.comp); FIN_AL.pags.unshift(data);
      FIN_AL.pags.sort((a,b)=>b.competencia.localeCompare(a.competencia));
    }else{
      const { error } = await sb.from("pagamentos").delete().eq("student_id", id).eq("competencia", FIN_AL.comp);
      if(error){ alert("Não consegui desfazer: "+error.message); return; }
      FIN_AL.pags = FIN_AL.pags.filter(p=>p.competencia!==FIN_AL.comp);
    }

  /* ---------- PROFISSIONAL: DESEMPENHO / RETENÇÃO ---------- */
  let RET_DADOS = [], RET_FILTRO = "todos";
  const RET_CLASSES = {
    em_dia:    {label:"Em dia",    cor:"#15803d", bg:"#122110"},
    oscilando: {label:"Oscilando", cor:"#b45309", bg:"#2a2410"},
    risco:     {label:"Em risco",  cor:"#c2410c", bg:"#2a1f10"},
    abandono:  {label:"Abandono",  cor:"#be123c", bg:"#2a1416"}

  function classificaRet(dias){
    if(dias===null) return "abandono";
    if(dias<=3) return "em_dia";
    if(dias<=7) return "oscilando";
    if(dias<=14) return "risco";
    return "abandono";
  }

  function viewDesempenho(){
    return `<h2>Desempenho</h2>
      <div class="card">
        <h3>📈 Retenção dos alunos</h3>
        <p class="meta-sm" style="margin-top:2px">Como está a frequência de cada aluno, pela data do último treino registrado. Clique numa faixa para filtrar.</p>
        <div id="retResumo" style="margin:14px 0"><div class="empty">Carregando…</div></div>
        <div id="retLista"></div>
      </div>
      <div class="card">
        <h3>✅ Adesão da semana</h3>
        <p class="meta-sm" style="margin-top:2px">Treinos feitos nos últimos 7 dias × o previsto (nº de treinos da ficha ativa).</p>
        <div id="adesaoBox" style="margin-top:12px"><div class="empty">Carregando…</div></div>
      </div>`;
