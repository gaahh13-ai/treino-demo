<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha área — TreinoApp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{color-scheme:light;--txt:#334155;--muted:#64748b;--line:#e5e7eb;--pink:#4f46e5;--pink-deep:#4338ca}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{min-height:100vh;background:linear-gradient(180deg,#f8fafc,#f1f5f9 45%,#eef2ff);color:var(--txt)}
  nav.top{background:rgba(248,250,252,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  nav.top .in{max-width:1040px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;justify-content:space-between}
  .logo{height:32px}
  .logout{border:1.5px solid var(--pink);color:var(--pink-deep);background:#fff;border-radius:12px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 60px}
  .hello{font-size:21px;font-weight:800;margin-bottom:4px}
  .role-chip{display:inline-block;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;margin-bottom:18px}
  .chip-creator{background:#e0e7ff;color:#4338ca}
  .chip-professional{background:#dbeafe;color:#1d4ed8}
  .chip-student{background:#e0e7ff;color:#4338ca}

  .shell{display:grid;grid-template-columns:212px 1fr;gap:20px;align-items:start}
  .sidebar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;
           box-shadow:0 8px 22px rgba(30,41,59,.06);position:sticky;top:86px}
  .navitem{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;
           padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;text-align:left}
  .navitem:hover{background:#f1f5f9}
  .navitem.active{background:linear-gradient(120deg,#e0e7ff,#e0e7ff);color:var(--pink-deep);font-weight:800}
  .navitem .ico{font-size:15px;line-height:1}

  .panel h2{font-size:18px;font-weight:800;margin-bottom:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;
        box-shadow:0 8px 22px rgba(30,41,59,.06);margin-bottom:16px}
  .card h3{font-size:15px;font-weight:800;color:var(--pink-deep);margin-bottom:8px}
  .card p{font-size:14px;color:var(--muted);line-height:1.55}
  .btn{display:inline-block;border:none;border-radius:12px;padding:11px 20px;font-weight:700;font-size:14px;color:#fff;cursor:pointer;text-decoration:none;
       background:linear-gradient(120deg,#6366f1,#818cf8);box-shadow:0 6px 16px rgba(79,70,229,.2);margin-top:8px}
  .btn.small{padding:8px 14px;font-size:13px;box-shadow:none}
  .btn.ghost{background:#fff;color:var(--pink-deep);border:1.5px solid var(--line)}
  .tag{display:inline-block;background:#fff7ed;color:#b45309;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid #fed7aa}
  #loading{text-align:center;padding:80px 20px;color:var(--muted)}
  .student-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .student-row:last-child{border-bottom:none}
  .student-row .name{font-weight:700;font-size:14px}
  .student-row .meta{font-size:12px;color:var(--muted)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
  .field input:focus,.field textarea:focus{outline:2px solid #a5b4fc;border-color:#a5b4fc}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .msg{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:9px;display:none;line-height:1.45}
  .msg.err{display:block;background:#fdecec;color:#c0392b}
  .msg.ok{display:block;background:#eafaf0;color:#1a8a4a}
  .msg.warn{display:block;background:#fff7ed;color:#b45309}
  .field input[readonly]{background:#f1f5f9;color:var(--pink-deep);font-weight:800;cursor:not-allowed}
  .meta-cliente{margin-top:2px}

  /* tela "Meus alunos": detalhe + coluna de alunos */
  .alunos-layout{display:grid;grid-template-columns:1fr 258px;gap:16px;align-items:start;margin-bottom:16px}
  .alunos-col{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;
    box-shadow:0 8px 22px rgba(30,41,59,.06);position:sticky;top:86px}
  .alunos-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .alunos-head h3{font-size:14px;font-weight:800;color:var(--pink-deep)}
  .aluno-search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:10px;font-family:inherit}
  .aluno-search:focus{outline:2px solid #a5b4fc;border-color:#a5b4fc}
  #alunosLista{max-height:60vh;overflow-y:auto}
  .aluno-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
    border:none;background:none;padding:10px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--txt);cursor:pointer}
  .aluno-item:hover{background:#f1f5f9}
  .aluno-item.sel{background:linear-gradient(120deg,#e0e7ff,#e0e7ff);color:var(--pink-deep);font-weight:800}
  .aluno-item .ai-n{font-size:11px;font-weight:800;color:var(--muted);background:#eef2ff;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
  .aluno-detalhe{min-height:130px}
  .det-nome{font-size:18px;font-weight:800}
  .det-sub{font-size:12.5px;color:var(--muted);margin-top:3px;margin-bottom:16px}
  .det-acoes{display:flex;flex-wrap:wrap;gap:8px}
  .det-acoes .btn{margin-top:0}
  @media(max-width:760px){
    .alunos-layout{grid-template-columns:1fr}
    .alunos-col{position:static;order:-1}
    #alunosLista{max-height:230px}
  }

  /* biblioteca de exercícios */
  .chip-f{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;
    padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .chip-f.sel{background:linear-gradient(120deg,#e0e7ff,#e0e7ff);color:var(--pink-deep);border-color:transparent}
  .ex-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ex-row:last-child{border-bottom:none}
  .ex-thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
  .ex-thumb.ph{display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-size:20px}
  .ex-info{flex:1;min-width:0}
  .ex-nome{font-weight:700;font-size:14px}
  .ex-meta{font-size:12px;color:var(--muted);margin-top:2px}

  /* montador de ficha (profissional) */
  .fx-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .fx-row:last-of-type{border-bottom:none}
  .fx-nome{font-weight:700;font-size:13.5px;flex:1;min-width:120px}
  .fx-campos{display:flex;gap:8px;flex-wrap:wrap}
  .fx-campos label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;gap:3px}
  .fx-campos input{width:64px;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .fx-add{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .fx-add select{flex:1;min-width:160px;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:13px}
  /* treino (aluno) */
  .tr-ex{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;background:#ffffff}
  .tr-nome{font-weight:800;font-size:14.5px}
  .tr-presc{font-size:13px;color:var(--txt);margin-top:3px}
  .tr-presc b{color:var(--pink-deep)}
  .ficha-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 12px;background:#f1f5f9;border:1px solid var(--line);border-radius:12px}
  .ficha-head select{padding:8px;border:1px solid var(--line);border-radius:9px;font-size:12.5px}

  /* execução do treino (aluno, tela dedicada) */
  .exec-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:66px;z-index:5;
    background:linear-gradient(180deg,#f8fafc,#f8fafcee);padding:10px 0}
  .exec-titulo{font-size:16px;font-weight:800}
  .exec-timer{background:linear-gradient(120deg,#6366f1,#818cf8);color:#fff;font-weight:800;text-align:center;
    padding:12px;border-radius:14px;margin-bottom:12px;font-size:16px}
  .ex-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(30,41,59,.05)}
  .ex-card-nome{font-weight:800;font-size:15px}
  .ser-head{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;font-size:10px;font-weight:800;color:var(--muted);
    text-transform:uppercase;margin:12px 0 6px;text-align:center}
  .ser-row{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
  .ser-num{font-weight:800;color:var(--pink-deep);text-align:center;font-size:13px}
  .ser-in{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center}
  .ser-in:focus{outline:2px solid #a5b4fc;border-color:#a5b4fc}
  .ser-ok{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font-size:15px;cursor:pointer;color:var(--muted)}
  .ser-ok.done{background:#eafaf0;border-color:#bbeccb;color:#1a8a4a;font-weight:800}
  .exec-crono{font-size:12px;font-weight:800;color:var(--pink-deep);background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;white-space:nowrap}
  /* acesso destacado ao treino (dashboard do aluno) */
  .treino-hero{background:linear-gradient(120deg,#e0e7ff,#e0e7ff);border:1px solid transparent;border-radius:16px;
    padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .treino-hero .ico-big{font-size:38px;line-height:1}
  .treino-hero h3{margin:0 0 4px;color:var(--pink-deep)}
  .treino-hero p{margin:0;font-size:13px;color:var(--txt)}
  .treino-hero .btn{margin-top:0}
  /* resumo de treinos disponíveis x último treinado */
  .treino-lista{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
  .treino-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;
    border:1px solid var(--line);background:#ffffff;border-radius:12px;padding:11px 14px;cursor:pointer;transition:.15s}
  .treino-linha:hover{border-color:var(--pink)}
  .treino-linha.sel{background:linear-gradient(120deg,#e0e7ff,#e0e7ff);border-color:transparent}
  .treino-linha .tl-nome{font-weight:800;font-size:14px;color:var(--txt)}
  .treino-linha .tl-ult{font-size:11.5px;color:var(--muted);margin-top:2px}
  .treino-linha .tl-seta{color:var(--pink-deep);font-weight:800}
  /* exercício na visão do aluno com imagem e descanso clicável */
  .ex-thumb-al{width:56px;height:56px;border-radius:12px;flex:0 0 auto;background:linear-gradient(135deg,#e0e7ff,#e0e7ff);
    display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
  .ex-thumb-al img{width:100%;height:100%;object-fit:cover}
  .tr-ex-row{display:flex;gap:12px;align-items:flex-start}
  .tr-ex-body{flex:1;min-width:0}
  .desc-btn{border:1px solid var(--pink);background:#fff;color:var(--pink-deep);border-radius:999px;
    padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:5px}
  .desc-btn:hover{background:#f8fafc}
  .tr-obs{margin-top:8px;font-size:12.5px;line-height:1.5;color:var(--txt);background:#eef2ff;
    border-left:3px solid var(--pink);border-radius:0 10px 10px 0;padding:8px 11px}
  /* cronômetro flutuante de descanso (qualquer tela) */
  .desc-float{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
    background:linear-gradient(120deg,#6366f1,#818cf8);color:#fff;font-weight:800;font-size:16px;
    padding:14px 22px;border-radius:16px;box-shadow:0 10px 30px rgba(30,41,59,.3);display:flex;align-items:center;gap:14px}
  .desc-float button{background:rgba(255,255,255,.25);border:none;color:#fff;font-weight:800;
    border-radius:9px;padding:6px 10px;cursor:pointer;font-size:13px}
  .empty{font-size:13px;color:var(--muted);padding:8px 0}
  /* desempenho / retenção (profissional) */
  .ret-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:560px){ .ret-cards{grid-template-columns:1fr 1fr} }
  .ret-card{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
  .ret-card:hover{filter:brightness(.98)}
  .ret-card.sel{outline:2px solid var(--pink-deep);outline-offset:1px}
  .ret-card .rc-num{font-size:24px;font-weight:800;line-height:1}
  .ret-card .rc-lbl{font-size:11.5px;font-weight:700;margin-top:3px}
  .ret-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;background:#ffffff}
  .ret-row .rr-nome{font-weight:800;font-size:14px}
  .ret-row .rr-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .ret-badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .ades-row{margin-bottom:12px}
  .ades-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
  .ades-num{font-size:13px;font-weight:800;color:var(--txt)}
  .ades-bar{height:9px;border-radius:999px;background:#eee;overflow:hidden}
  .ades-fill{height:100%;border-radius:999px;transition:width .3s}
  .treino-resumo-al{font-size:12.5px;color:var(--txt);background:#f1f5f9;border:1px solid var(--line);
    border-radius:10px;padding:8px 11px;margin:2px 0 10px}
  .treino-resumo-al b{color:var(--pink-deep)}
  .assess-item{font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .assess-item:last-child{border-bottom:none}
  .assess-item b{color:var(--pink-deep)}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-weight:800;font-size:18px;line-height:1}

  /* avaliações e consultas do aluno */
  .aval{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#ffffff}
  .aval-head{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px}
  .meds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .med{background:#f1f5f9;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;
       display:flex;gap:7px;align-items:center;justify-content:space-between}
  @media(max-width:520px){ .meds{grid-template-columns:1fr} }
  .aval-body{display:none;margin-top:12px}
  .aval.open .aval-body{display:block}
  .chev{border:none;background:none;cursor:pointer;color:var(--pink-deep);font-size:13px;line-height:1;
        padding:4px 6px;border-radius:8px;transition:transform .18s ease}
  .chev:hover{background:#f1f5f9}
  .aval.open .chev{transform:rotate(90deg)}
  .med span{color:var(--muted);font-weight:600}
  .med b{color:var(--pink-deep);font-weight:800}
  .dif{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:-4px}
  .dif.up{background:#fff1f2;color:#be123c}
  .dif.down{background:#eafaf0;color:#1a8a4a}
  .obs{margin-top:11px;font-size:13px;line-height:1.55;color:var(--txt);background:#eef2ff;border-left:3px solid var(--pink);border-radius:0 10px 10px 0;padding:10px 12px}
  .meta-sm{font-size:12px;color:var(--muted);margin-top:8px}
  .proxima{background:linear-gradient(120deg,#e0e7ff,#e0e7ff);border-radius:14px;padding:18px}
  .proxima .quando{font-size:19px;font-weight:800;color:var(--pink-deep)}

  /* menu de 3 pontinhos */
  .menu-wrap{position:relative;display:inline-block}
  .menu-drop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:#fff;
    border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(30,41,59,.16);
    min-width:160px;overflow:hidden;padding:4px}
  .menu-drop.open{display:block}
  .menu-drop button{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
    padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--txt);border-radius:9px}
  .menu-drop button:hover{background:#f1f5f9;color:var(--pink-deep)}
  .dots{font-size:16px;line-height:1;letter-spacing:1px}
  .card.cta{background:linear-gradient(135deg,#e0e7ff,#e0e7ff);border:1px solid #a5b4fc}
  .card.cta p{color:#475569}

  /* formulário de avaliação */
  .form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grupo{margin-top:16px}
  .grupo-tit{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
    padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
  @media(max-width:520px){ .form-grid2{grid-template-columns:1fr} }

  @media(max-width:760px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px;-webkit-overflow-scrolling:touch}
    .navitem{white-space:nowrap;padding:9px 12px;font-size:13px;width:auto}
    .form-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<nav class="top"><div class="in">
  <a href="index.html"><span style="font-weight:800;font-size:20px;color:var(--pink-deep)">TreinoApp</span></a>

</div></nav>

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {

  let ME = null, STUDENTS = [], INVITES = [], ASSESS = [], VIEW = null, EDIT_ID = null, ASSESS_S = null, MANUAL_CALC = false;
  let SELECTED_STUDENT = null, ATIVOS_CACHE = [];
  let EXERCICIOS = [], EX_FILTRO = "";
  let FICHA = null, FICHA_DIAS = [], FICHA_DIA = null, FICHAS_TODAS = [], FICHA_READONLY = false;
  let ALUNO_DIAS = [], ALUNO_DIA = null, ALUNO_EXS = [], ULTIMO_POR_DIA = {};
  let EXEC_SESSAO = null, EXEC_LOGS = {}, ULTIMAS = {}, EXEC_INICIO = null, CRONO_INT = null;

  // campos das avaliações

    ["tricipital","Tricipital"], ["subescapular","Subescapular"], ["peitoral","Peitoral"],
    ["axilar_media","Axilar média"], ["suprailiaca","Suprailíaca"], ["abdominal","Abdominal"], ["coxa","Coxa"]
  ];
  const PERIMETROS = [
    ["ombro","Ombro"], ["braco_relaxado","Braço relaxado"], ["braco_contraido","Braço contraído"],

    ["lean_mass","Massa magra"," kg"], ["fat_mass","Massa gorda"," kg"]
  ];

  /* sessão expira em 1 hora */
  const DURACAO_MS = 60*60*1000;
  function marcarInicio(){ if(!localStorage.getItem("sessao_inicio")) localStorage.setItem("sessao_inicio", String(Date.now())); }
  async function expirouSessao(){
    const ini = Number(localStorage.getItem("sessao_inicio")||0);
    if(ini && Date.now()-ini > DURACAO_MS){
      localStorage.removeItem("sessao_inicio");
      await sb.auth.signOut();
      location.href = "login.html?expirou=1";
      return true;
    }
    return false;
  }
  setInterval(expirouSessao, 60*1000);

  async function sair(){ localStorage.removeItem("sessao_inicio"); await sb.auth.signOut(); location.href = "login.html"; }
  function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
  function fmtDate(d){ if(!d) return "—"; const p=String(d).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
  function shortId(id){ return String(id||"").slice(0,8); }
  function primeiroNome(){ const n=(ME.full_name||"").trim(); return n?n.split(/\s+/)[0]:""; }
  function nomeAluno(s){ return s ? (s.full_name || s.email || ("Aluno "+shortId(s.id))) : "Aluno"; }

  /* ================= INÍCIO ================= */
  async function init(){
    let { data:{ session } } = await sb.auth.getSession();
    if(!session){
      session = await new Promise(res=>{
        const t=setTimeout(()=>res(null), 2500);
        sb.auth.onAuthStateChange((_e,s)=>{ if(s){ clearTimeout(t); res(s); } });
      });
    }
    if(!session){ location.href = "login.html"; return; }
    marcarInicio();
    if(await expirouSessao()) return;
    const user = session.user;
    let { data: profile } = await sb.from("profiles").select("*").eq("id", user.id).single();
    if(!profile) profile = { id:user.id, role:"student", full_name:null, professional_id:null, status:"active" };
    ME = { ...profile, email: user.email };
    // aluno: só mostra "Meu treino" se o profissional já montou algum treino
    if(ME.role === "student"){
      const { count } = await sb.from("ficha_dias").select("id",{count:"exact",head:true}).eq("student_id", ME.id);
      ALUNO_TREINO = (count||0) > 0;
    }
    montar();
  }
  let ALUNO_TREINO = false;
  function alunoTemTreino(){ return ALUNO_TREINO; }

  /* profissionais com o módulo de treino habilitado (por enquanto por e-mail).
     Depois vira uma configuração por profissional no banco. */
  const TREINO_ATIVO = ["teste@profissional.com.br"];
  function temTreino(){ return TREINO_ATIVO.includes((ME.email||"").toLowerCase()); }

  /* ================= MENU / LAYOUT ================= */
  function menuFor(role){
    if(role === "student"){
      const menu = [
        {id:"dash",       ico:"📊", label:"Meu dashboard"},
        {id:"avaliacoes", ico:"📋", label:"Avaliações Físicas"}
      ];
      if(alunoTemTreino()) menu.push({id:"meutreino", ico:"🏋️", label:"Meu treino"});
      menu.push({id:"consultas", ico:"📅", label:"Consultas"});
      menu.push({id:"perfil",    ico:"👤", label:"Perfil"});
      return menu;
    }
    const m = [
      {id:"alunos",     ico:"👥", label:"Meus alunos"},
      {id:"cadastrar",  ico:"➕", label:"Cadastrar aluno"}
    ];
    // módulo de treino só para profissionais habilitados (personal). Nutri (TreinoApp) não vê.
    if(temTreino()){
      m.push({id:"exercicios", ico:"🏋️", label:"Exercícios"});
      m.push({id:"desempenho", ico:"📈", label:"Desempenho"});
    }
    m.push({id:"inativos", ico:"📁", label:"Alunos inativos"});
    m.push({id:"perfil",   ico:"👤", label:"Meu perfil"});
    if(role === "creator") m.push({id:"admin", ico:"🛠️", label:"Painel do criador"});
    return m;
  }

  function montar(){
    const role = ME.role || "student";
    const rotulo = {creator:"Criador", professional:"Profissional", student:"Aluno"}[role] || role;
    const first = primeiroNome();

    // aluno arquivado: sem menu, só o aviso
    if(role === "student" && ME.status === "archived"){
      document.getElementById("content").innerHTML = `
        <div class="hello">${first ? "Olá, "+esc(first) : "Olá!"}</div>
        <div class="card"><h3>⏸️ Acompanhamento inativo</h3>
        <p>Seu acompanhamento está pausado no momento, então o painel fica indisponível.
           Seu histórico continua guardado. Fale com sua nutricionista para reativar.</p></div>`;
      mostrar();
      return;
    }

    const itens = menuFor(role).map(i=>
      `<button class="navitem" id="nav_${i.id}" onclick="go('${i.id}')">
         <span class="ico">${i.ico}</span><span class="lbl">${i.label}</span></button>`).join("");

    document.getElementById("content").innerHTML = `
      <div class="hello">${first ? "Olá, "+esc(first)+" 👋" : "Olá! 👋"}</div>
      <div class="role-chip chip-${role}">${rotulo}</div>
      <div class="shell">
        <aside class="sidebar">${itens}</aside>
        <section class="panel" id="panel"></section>
      </div>`;
    mostrar();

    const inicial = !first ? "perfil" : (role === "student" ? "dash" : "alunos");
    go(inicial);
  }

  function mostrar(){
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "block";
  }

  function go(id){
    VIEW = id;
    if(typeof pararDescanso==="function") pararDescanso();
    if(typeof pararCronoTreino==="function") pararCronoTreino();
    document.querySelectorAll(".navitem").forEach(b=>b.classList.remove("active"));
    const nav = document.getElementById("nav_"+id); if(nav) nav.classList.add("active");
    const p = document.getElementById("panel"); if(!p) return;

    if(id === "dash")      p.innerHTML = viewDash();
    else if(id === "avaliacoes"){ p.innerHTML = viewAvaliacoes(); carregarMinhasAvaliacoes(); }
    else if(id === "meutreino"){  p.innerHTML = viewMeuTreino();  carregarMeuTreino(); }
    else if(id === "consultas"){  p.innerHTML = viewConsultas();  carregarMinhasConsultas(); }
    else if(id === "perfil"){ p.innerHTML = viewPerfil(); if(ME.role === "student") carregarTelegram(); }
    else if(id === "admin")p.innerHTML = viewAdmin();
    else if(id === "alunos"){    p.innerHTML = viewAlunos();    loadStudents(); }
    else if(id === "cadastrar"){ p.innerHTML = viewCadastrar(); loadStudents(); }
    else if(id === "exercicios"){ p.innerHTML = viewExercicios(); loadExercicios(); }
    else if(id === "desempenho"){ p.innerHTML = viewDesempenho(); carregarDesempenho(); }
    else if(id === "inativos"){  p.innerHTML = viewInativos();  loadStudents(); }
    window.scrollTo({top:0, behavior:"smooth"});
  }

  /* ================= TELAS: ALUNO ================= */
  function viewDash(){
    const heroTreino = (ME.role === "student" && alunoTemTreino()) ? `
      <div class="treino-hero">
        <div class="ico-big">🏋️</div>
        <div style="flex:1;min-width:180px">
          <h3>Seu treino de hoje</h3>
          <p>Veja o treino que seu personal montou, siga as orientações e registre suas cargas.</p>
        </div>
        <button class="btn" onclick="go('meutreino')">Acessar meu treino →</button>
      </div>` : "";
    return `<h2>Meu dashboard</h2>
      ${heroTreino}
      <div class="card">
        <h3>📊 Sua evolução</h3>
        <p>Acompanhe peso, composição, sono e adesão — e envie seus reports pelo Telegram.</p>
        <a class="btn" href="dashboard.html">Abrir meu dashboard →</a>
      </div>
      ${(ME.role === "student" && !ME.telegram_chat_id) ? `
      <div class="card cta">
        <h3>💬 Ative seus reports pelo Telegram</h3>
        <p>Conte como foi o seu dia por mensagem — treino, alimentação, sono — do jeito que
           preferir escrever. Tudo entra no seu acompanhamento automaticamente.
           Leva menos de um minuto para conectar.</p>
        <button class="btn" id="ctaBtn" onclick="conectarPeloDash()">Conectar meu Telegram</button>
        <div class="msg" id="ctaMsg"></div>
      </div>` : ""}`;
  }

  async function conectarPeloDash(){
    const msg = document.getElementById("ctaMsg");
    const { data: bot, error } = await sb.rpc("meu_bot_telegram");
    if(error || !bot){
      msg.className="msg err";
      msg.textContent="Sua nutricionista ainda não ativou os reports por Telegram.";
      return;
    }
    gerarLinkTelegram(bot, "ctaMsg");
  }

  function cardTelegram(){
    return `
      <div class="card">
        <h3>💬 Reports pelo Telegram</h3>
        <div id="tgBox"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  async function carregarTelegram(){
    const box = document.getElementById("tgBox");
    if(!box) return;
    const { data: bot, error } = await sb.rpc("meu_bot_telegram");
    if(error || !bot){
      box.innerHTML = `<div class="empty">Sua nutricionista ainda não ativou os reports por Telegram.</div>`;
      return;
    }
    if(ME.telegram_chat_id){
      box.innerHTML = `
        <p>✅ <b>Conectado.</b> É só mandar mensagem para <b>@${esc(bot)}</b> contando como foi o seu dia —
           treino, alimentação, sono — com as suas palavras. Eu registro tudo automaticamente.</p>
        <a class="btn small" href="https://t.me/${encodeURIComponent(bot)}" target="_blank">Abrir conversa</a>
        <button class="btn small ghost" onclick="gerarLinkTelegram('${esc(bot)}')">Reconectar</button>`;
      return;
    }
    box.innerHTML = `
      <p>Envie seus reports por mensagem, do jeito que preferir escrever. Conecte uma vez e pronto.</p>
      <button class="btn small" onclick="gerarLinkTelegram('${esc(bot)}')">Conectar meu Telegram</button>
      <div class="msg" id="tgMsg"></div>`;
  }

  async function gerarLinkTelegram(bot, idMsg){
    const msg = document.getElementById(idMsg || "tgMsg");
    const { data: token, error } = await sb.rpc("meu_token_telegram");
    if(error || !token){
      if(msg){ msg.className="msg err"; msg.textContent="Não consegui gerar seu link agora. Tente de novo."; }
      return;
    }
    if(msg){
      msg.className="msg ok";
      msg.textContent="Abrindo o Telegram… toque em INICIAR para concluir e depois recarregue esta página.";
    }
    window.open(`https://t.me/${bot}?start=${token}`, "_blank");
  }

  async function definirSenha(){
    const p1=document.getElementById("np1").value, p2=document.getElementById("np2").value;
    const msg=document.getElementById("pwMsg"), btn=document.getElementById("pwBtn");
    if(p1.length<6){ msg.className="msg err"; msg.textContent="A senha precisa ter ao menos 6 caracteres."; return; }
    if(p1!==p2){ msg.className="msg err"; msg.textContent="As senhas não coincidem."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.auth.updateUser({ password:p1 });
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro: "+error.message; return; }
    msg.className="msg ok"; msg.textContent="Senha salva! Já pode entrar com e-mail e senha.";
    document.getElementById("np1").value=""; document.getElementById("np2").value="";
  }

  /* ---------- ALUNO: AVALIAÇÕES FÍSICAS ---------- */
  function viewAvaliacoes(){
    return `<h2>Avaliações Físicas</h2>
      <div class="card">
        <h3>📋 Minhas avaliações</h3>
        <p>Todos os dados levantados pela sua nutricionista, da mais recente para a mais antiga.</p>
        <div id="avalBox" style="margin-top:12px"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  function fmtDataHora(v){
    if(!v) return "—";
    const d = new Date(v);
    if(isNaN(d)) return fmtDate(v);
    return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  function med(rot, val, un){
    if(val==null || val==="") return "";
    return `<div class="med"><span>${rot}</span><b>${Number(val).toLocaleString("pt-BR",{maximumFractionDigits:1})}${un}</b></div>`;
  }

  async function carregarMinhasAvaliacoes(){
    const box = document.getElementById("avalBox");
    const { data, error } = await sb.from("assessments").select("*")
      .eq("student_id", ME.id).order("date",{ascending:false});
    if(!box) return;
    if(error){ box.innerHTML = `<div class="empty">Erro ao carregar: ${esc(error.message)}</div>`; return; }
    if(!data || !data.length){
      box.innerHTML = `<div class="empty">Você ainda não tem avaliações registradas.<br>Elas aparecerão aqui assim que sua nutricionista lançar a primeira.</div>`;
      return;
    }
    box.innerHTML = data.map((a,idx)=>avaliacaoDetalhe(a,idx)).join("");
  }

  /* ---------- ALUNO: MEU TREINO ---------- */
  function viewMeuTreino(){
    return `<h2>Meu treino</h2>
      <div class="card">
        <h3>🏋️ Treino montado pelo seu personal</h3>
        <div id="treinoResumo"></div>
        <div id="treinoBoxAluno"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  // "há X dias" a partir de uma data
  function haQuantoTempo(v){
    if(!v) return null;
    const d = new Date(v); if(isNaN(d)) return null;
    const dias = Math.floor((Date.now() - d.getTime())/86400000);
    if(dias <= 0) return "hoje";
    if(dias === 1) return "ontem";
    return "há " + dias + " dias";
  }

  async function carregarMeuTreino(){
    const { data: fichas } = await sb.from("fichas").select("*").eq("student_id", ME.id).eq("ativa", true).limit(1);
    const box = document.getElementById("treinoBoxAluno");
    if(!fichas || !fichas.length){ if(box) box.innerHTML = `<div class="empty">Seu personal ainda não montou um treino.</div>`; return; }
    const ficha = fichas[0];
    const { data: dias } = await sb.from("ficha_dias").select("*").eq("ficha_id", ficha.id).order("ordem");
    ALUNO_DIAS = dias || [];
    if(!ALUNO_DIAS.length){ if(box) box.innerHTML = `<div class="empty">Seu personal ainda não adicionou os dias do treino.</div>`; return; }
    ALUNO_DIA = ALUNO_DIAS[0].id;
    // carrega os exercícios de todos os dias de uma vez
    const { data: exs } = await sb.from("ficha_exercicios").select("*").eq("ficha_id", ficha.id).order("ordem");
    ALUNO_EXS = exs || [];
    // último treino executado por dia (sessões finalizadas)
    ULTIMO_POR_DIA = {};
    const { data: sess } = await sb.from("sessoes").select("dia_id,data")
      .eq("student_id", ME.id).eq("finalizada", true).order("data",{ascending:false});
    (sess||[]).forEach(s=>{ if(s.dia_id && !(s.dia_id in ULTIMO_POR_DIA)) ULTIMO_POR_DIA[s.dia_id] = s.data; });
    renderResumoTreinos();
    renderAlunoExs();
  }

  // lista de treinos disponíveis x último dia treinado (estilo MFIT)
  function renderResumoTreinos(){
    const r = document.getElementById("treinoResumo");
    if(!r) return;
    r.innerHTML = `<div class="treino-lista">` + ALUNO_DIAS.map(d=>{
      const qtd = ALUNO_EXS.filter(x=>x.dia_id===d.id).length;
      const ult = haQuantoTempo(ULTIMO_POR_DIA[d.id]);
      const ultTxt = ult ? `Último treino: ${ult}` : "Você ainda não fez este treino";
      return `<button class="treino-linha ${d.id===ALUNO_DIA?"sel":""}" onclick="selDiaAluno('${d.id}')">
        <span>
          <span class="tl-nome">${esc(d.label)}</span>
          <span class="tl-ult">${qtd} exercício${qtd===1?"":"s"} · ${ultTxt}</span>
        </span>
        <span class="tl-seta">›</span>
      </button>`;
    }).join("") + `</div>`;
  }

  function selDiaAluno(id){ ALUNO_DIA = id; renderResumoTreinos(); renderAlunoExs(); window.scrollTo({top:0,behavior:"smooth"}); }

  // ícone/emoji por grupo muscular (placeholder até termos imagens/GIFs reais)
  function iconeExercicio(x){
    const t = ((x.grupo||"") + " " + (x.nome_cache||"")).toLowerCase();
    if(/perna|quadr|leg|agach?|afundo|glúte|gluteo|panturr|coxa/.test(t)) return "🦵";
    if(/peito|supino|crucifixo|peck/.test(t)) return "🫁";
    if(/costa|remada|pux|puxada|barra|dorsal/.test(t)) return "🔙";
    if(/ombro|desenvolv|elevação|elevacao|deltoid/.test(t)) return "🙆";
    if(/bíceps|biceps|rosca/.test(t)) return "💪";
    if(/tríceps|triceps|testa|corda|francês|frances/.test(t)) return "🦾";
    if(/abd|core|prancha|obliqu/.test(t)) return "🧘";
    if(/aeró|aero|corrida|esteira|bike|cardio/.test(t)) return "🏃";
    return "🏋️";
  }

  function renderAlunoExs(){
    const box = document.getElementById("treinoBoxAluno");
    if(!box) return;
    const lista = ALUNO_EXS.filter(x=>x.dia_id===ALUNO_DIA);
    const dia = ALUNO_DIAS.find(d=>d.id===ALUNO_DIA);
    if(!lista.length){ box.innerHTML = `<div class="empty">Sem exercícios neste dia.</div>`; return; }
    const titulo = `<div style="font-weight:800;font-size:15px;margin:14px 0 4px">${esc(dia?dia.label:"Treino")}</div>`;
    const btnIniciar = `<button class="btn" style="margin:6px 0 14px" onclick="iniciarTreino('${ALUNO_DIA}')">▶ Iniciar este treino</button>`;
    box.innerHTML = titulo + btnIniciar + lista.map(x=>{
      const partes = [];
      if(x.series!=null && x.reps) partes.push(`<b>${x.series}x${esc(x.reps)}</b>`);
      else if(x.series!=null) partes.push(`<b>${x.series} séries</b>`);
      if(x.carga_alvo!=null) partes.push(`${x.carga_alvo} kg`);
      if(x.descanso_seg!=null) partes.push(`descanso ${x.descanso_seg}s`);
      const img = x.media_url ? `<img src="${esc(x.media_url)}" alt="">` : iconeExercicio(x);
      return `<div class="tr-ex">
        <div class="tr-ex-row">
          <div class="ex-thumb-al">${img}</div>
          <div class="tr-ex-body">
            <div class="tr-nome">${esc(x.nome_cache||"Exercício")}</div>
            <div class="tr-presc">${partes.join(" · ")||"—"}</div>
            ${x.obs?`<div class="tr-obs">📝 ${esc(x.obs)}</div>`:""}
          </div>
        </div>
      </div>`;
    }).join("");
  }

  /* ---------- ALUNO: EXECUÇÃO DO TREINO (tela dedicada) ---------- */
  async function iniciarTreino(diaId){
    const dia = ALUNO_DIAS.find(d=>d.id===diaId);
    const exs = ALUNO_EXS.filter(x=>x.dia_id===diaId);
    if(!exs.length){ alert("Este treino não tem exercícios."); return; }

    // cria a sessão
    const { data: sess, error } = await sb.from("sessoes").insert({
      student_id: ME.id, professional_id: dia.professional_id,
      dia_id: diaId, ficha_id: dia.ficha_id, finalizada: false
    }).select().single();
    if(error){ alert("Erro ao iniciar: "+error.message); return; }
    EXEC_SESSAO = sess;
    EXEC_LOGS = {};

    // carga da última vez, por exercício
    const exIds = exs.map(e=>e.exercicio_id).filter(Boolean);
    ULTIMAS = {};
    if(exIds.length){
      const { data: hist } = await sb.from("series_feitas").select("exercicio_id,carga,created_at")
        .eq("student_id", ME.id).in("exercicio_id", exIds)
        .not("sessao_id","is",null).order("created_at",{ascending:false}).limit(300);
      (hist||[]).forEach(h=>{ if(h.exercicio_id && !(h.exercicio_id in ULTIMAS) && h.carga!=null) ULTIMAS[h.exercicio_id]=h.carga; });
    }
    renderExecucao(dia, exs);
    iniciarCronoTreino();
  }

  function renderExecucao(dia, exs){
    const p = document.getElementById("panel");
    const cards = exs.map((x,i)=>{
      const n = (x.series && x.series>0) ? x.series : 3;
      const ult = ULTIMAS[x.exercicio_id];
      let series = "";
      for(let s=1;s<=n;s++){
        series += `<div class="ser-row">
          <span class="ser-num">${s}ª</span>
          <input class="ser-in" type="number" step="0.5" placeholder="kg" value="${ult??""}" onchange="salvarSerie('${x.id}','${x.exercicio_id||""}',${s},this.value,null)">
          <input class="ser-in" type="number" placeholder="reps" onchange="salvarSerie('${x.id}','${x.exercicio_id||""}',${s},null,this.value)">
          <button class="ser-ok" onclick="marcarSerie(this)">✓</button>
        </div>`;
      }
      const alvo = [];
      if(x.series!=null && x.reps) alvo.push(`${x.series}x${esc(x.reps)}`);
      if(x.carga_alvo!=null) alvo.push(`alvo ${x.carga_alvo} kg`);
      const descBtn = (x.descanso_seg!=null) ?
        `<button class="desc-btn" style="margin-top:12px" onclick="descanso(${x.descanso_seg})">⏱️ Descansar ${x.descanso_seg}s</button>` : "";
      return `<div class="ex-card">
        <div class="ex-card-top">
          <div><div class="ex-card-nome">${esc(x.nome_cache||"Exercício")}</div>
          <div class="meta-sm">${alvo.join(" · ")}${ult!=null?` · última vez: ${ult} kg`:""}</div></div>
        </div>
        <div class="ser-head"><span>série</span><span>carga</span><span>reps</span><span>ok</span></div>
        ${series}
        ${descBtn}
      </div>`;
    }).join("");

    p.innerHTML = `
      <div class="exec-top">
        <button class="btn small ghost" onclick="sairExecucao()">← Sair</button>
        <div style="flex:1;text-align:center">
          <div class="exec-titulo">${esc(dia.label)}</div>
          <span class="exec-crono" id="execCrono">⏲️ 00:00</span>
        </div>
        <button class="btn small" id="descBtn" onclick="descanso(60)">⏱️ Descanso</button>
      </div>
      ${cards}
      <button class="btn" style="width:100%;margin-top:8px" onclick="finalizarTreino()">✅ Finalizar treino</button>`;
    window.scrollTo({top:0});
  }

  function marcarSerie(btn){ btn.classList.toggle("done"); }

  async function salvarSerie(fichaExId, exId, serie, carga, reps){
    const chave = fichaExId + "_" + serie;
    let atual = EXEC_LOGS[chave] || { carga:null, reps:null };
    if(carga!==null) atual.carga = carga===""?null:Number(carga);
    if(reps!==null)  atual.reps  = reps===""?null:Number(reps);
    EXEC_LOGS[chave] = atual;
    const payload = {
      sessao_id: EXEC_SESSAO.id, student_id: ME.id, professional_id: EXEC_SESSAO.professional_id,
      ficha_exercicio_id: fichaExId, exercicio_id: exId||null, serie_num: serie,
      carga: atual.carga, reps: atual.reps
    };
    if(atual.id){ await sb.from("series_feitas").update(payload).eq("id", atual.id); }
    else {
      const { data } = await sb.from("series_feitas").insert(payload).select("id").single();
      if(data) EXEC_LOGS[chave].id = data.id;
    }
  }

  let TIMER_INT = null;
  // cronômetro de descanso flutuante — funciona tanto na visão do treino quanto na execução
  function descanso(seg){
    clearInterval(TIMER_INT);
    let bar = document.getElementById("descFloat");
    if(!bar){
      bar = document.createElement("div");
      bar.id = "descFloat"; bar.className = "desc-float";
      document.body.appendChild(bar);
    }
    let t = seg;
    const render = (txt)=>{ bar.innerHTML = `<span id="descTxt">${txt}</span>
      <button onclick="pararDescanso()">Parar</button>`; };
    const tick = ()=>{
      if(t<=0){ clearInterval(TIMER_INT);
        render("Descanso concluído! 💪");
        try{ navigator.vibrate && navigator.vibrate(200); }catch(e){}
        setTimeout(pararDescanso, 2500); return; }
      render("⏱️ Descanso: " + t + "s"); t--;
    };
    tick(); TIMER_INT = setInterval(tick, 1000);
  }
  function pararDescanso(){
    clearInterval(TIMER_INT);
    const bar = document.getElementById("descFloat");
    if(bar) bar.remove();
  }

  // cronômetro de DURAÇÃO do treino (conta pra cima desde o iniciar)
  function iniciarCronoTreino(){
    clearInterval(CRONO_INT);
    EXEC_INICIO = Date.now();
    const upd = ()=>{
      const el = document.getElementById("execCrono");
      if(!el) return;
      const s = Math.floor((Date.now()-EXEC_INICIO)/1000);
      const mm = String(Math.floor(s/60)).padStart(2,"0");
      const ss = String(s%60).padStart(2,"0");
      el.textContent = "⏲️ " + mm + ":" + ss;
    };
    upd(); CRONO_INT = setInterval(upd, 1000);
  }
  function pararCronoTreino(){ clearInterval(CRONO_INT); EXEC_INICIO = null; }

  async function finalizarTreino(){
    if(!confirm("Finalizar o treino de hoje?")) return;
    pararDescanso(); pararCronoTreino();
    const dur = EXEC_INICIO ? Math.floor((Date.now()-EXEC_INICIO)/60000) : null;
    await sb.from("sessoes").update({ finalizada:true }).eq("id", EXEC_SESSAO.id);
    EXEC_SESSAO = null;
    go("meutreino");
    const msg = dur!=null ? `✅ Treino registrado em ${dur} min! Bom trabalho. 💪` : "✅ Treino registrado! Bom trabalho. 💪";
    setTimeout(()=>{ const b=document.getElementById("treinoBoxAluno"); if(b) b.insertAdjacentHTML("afterbegin", `<div class="msg ok" style="display:block">${msg}</div>`); }, 400);
  }

  function sairExecucao(){
    if(!confirm("Sair do treino? O que você já registrou fica salvo.")) return;
    pararDescanso(); pararCronoTreino();
    EXEC_SESSAO = null;
    go("meutreino");
  }

  async function loadExercicios(){

    EXERCICIOS = data || [];
    EX_FILTRO = "";

    if(f){
      const grupos = [...new Set(EXERCICIOS.map(e=>e.grupo).filter(Boolean))].sort();
      f.innerHTML = [`<button class="chip-f sel" data-g="" onclick="filtrarGrupo('')">Todos</button>`]

    }
    renderExercicios();

  function filtrarGrupo(g){
    EX_FILTRO = g;
    document.querySelectorAll("#exFiltros .chip-f").forEach(b=>b.classList.toggle("sel", (b.dataset.g||"")===g));

  function renderExercicios(){
    const box = document.getElementById("exLista");
    if(!box) return;
    const q = (document.getElementById("exBusca")||{}).value?.toLowerCase().trim() || "";
    let lista = EXERCICIOS;
    if(EX_FILTRO) lista = lista.filter(e=>e.grupo===EX_FILTRO);
    if(q) lista = lista.filter(e=>(e.nome||"").toLowerCase().includes(q));
    if(!lista.length){ box.innerHTML = `<div class="empty">Nenhum exercício encontrado.</div>`; return; }
    box.innerHTML = lista.map(e=>{
      const meu = e.professional_id === ME.id;
      const thumb = e.media_url
        ? `<img class="ex-thumb" src="${esc(e.media_url)}" alt="" onerror="this.style.display='none'">`
        : `<div class="ex-thumb ph">🏋️</div>`;
      return `<div class="ex-row">
        ${thumb}
        <div class="ex-info">
          <div class="ex-nome">${esc(e.nome)}</div>
          <div class="ex-meta">${esc(e.grupo||"")}${e.equipamento?" · "+esc(e.equipamento):""}${meu?' · <span class="tag">meu</span>':""}</div>

    }).join("");
  }

        <div id="archivedBox" style="margin-top:8px"></div>
      </div>`;
  }

  /* ================= DADOS ================= */
  async function loadStudents(){
    const { data: studs, error } = await sb.from("profiles").select("*").eq("professional_id", ME.id);
    if(error){
      const b=document.getElementById("alunosLista");
      if(b) b.innerHTML = `<div class="empty">Erro ao carregar: ${esc(error.message)}</div>`;
      return;
    }
    STUDENTS = studs || [];
    const { data: ast } = await sb.from("assessments")
      .select("id,student_id,date,weight,body_fat").order("date",{ascending:false});
    ASSESS = ast || [];
    renderStudents();
    loadInvites();
  }

  /* ---------- PROFISSIONAL: DESEMPENHO / RETENÇÃO ---------- */
  let RET_DADOS = [], RET_FILTRO = "todos";
  const RET_CLASSES = {
    em_dia:    {label:"Em dia",    cor:"#15803d", bg:"#eafaf0"},
    oscilando: {label:"Oscilando", cor:"#b45309", bg:"#fef3c7"},
    risco:     {label:"Em risco",  cor:"#c2410c", bg:"#ffedd5"},
    abandono:  {label:"Abandono",  cor:"#be123c", bg:"#ffe4e6"}
  };
  function classificaRet(dias){
    if(dias===null) return "abandono";
    if(dias<=3) return "em_dia";
    if(dias<=7) return "oscilando";
    if(dias<=14) return "risco";
    return "abandono";
  }

  function viewDesempenho(){
    return `<h2>Desempenho</h2>
      <div class="card">
        <h3>📈 Retenção dos alunos</h3>
        <p class="meta-sm" style="margin-top:2px">Como está a frequência de cada aluno, pela data do último treino registrado. Clique numa faixa para filtrar.</p>
        <div id="retResumo" style="margin:14px 0"><div class="empty">Carregando…</div></div>
        <div id="retLista"></div>
      </div>
      <div class="card">
        <h3>✅ Adesão da semana</h3>
        <p class="meta-sm" style="margin-top:2px">Treinos feitos nos últimos 7 dias × o previsto (nº de treinos da ficha ativa).</p>
        <div id="adesaoBox" style="margin-top:12px"><div class="empty">Carregando…</div></div>
      </div>`;
  }

  async function carregarDesempenho(){
    if(!STUDENTS.length){
      const { data: studs } = await sb.from("profiles").select("*").eq("professional_id", ME.id);
      STUDENTS = studs || [];
    }
    const ativos = STUDENTS.filter(s => (s.status||"active") === "active");
    const { data: sess } = await sb.from("sessoes").select("student_id,data")
      .eq("professional_id", ME.id).eq("finalizada", true).order("data",{ascending:false});
    const agora = Date.now();
    const ultimo = {}, semana = {};
    (sess||[]).forEach(s=>{
      if(!s.student_id) return;
      if(!(s.student_id in ultimo)) ultimo[s.student_id] = s.data;
      const dd = (agora - new Date(s.data).getTime())/86400000;
      if(dd <= 7) semana[s.student_id] = (semana[s.student_id]||0) + 1;
    });
    // previsto = nº de dias (treinos) da ficha ativa de cada aluno
    const { data: fichasAtivas } = await sb.from("fichas").select("id,student_id")
      .eq("professional_id", ME.id).eq("ativa", true);
    const idsFichas = (fichasAtivas||[]).map(f=>f.id);
    const previsto = {};
    if(idsFichas.length){
      const { data: dds } = await sb.from("ficha_dias").select("student_id,ficha_id")
        .eq("professional_id", ME.id).in("ficha_id", idsFichas);
      (dds||[]).forEach(d=>{ previsto[d.student_id] = (previsto[d.student_id]||0) + 1; });
    }
    RET_DADOS = ativos.map(s=>{
      const u = ultimo[s.id];
      const dias = u ? Math.floor((agora - new Date(u).getTime())/86400000) : null;
      return { s, dias, ultima:u, semana:semana[s.id]||0, previsto:previsto[s.id]||0, classe:classificaRet(dias) };
    }).sort((a,b)=> (b.dias==null?1e9:b.dias) - (a.dias==null?1e9:a.dias));
    renderResumoRet();
    renderListaRet();
    renderAdesao();
  }

  function renderAdesao(){
    const box = document.getElementById("adesaoBox");
    if(!box) return;
    const comFicha = RET_DADOS.filter(r=>r.previsto>0);
    if(!comFicha.length){ box.innerHTML = `<div class="empty">Nenhum aluno com ficha ativa ainda. Monte uma ficha para acompanhar a adesão.</div>`; return; }
    const lista = comFicha.slice().sort((a,b)=> (a.semana/a.previsto) - (b.semana/b.previsto));
    box.innerHTML = lista.map(r=>{
      const pct = Math.min(100, Math.round(100 * r.semana / r.previsto));
      const cor = pct>=100 ? "#15803d" : pct>=50 ? "#b45309" : "#be123c";
      return `<div class="ades-row">
        <div class="ades-top">
          <span class="rr-nome">${esc(nomeAluno(r.s))}</span>
          <span class="ades-num">${r.semana}/${r.previsto} <span style="color:var(--muted);font-weight:600">treinos</span></span>
        </div>
        <div class="ades-bar"><div class="ades-fill" style="width:${pct}%;background:${cor}"></div></div>
      </div>`;
    }).join("");
  }

  function renderResumoRet(){
    const box = document.getElementById("retResumo");
    if(!box) return;
    const cont = { em_dia:0, oscilando:0, risco:0, abandono:0 };
    RET_DADOS.forEach(r=> cont[r.classe]++);
    const cards = Object.keys(RET_CLASSES).map(k=>{
      const c = RET_CLASSES[k];
      const sel = RET_FILTRO===k ? " sel" : "";
      return `<div class="ret-card${sel}" style="background:${c.bg};color:${c.cor}" onclick="filtrarRet('${k}')">
        <div class="rc-num">${cont[k]}</div><div class="rc-lbl">${c.label}</div>
      </div>`;
    }).join("");
    box.innerHTML = `<div class="ret-cards">${cards}</div>
      ${RET_FILTRO!=="todos" ? `<button class="btn small ghost" style="margin-top:10px" onclick="filtrarRet('todos')">Ver todos</button>` : ""}`;
  }

  function filtrarRet(k){ RET_FILTRO = (RET_FILTRO===k ? "todos" : k); renderResumoRet(); renderListaRet(); }

  function renderListaRet(){
    const box = document.getElementById("retLista");
    if(!box) return;
    let lista = RET_DADOS;
    if(RET_FILTRO!=="todos") lista = lista.filter(r=>r.classe===RET_FILTRO);
    if(!RET_DADOS.length){ box.innerHTML = `<div class="empty">Nenhum aluno ativo com treino ainda.</div>`; return; }
    if(!lista.length){ box.innerHTML = `<div class="empty">Nenhum aluno nesta faixa. 🎉</div>`; return; }
    box.innerHTML = lista.map(r=>{
      const c = RET_CLASSES[r.classe];
      const nome = nomeAluno(r.s);
      const quando = r.dias==null ? "Nunca treinou" :
        (r.dias===0 ? "Treinou hoje" : r.dias===1 ? "Treinou ontem" : `Há ${r.dias} dias sem treinar`);
      const cobrar = (r.classe!=="em_dia")
        ? `<button class="btn small" onclick="cobrarAluno('${r.s.id}')">💬 Cobrar</button>` : "";
      return `<div class="ret-row">
        <div style="flex:1;min-width:150px">
          <div class="rr-nome">${esc(nome)}</div>
          <div class="rr-sub">${quando} · ${r.semana} treino${r.semana===1?"":"s"} na semana</div>
        </div>
        <span class="ret-badge" style="background:${c.bg};color:${c.cor}">${c.label}</span>
        ${cobrar}
      </div>`;
    }).join("");
  }

  function cobrarAluno(id){
    const r = RET_DADOS.find(x=>x.s.id===id);
    if(!r) return;
    const nome = (nomeAluno(r.s)||"").split(" ")[0];
    const texto = r.dias==null
      ? `Oi ${nome}! Bora começar seu treino? Tô aqui pra te ajudar. 💪`
      : `Oi ${nome}! Vi que faz ${r.dias} dias que você não treina. Bora voltar hoje? 💪`;
    window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
  }

  function linhaAluno(s, arquivado){
    const nome = nomeAluno(s);
    const n = ASSESS.filter(a=>a.student_id===s.id).length;
    const sub = (s.email && s.email!==nome) ? `${esc(s.email)} · ${n} avaliação(ões)` : `${n} avaliação(ões)`;
    const acoes = arquivado
      ? `<button class="btn small ghost" onclick="verAvaliacoes('${s.id}')">Ver histórico</button>
         <button class="btn small" onclick="reativarAluno('${s.id}')">Reativar</button>`
      : `<a class="btn small ghost" title="Ver dashboard" href="dashboard.html?aluno=${s.id}">📊</a>
         <button class="btn small ghost" onclick="verAvaliacoes('${s.id}')">Ver</button>
         <button class="btn small ghost" title="Agendar consulta" onclick="novaConsulta('${s.id}')">📅</button>
         <button class="btn small" onclick="novaAvaliacao('${s.id}')">Nova avaliação</button>
         <span class="menu-wrap">
           <button class="btn small ghost dots" title="Mais opções" onclick="abrirMenu(event,'menu_${s.id}')">⋮</button>
           <span class="menu-drop" id="menu_${s.id}">
             <button onclick="dadosCliente('${s.id}')">Dados do cliente</button>
             <button onclick="abrirMetas('${s.id}')">Definir metas</button>
             <button onclick="arquivarAluno('${s.id}')">Arquivar</button>
           </span>
         </span>`;
    return `<div class="student-row">
      <div><div class="name">${esc(nome)}</div><div class="meta">${sub}</div></div>
      <div class="row-actions">${acoes}</div>
      <div id="assessList_${s.id}" style="width:100%"></div>
    </div>`;
  }

  function renderStudents(){
    const ativos = STUDENTS.filter(s => (s.status||"active") === "active")
                           .sort((a,b)=> nomeAluno(a).localeCompare(nomeAluno(b),"pt-BR"));
    const arqs   = STUDENTS.filter(s => s.status === "archived");
    ATIVOS_CACHE = ativos;

    const busca = (document.getElementById("alunoSearch")||{}).value || "";
    desenharListaAlunos(filtrar(ativos, busca));

    // se o aluno selecionado ainda existe e está ativo, mantém o detalhe
    if(SELECTED_STUDENT && ativos.some(s=>s.id===SELECTED_STUDENT)) selecionarAluno(SELECTED_STUDENT);
    else if(SELECTED_STUDENT){ SELECTED_STUDENT=null; const d=document.getElementById("alunoDetalhe");
      if(d) d.innerHTML = `<div class="empty">👉 Selecione um aluno na lista ao lado para ver as opções.</div>`; }

    const arq = document.getElementById("archivedBox");
    if(arq) arq.innerHTML = arqs.length
      ? arqs.map(s=>linhaAluno(s,true)).join("")
      : `<div class="empty">Nenhum aluno arquivado.</div>`;
  }

  function filtrar(lista, q){
    q = (q||"").toLowerCase().trim();
    if(!q) return lista;
    return lista.filter(s => nomeAluno(s).toLowerCase().includes(q) || (s.email||"").toLowerCase().includes(q));
  }

  function desenharListaAlunos(lista){
    const box = document.getElementById("alunosLista");
    if(!box) return;
    if(!lista.length){ box.innerHTML = `<div class="empty">Nenhum aluno encontrado.</div>`; return; }
    box.innerHTML = lista.map(s=>{
      const sel = SELECTED_STUDENT===s.id ? " sel" : "";
      const n = ASSESS.filter(a=>a.student_id===s.id).length;
      return `<button class="aluno-item${sel}" onclick="selecionarAluno('${s.id}')">
        <span class="ai-nome">${esc(nomeAluno(s))}</span>
        <span class="ai-n">${n}</span>
      </button>`;
    }).join("");
  }

  function filtrarAlunos(){
    desenharListaAlunos(filtrar(ATIVOS_CACHE, (document.getElementById("alunoSearch")||{}).value));
  }

  function toggleBuscaAluno(){
    const e = document.getElementById("alunoSearch");
    if(!e) return;
    const mostrar = e.style.display === "none";
    e.style.display = mostrar ? "block" : "none";
    if(mostrar){ e.focus(); } else { e.value=""; filtrarAlunos(); }
  }

  function selecionarAluno(id){
    SELECTED_STUDENT = id;
    const s = STUDENTS.find(x=>x.id===id);
    desenharListaAlunos(filtrar(ATIVOS_CACHE, (document.getElementById("alunoSearch")||{}).value));
    const det = document.getElementById("alunoDetalhe");
    if(!det || !s) return;
    const n = ASSESS.filter(a=>a.student_id===id).length;
    det.innerHTML = `
      <div class="det-head">
        <div class="det-nome">${esc(nomeAluno(s))}</div>
        <div class="det-sub">${s.email?esc(s.email)+" · ":""}${n} avaliação(ões)</div>
      </div>
      ${temTreino()?`<div class="treino-resumo-al" id="treinoResumo_${id}">🏋️ carregando treino…</div>`:""}
      <div class="det-acoes">
        <a class="btn small" href="dashboard.html?aluno=${id}">📊 Dashboard</a>
        ${temTreino()?`<button class="btn small" onclick="abrirTreino('${id}')">🏋️ Treino</button>`:""}
        <button class="btn small" onclick="novaAvaliacao('${id}')">➕ Nova avaliação</button>
        <button class="btn small ghost" onclick="verAvaliacoes('${id}')">📋 Ver avaliações</button>
        <button class="btn small ghost" onclick="novaConsulta('${id}')">📅 Consultas</button>
        <button class="btn small ghost" onclick="abrirMetas('${id}')">🎯 Metas</button>
        <button class="btn small ghost" onclick="dadosCliente('${id}')">👤 Dados do cliente</button>
        <button class="btn small ghost" onclick="arquivarAluno('${id}')">📁 Arquivar</button>
      </div>
      <div id="assessList_${id}" style="margin-top:6px"></div>`;
    if(temTreino()) carregarResumoTreinoAluno(id);
  }

  async function carregarResumoTreinoAluno(id){
    const el = document.getElementById("treinoResumo_"+id);
    if(!el) return;
    const agora = Date.now();
    const { data: sess } = await sb.from("sessoes").select("data")
      .eq("student_id", id).eq("finalizada", true).order("data",{ascending:false});
    const ult = (sess && sess.length) ? sess[0].data : null;
    const semana = (sess||[]).filter(x=> (agora-new Date(x.data).getTime())/86400000 <= 7).length;
    const { data: fichas } = await sb.from("fichas").select("id").eq("student_id", id).eq("ativa", true).limit(1);
    let previsto = 0;
    if(fichas && fichas.length){
      const { count } = await sb.from("ficha_dias").select("id",{count:"exact",head:true}).eq("ficha_id", fichas[0].id);
      previsto = count || 0;
    }
    const dias = ult ? Math.floor((agora-new Date(ult).getTime())/86400000) : null;
    const quando = dias==null ? "Nunca treinou" :
      (dias===0 ? "Treinou hoje" : dias===1 ? "Treinou ontem" : `Há ${dias} dias sem treinar`);
    const ades = previsto ? ` · <b>${semana}/${previsto}</b> treinos essa semana`
                          : ` · ${semana} treino${semana===1?"":"s"} essa semana`;
    el.innerHTML = `🏋️ ${quando}${ades}`;
  }

  async function loadInvites(){
    const { data } = await sb.from("invites").select("*")
      .eq("professional_id", ME.id).order("created_at",{ascending:false});
    INVITES = data || [];
    renderInvites();
  }

  function renderInvites(){
    const box = document.getElementById("invitesBox");
    if(!box) return;
    if(!INVITES.length){ box.innerHTML = `<div class="empty">Nenhum aluno cadastrado ainda.</div>`; return; }
    const entraram = new Set(STUDENTS.map(s=>(s.email||"").toLowerCase()));
    box.innerHTML = INVITES.map(iv=>{
      const ativo = entraram.has(iv.email.toLowerCase());
      const status = ativo
        ? `<span class="tag" style="background:#eafaf0;color:#1a8a4a;border-color:#bbeccb">já entrou</span>`
        : `<span class="tag">aguardando 1º acesso</span>`;
      return `<div class="student-row">
        <div><div class="name">${esc(iv.full_name || iv.email)}</div>
             <div class="meta">${iv.full_name ? esc(iv.email)+" · " : ""}${status}</div></div>
        <div class="row-actions"><button class="btn small ghost" onclick="removerConvite('${esc(iv.email)}')">Remover</button></div>
      </div>`;
    }).join("");
  }

  async function cadastrarAluno(){
    const nome  = document.getElementById("inviteName").value.trim();
    const email = document.getElementById("inviteEmail").value.trim().toLowerCase();
    const msg = document.getElementById("inviteMsg"), btn = document.getElementById("inviteBtn");
    if(!nome){ msg.className="msg err"; msg.textContent="Digite o nome do aluno."; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.className="msg err"; msg.textContent="Digite um e-mail válido."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.from("invites").insert({ email, full_name:nome, professional_id:ME.id });
    btn.disabled=false;
    if(error){
      msg.className="msg err";
      msg.textContent = /duplicate|unique/i.test(error.message) ? "Esse e-mail já está cadastrado." : "Erro: "+error.message;
      return;
    }
    msg.className="msg ok"; msg.textContent = nome+" cadastrado! Agora ele pode fazer o primeiro acesso.";
    document.getElementById("inviteName").value=""; document.getElementById("inviteEmail").value="";
    loadInvites();
  }

  async function removerConvite(email){
    if(!confirm("Remover o cadastro de "+email+"?\n\n(não apaga a conta já criada, apenas o cadastro do e-mail)")) return;
    const { error } = await sb.from("invites").delete().eq("email", email).eq("professional_id", ME.id);
    if(error){ alert("Erro ao remover: "+error.message); return; }
    loadInvites();
  }

  function abrirMenu(ev, id){
    ev.stopPropagation();
    const alvo = document.getElementById(id);
    const aberto = alvo && alvo.classList.contains("open");
    document.querySelectorAll(".menu-drop.open").forEach(m=>m.classList.remove("open"));
    if(alvo && !aberto) alvo.classList.add("open");
  }
  document.addEventListener("click", ()=>{
    document.querySelectorAll(".menu-drop.open").forEach(m=>m.classList.remove("open"));
  });

  function dadosCliente(id){
    const s = STUDENTS.find(x=>x.id===id);
    document.getElementById("cliId").value = id;
    document.getElementById("cli_nome").value = s?.full_name || "";
    document.getElementById("cli_sex").value = s?.sex || "";
    document.getElementById("cli_birth").value = s?.birth_date ? String(s.birth_date).slice(0,10) : "";
    const m = document.getElementById("cliMsg"); m.className="msg"; m.textContent="";
    const card = document.getElementById("clienteCard");
    card.style.display = "block";
    card.scrollIntoView({behavior:"smooth",block:"center"});
  }
  function fecharDados(){ const c=document.getElementById("clienteCard"); if(c) c.style.display="none"; }

  async function salvarDados(){
    const id = document.getElementById("cliId").value;
    const msg = document.getElementById("cliMsg"), btn = document.getElementById("cliBtn");
    const nome  = document.getElementById("cli_nome").value.trim() || null;
    const sex   = document.getElementById("cli_sex").value || null;
    const birth = document.getElementById("cli_birth").value || null;
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.from("profiles").update({ full_name:nome, sex, birth_date:birth }).eq("id", id);
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro: "+error.message; return; }
    const s = STUDENTS.find(x=>x.id===id);
    if(s){ s.full_name=nome; s.sex=sex; s.birth_date=birth; }
    msg.className="msg ok"; msg.textContent="✅ Dados salvos!";
    renderStudents();
  }

  async function arquivarAluno(id){
    const s = STUDENTS.find(x=>x.id===id);
    if(!confirm(`Arquivar ${nomeAluno(s)}?\n\nEle perde o acesso ao painel, mas todo o histórico fica guardado e você pode reativar depois.`)) return;
    const { error } = await sb.from("profiles")
      .update({ status:"archived", archived_at:new Date().toISOString() }).eq("id", id);
    if(error){ alert("Erro ao arquivar: "+error.message); return; }
    loadStudents();
  }

  async function reativarAluno(id){
    const { error } = await sb.from("profiles").update({ status:"active", archived_at:null }).eq("id", id);
    if(error){ alert("Erro ao reativar: "+error.message); return; }
    loadStudents();
  }

  function chips(obj, lista, un){
    if(!obj) return "";
    const itens = lista.filter(([k])=>obj[k]!=null)
      .map(([k,r])=>`<div class="med"><span>${r}</span><b>${Number(obj[k]).toLocaleString("pt-BR",{maximumFractionDigits:1})}${un}</b></div>`);
    return itens.length ? itens.join("") : "";
  }

  function avaliacaoDetalhe(a, idx, podeEditar){
    const umaCasa = ["body_fat","fat_mass","lean_mass"];
    const gerais = GERAIS.filter(([k])=>a[k]!=null)
      .map(([k,r,un])=>{
        const min = umaCasa.includes(k) ? 1 : 0;
        return `<div class="med"><span>${r}</span><b>${Number(a[k]).toLocaleString("pt-BR",{minimumFractionDigits:min,maximumFractionDigits:1})}${un}</b></div>`;
      }).join("");
    const dob = chips(a.skinfolds, DOBRAS, " mm");
    const per = chips(a.circumferences, PERIMETROS, " cm");
    const menu = podeEditar ? `<span class="menu-wrap">
        <button class="btn small ghost dots" title="Mais opções" onclick="abrirMenu(event,'am_${a.id}')">⋮</button>
        <span class="menu-drop" id="am_${a.id}">
          <button onclick="editarAvaliacao('${a.id}','${a.student_id}')">Editar</button>
          <button onclick="excluirAvaliacao('${a.id}','${a.student_id}')">Excluir avaliação</button>
        </span></span>` : "";
    return `<div class="aval" id="av_${a.id}">
      <div class="aval-head">
        <button class="chev" title="Mostrar medidas" onclick="toggleAval('av_${a.id}')">▶</button>
        <b>${fmtDate(a.date)}</b>
        ${idx===0?'<span class="tag" style="background:#eafaf0;color:#1a8a4a;border-color:#bbeccb">mais recente</span>':''}
        <span style="margin-left:auto">${menu}</span>
      </div>
      <div class="aval-body">

  /* ---------- CÁLCULO DE COMPOSIÇÃO CORPORAL ----------
     Jackson & Pollock (7 dobras) → densidade → Siri → % gordura */
  function idadeAnos(dataNasc){
    if(!dataNasc) return null;
    const n = new Date(String(dataNasc).slice(0,10)+"T00:00:00");
    if(isNaN(n)) return null;
    const h = new Date();
    let a = h.getFullYear() - n.getFullYear();
    const m = h.getMonth() - n.getMonth();
    if(m < 0 || (m === 0 && h.getDate() < n.getDate())) a--;
    return a;
  }

  function somaSeteDobras(){
    let soma = 0;
    for(const [k] of DOBRAS){
      const e = document.getElementById("dob_"+k);
      if(!e || e.value === "") return null;   // exige as 7 dobras
      const v = Number(e.value);
      if(isNaN(v)) return null;
      soma += v;
    }
    return soma;
  }

  function calcComposicao(sexo, idade, sigma7, peso){
    if(!sexo || idade == null || !sigma7 || !peso) return null;
    let BD;
    if(sexo === "M")
      BD = 1.112 - 0.00043499*sigma7 + 0.00000055*sigma7*sigma7 - 0.00028826*idade;
    else
      BD = 1.097 - 0.00046971*sigma7 + 0.00000056*sigma7*sigma7 - 0.00012828*idade;
    const pctFat = (495/BD) - 450;           // Siri
    if(!isFinite(pctFat) || pctFat <= 0 || pctFat >= 70) return null;
    const massaGorda = peso * pctFat/100;
    const massaMagra = peso - massaGorda;
    return { pctFat, massaGorda, massaMagra };
  }

  function modoManual(manual){
    MANUAL_CALC = manual;
    ["a_bf","a_fat","a_lean"].forEach(id=>{
      const e=document.getElementById(id); if(!e) return;
      if(manual) e.removeAttribute("readonly"); else e.setAttribute("readonly","");
    });
    document.querySelectorAll(".menu-drop.open").forEach(m=>m.classList.remove("open"));
    const msg = document.getElementById("calcMsg");
    if(manual){
      if(msg){ msg.className="msg warn"; msg.textContent="✏️ Edição manual ativada — você pode alterar os três valores. Eles não serão recalculados automaticamente."; }
      const bf = document.getElementById("a_bf"); if(bf) bf.focus();
    } else {
      recalcularComposicao();
    }
  }

  function recalcularComposicao(){
    if(MANUAL_CALC) return;   // não sobrescreve durante edição manual
    const msg = document.getElementById("calcMsg");
    const bf = document.getElementById("a_bf"), fat = document.getElementById("a_fat"), lean = document.getElementById("a_lean");
    if(!bf) return;
    const s = ASSESS_S || {};
    const sexo  = s.sex || "";
    const idade = idadeAnos(s.birth_date);
    const peso  = Number((document.getElementById("a_weight")||{}).value) || null;
    const sigma = somaSeteDobras();

    const r = calcComposicao(sexo, idade, sigma, peso);
    if(r){
      bf.value  = r.pctFat.toFixed(1);
      fat.value = r.massaGorda.toFixed(1);
      lean.value= r.massaMagra.toFixed(1);
      if(msg){ msg.className="msg ok"; msg.textContent = `Calculado · Σ7 = ${sigma.toFixed(1)} mm · idade ${idade} anos · ${sexo==="M"?"masculino":"feminino"}`; }
    } else {
      bf.value=""; fat.value=""; lean.value="";
      if(msg){
        const faltam = [];
        if(!sexo || idade == null) faltam.push("sexo e data de nascimento do cliente (edite em ⋮ → Dados do cliente)");
        if(!peso)          faltam.push("peso");
        if(sigma == null)  faltam.push("as 7 dobras");
        msg.className = faltam.length ? "msg warn" : "msg";
        msg.textContent = faltam.length ? "Faltam: " + faltam.join("; ") + "." : "";
      }
    }
  }

  function prepararCalculo(s){
    ASSESS_S = s || null;
    MANUAL_CALC = false;
    ["a_bf","a_fat","a_lean"].forEach(id=>{ const e=document.getElementById(id); if(e) e.setAttribute("readonly",""); });
    const info = document.getElementById("assessCliente");
    if(info){
      const idade = idadeAnos(s && s.birth_date);
      const partes = [];
      if(s && s.sex) partes.push(s.sex==="M" ? "Masculino" : "Feminino");
      if(idade != null) partes.push(idade + " anos");
      info.innerHTML = partes.length
        ? `<span class="tag" style="background:#eef4ff;color:#1d4ed8;border-color:#c7dbff">${partes.join(" · ")}</span>`
        : `<span class="tag">defina sexo e nascimento em ⋮ → Dados do cliente</span>`;
    }
    const card = document.getElementById("assessCard");
    if(card && !card.dataset.calcOn){
      card.dataset.calcOn = "1";
      card.addEventListener("input", recalcularComposicao);
      card.addEventListener("change", recalcularComposicao);
    }
    recalcularComposicao();
  }

    const data = document.getElementById("g_data").value || null;
    const campos = {
      ideal_weight:     num("g_peso"),
      target_bodyfat:   num("g_bf"),
      target_date:      data,
      monthly_workouts: num("g_treinos"),
      updated_at:       new Date().toISOString()
    };
    if(campos.ideal_weight==null && campos.target_bodyfat==null && !data && campos.monthly_workouts==null){
      msg.className="msg err"; msg.textContent="Preencha ao menos uma meta."; return;
    }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    let error;
    if(gid){ ({ error } = await sb.from("goals").update(campos).eq("id", gid)); }
    else   { ({ error } = await sb.from("goals").insert({ student_id, ...campos })); }
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro ao salvar: "+error.message; return; }
    msg.className="msg ok"; msg.textContent="Metas salvas! Já aparecem no painel do aluno.";
    if(!gid) abrirMetas(student_id);
  }

  /* ---------- PROFISSIONAL: CONSULTAS ---------- */
  function novaConsulta(id){
    const s = STUDENTS.find(x=>x.id===id);
    document.getElementById("consultStudentId").value = id;
    document.getElementById("consultStudentName").textContent = nomeAluno(s);
    document.getElementById("c_date").value = "";
    document.getElementById("c_time").value = "09:00";
    document.getElementById("c_notes").value = "";
    const card = document.getElementById("consultCard");
    card.style.display = "block";
    const m = document.getElementById("consultMsg"); m.className="msg"; m.textContent="";
    listarConsultas(id);
    card.scrollIntoView({behavior:"smooth",block:"center"});
  }
  function fecharConsulta(){ const c=document.getElementById("consultCard"); if(c) c.style.display="none"; }

  async function listarConsultas(id){
    const box = document.getElementById("consultList");
    const { data, error } = await sb.from("consultations").select("*")
      .eq("student_id", id).order("scheduled_at",{ascending:false});
    if(!box) return;
    if(error){ box.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
    if(!data || !data.length){ box.innerHTML = `<div class="empty">Nenhuma consulta agendada para este aluno.</div>`; return; }
    const agora = new Date();
    box.innerHTML = data.map(c=>{
      const futura = new Date(c.scheduled_at) >= agora;
      const et = futura
        ? `<span class="tag" style="background:#eef4ff;color:#1d4ed8;border-color:#c7dbff">agendada</span>`
        : `<span class="tag">realizada</span>`;
      return `<div class="student-row">
        <div><div class="name">${fmtDataHora(c.scheduled_at)} ${et}</div>
             ${c.notes?`<div class="meta">${esc(c.notes)}</div>`:""}</div>
        <div class="row-actions"><button class="btn small ghost" onclick="excluirConsulta('${c.id}','${id}')">Remover</button></div>
      </div>`;
    }).join("");
  }

  async function salvarConsulta(){
    const msg=document.getElementById("consultMsg"), btn=document.getElementById("consultSaveBtn");
    const student_id=document.getElementById("consultStudentId").value;
    const d=document.getElementById("c_date").value, h=document.getElementById("c_time").value || "09:00";
    if(!student_id || !d){ msg.className="msg err"; msg.textContent="Escolha a data da consulta."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.from("consultations").insert({
      student_id, scheduled_at: new Date(`${d}T${h}`).toISOString(),
      notes: document.getElementById("c_notes").value.trim() || null,
      created_by: ME.id
    });
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro ao agendar: "+error.message; return; }
    msg.className="msg ok"; msg.textContent="Consulta agendada!";
    document.getElementById("c_notes").value="";
    listarConsultas(student_id);
  }

  async function excluirConsulta(id, studentId){
    if(!confirm("Remover esta consulta?")) return;
    const { error } = await sb.from("consultations").delete().eq("id", id);
    if(error){ alert("Erro ao remover: "+error.message); return; }
    listarConsultas(studentId);
  }

  async function salvarAvaliacao(){
    const msg=document.getElementById("assessMsg"), btn=document.getElementById("assessSaveBtn");
    const student_id=document.getElementById("assessStudentId").value;
    const date=document.getElementById("a_date").value;
    if(!student_id || !date){ msg.className="msg err"; msg.textContent="Escolha aluno e data."; return; }
    const val = id => { const e=document.getElementById(id); return (!e || e.value==="") ? null : Number(e.value); };
    const juntar = (pref, lista) => {
      const o = {};
      lista.forEach(([k])=>{ const v = val(pref+k); if(v!=null) o[k]=v; });
      return Object.keys(o).length ? o : null;
    };
    const row = { student_id, date,
      weight:   val("a_weight"),
      height:   val("a_height"),
      body_fat: val("a_bf"),
      lean_mass:val("a_lean"),
      fat_mass: val("a_fat"),
      skinfolds:      juntar("dob_", DOBRAS),
      circumferences: juntar("per_", PERIMETROS),
      notes:    document.getElementById("a_notes").value.trim() || null,
      created_by: ME.id };
    btn.disabled=true; msg.className="msg"; msg.textContent="";

    let error;
    if(EDIT_ID){
      const { created_by, ...campos } = row;
      ({ error } = await sb.from("assessments").update(campos).eq("id", EDIT_ID));
    } else {
      ({ error } = await sb.from("assessments").insert(row));
    }
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro ao salvar: "+error.message; return; }
    msg.className="msg ok"; msg.textContent = EDIT_ID ? "Alterações salvas!" : "Avaliação salva!";
    const alvo = student_id;
    EDIT_ID = null;
    await loadStudents();
    const lista = document.getElementById("assessList_"+alvo);
    if(lista && lista.innerHTML){ lista.innerHTML=""; verAvaliacoes(alvo); }
    setTimeout(fecharForm, 800);
  }

  init();
</script>
