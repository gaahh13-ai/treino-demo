  async function carregarDesempenho(){
    if(!STUDENTS.length){
      const { data: studs } = await sb.from("profiles").select("*").eq("professional_id", ME.id);
      STUDENTS = studs || [];
    }
    const ativos = STUDENTS.filter(s => (s.status||"active") === "active");
    const { data: sess } = await sb.from("sessoes").select("student_id,data")
      .eq("professional_id", ME.id).eq("finalizada", true).order("data",{ascending:false});
    const agora = Date.now();
    const ultimo = {}, semana = {};
    (sess||[]).forEach(s=>{
      if(!s.student_id) return;
      if(!(s.student_id in ultimo)) ultimo[s.student_id] = s.data;
      const dd = (agora - new Date(s.data).getTime())/86400000;
      if(dd <= 7) semana[s.student_id] = (semana[s.student_id]||0) + 1;
    });
    // previsto = nº de dias (treinos) da ficha ativa de cada aluno
    const { data: fichasAtivas } = await sb.from("fichas").select("id,student_id")
      .eq("professional_id", ME.id).eq("ativa", true);
    const idsFichas = (fichasAtivas||[]).map(f=>f.id);
    const previsto = {};
    if(idsFichas.length){
      const { data: dds } = await sb.from("ficha_dias").select("student_id,ficha_id")
        .eq("professional_id", ME.id).in("ficha_id", idsFichas);
      (dds||[]).forEach(d=>{ previsto[d.student_id] = (previsto[d.student_id]||0) + 1; });
    }
    RET_DADOS = ativos.map(s=>{
      const u = ultimo[s.id];
      const dias = u ? Math.floor((agora - new Date(u).getTime())/86400000) : null;
      return { s, dias, ultima:u, semana:semana[s.id]||0, previsto:previsto[s.id]||0, classe:classificaRet(dias) };
    }).sort((a,b)=> (b.dias==null?1e9:b.dias) - (a.dias==null?1e9:a.dias));
    renderResumoRet();
    renderListaRet();
    renderAdesao();
  }

  function renderAdesao(){
    const box = document.getElementById("adesaoBox");
    if(!box) return;
    const comFicha = RET_DADOS.filter(r=>r.previsto>0);
    if(!comFicha.length){ box.innerHTML = `<div class="empty">Nenhum aluno com ficha ativa ainda. Monte uma ficha para acompanhar a adesão.</div>`; return; }
    const lista = comFicha.slice().sort((a,b)=> (a.semana/a.previsto) - (b.semana/b.previsto));
    box.innerHTML = lista.map(r=>{
      const pct = Math.min(100, Math.round(100 * r.semana / r.previsto));
      const cor = corDegradeMeta(r.semana, r.previsto);   // preto → verde conforme a meta
      return `<div class="ades-row">
        <div class="ades-top">
          <span class="rr-nome">${esc(nomeAluno(r.s))}</span>
          <span class="ades-num">${r.semana}/${r.previsto} <span style="color:var(--muted);font-weight:600">treinos</span></span>
        </div>
        <div class="ades-bar"><div class="ades-fill" style="width:${pct}%;background:${cor}"></div></div>
      </div>`;
    }).join("");
  }
  // cor do "preto ao verde LEVO" conforme a proximidade da meta (0 → 1)
  function corDegradeMeta(n, meta){
    const ratio = meta>0 ? Math.max(0, Math.min(1, n/meta)) : 0;
    const a=[38,42,50], b=[127,255,0];   // grafite → chartreuse
    const c=a.map((x,i)=>Math.round(x+(b[i]-x)*ratio));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  async function carregarResumoTreinoAluno(id){
    const el = document.getElementById("treinoResumo_"+id);
    if(!el) return;
    const s = STUDENTS.find(x=>x.id===id);
    const criado = (s && s.created_at) ? new Date(s.created_at) : null;   // desde quando é aluno
    const agora = Date.now();
    const { data: sess } = await sb.from("sessoes").select("data")
      .eq("student_id", id).eq("finalizada", true).order("data",{ascending:false});
    const ult = (sess && sess.length) ? sess[0].data : null;
    const semana = (sess||[]).filter(x=> (agora-new Date(x.data).getTime())/86400000 <= 7).length;
    const { data: fichas } = await sb.from("fichas").select("id").eq("student_id", id).eq("ativa", true).limit(1);
    let previsto = 0;
    if(fichas && fichas.length){
      const { count } = await sb.from("ficha_dias").select("id",{count:"exact",head:true}).eq("ficha_id", fichas[0].id);
      previsto = count || 0;
    }
    // adesão das últimas 6 semanas (seg-dom) em miniquadrados
    const hoje0 = new Date(); hoje0.setHours(0,0,0,0);
    const dow = (hoje0.getDay()+6)%7;
    const inicioSem = new Date(hoje0); inicioSem.setDate(hoje0.getDate()-dow);
    const semanas = [];
    for(let i=5;i>=0;i--){
      const ini = new Date(inicioSem); ini.setDate(inicioSem.getDate()-7*i);
      const fim = new Date(ini); fim.setDate(ini.getDate()+7);
      const n = (sess||[]).filter(x=>{ const d=new Date(x.data); return d>=ini && d<fim; }).length;
      semanas.push({ n, ini, fim, rot: ini.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}) });
    }
    const ref = previsto>0 ? previsto : Math.max(1, ...semanas.map(w=>w.n));
    const quadros = semanas.map((w,i)=>{
      const atual = i===semanas.length-1 ? " atual" : "";
      // semana inteira antes de o aluno entrar no app → não conta como perdida
      if(criado && criado >= w.fim){
        return `<span class="wk-sq pre${atual}" title="Semana de ${w.rot}: antes do cadastro">–</span>`;
      }
      const ratio = ref>0 ? Math.min(1, w.n/ref) : 0;
      const txtCor = ratio>0.55 ? "#0a0b0d" : "#e8eaee";
      const txt = previsto ? `${w.n}/${previsto}` : `${w.n}`;
      return `<span class="wk-sq${atual}" title="Semana de ${w.rot}: ${w.n} treino${w.n===1?"":"s"}${previsto?" de "+previsto:""}" style="background:${corDegradeMeta(w.n, ref)};color:${txtCor}">${txt}</span>`;
    }).join("");
    el.innerHTML = `<div class="wk-mini">
        <span class="wk-lbl">Treinos</span>
        <span class="wk-row" title="Adesão nas últimas 6 semanas (feitos/meta)">${quadros}</span>
      </div>`;
  }

  async function cadastrarAluno(){
    const nome  = document.getElementById("inviteName").value.trim();
    const email = document.getElementById("inviteEmail").value.trim().toLowerCase();
    const msg = document.getElementById("inviteMsg"), btn = document.getElementById("inviteBtn");
    if(!nome){ msg.className="msg err"; msg.textContent="Digite o nome do aluno."; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.className="msg err"; msg.textContent="Digite um e-mail válido."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.from("invites").insert({ email, full_name:nome, professional_id:ME.id });
    btn.disabled=false;
    if(error){
      msg.className="msg err";
      msg.textContent = /duplicate|unique/i.test(error.message) ? "Esse e-mail já está cadastrado." : "Erro: "+error.message;
      return;
    }
    msg.className="msg ok"; msg.textContent = nome+" cadastrado! Agora ele pode fazer o primeiro acesso.";
    document.getElementById("inviteName").value=""; document.getElementById("inviteEmail").value="";
    loadInvites();
  }

  async function salvarDados(){
    const id = document.getElementById("cliId").value;
    const msg = document.getElementById("cliMsg"), btn = document.getElementById("cliBtn");
    const nome  = document.getElementById("cli_nome").value.trim() || null;
    const sex   = document.getElementById("cli_sex").value || null;

  /* ---------- CÁLCULO DE COMPOSIÇÃO CORPORAL ----------
     Jackson & Pollock (7 dobras) → densidade → Siri → % gordura */
  function idadeAnos(dataNasc){
    if(!dataNasc) return null;
    const n = new Date(String(dataNasc).slice(0,10)+"T00:00:00");
    if(isNaN(n)) return null;
    const h = new Date();
    let a = h.getFullYear() - n.getFullYear();
    const m = h.getMonth() - n.getMonth();
    if(m < 0 || (m === 0 && h.getDate() < n.getDate())) a--;
    return a;
  }

  function somaSeteDobras(){
    let soma = 0;
    for(const [k] of DOBRAS){
      const e = document.getElementById("dob_"+k);
      if(!e || e.value === "") return null;   // exige as 7 dobras
      const v = Number(e.value);
      if(isNaN(v)) return null;
      soma += v;
    }
    return soma;
  }

  function calcComposicao(sexo, idade, sigma7, peso){
    if(!sexo || idade == null || !sigma7 || !peso) return null;
    let BD;
    if(sexo === "M")
      BD = 1.112 - 0.00043499*sigma7 + 0.00000055*sigma7*sigma7 - 0.00028826*idade;
    else
      BD = 1.097 - 0.00046971*sigma7 + 0.00000056*sigma7*sigma7 - 0.00012828*idade;
    const pctFat = (495/BD) - 450;           // Siri
    if(!isFinite(pctFat) || pctFat <= 0 || pctFat >= 70) return null;
    const massaGorda = peso * pctFat/100;
    const massaMagra = peso - massaGorda;
    return { pctFat, massaGorda, massaMagra };
  }

  function modoManual(manual){
    MANUAL_CALC = manual;
    ["a_bf","a_fat","a_lean"].forEach(id=>{
      const e=document.getElementById(id); if(!e) return;

    });
    document.querySelectorAll(".menu-drop.open").forEach(m=>m.classList.remove("open"));
    const msg = document.getElementById("calcMsg");
    if(manual){
      if(msg){ msg.className="msg warn"; msg.textContent="✏️ Edição manual ativada — você pode alterar os três valores. Eles não serão recalculados automaticamente."; }
      const bf = document.getElementById("a_bf"); if(bf) bf.focus();
    } else {
      recalcularComposicao();
    }
  }

  /* Relação Cintura-Quadril (cintura ÷ quadril) com risco por sexo */
  let AVAL_SEXO = "";   // sexo do aluno sendo visualizado no histórico
  function classificaRcq(r, sexo){
    if(sexo === "M"){ const alto = r >= 0.90; return { tag: alto?"alto risco":"baixo risco", cls: alto?"alto":"baixo" }; }
    if(sexo === "F"){ const alto = r >= 0.85; return { tag: alto?"alto risco":"baixo risco", cls: alto?"alto":"baixo" }; }
    return { tag: "", cls: "neutro" };
  }
  function rcqHintHtml(){
    return `<span class="rcq-hint" tabindex="0">?<span class="rcq-hint-pop">
      <b class="rhp-tit">Relação Cintura-Quadril</b>
      Divide a medida da <b>cintura</b> pela do <b>quadril</b> e estima o risco cardiovascular pela distribuição de gordura corporal.
      <span class="rhp-linha"><span class="rhp-dot baixo"></span> Homens &lt; 0,90 · Mulheres &lt; 0,85 → <b>baixo risco</b></span>
      <span class="rhp-linha"><span class="rhp-dot alto"></span> Homens ≥ 0,90 · Mulheres ≥ 0,85 → <b>alto risco</b></span>
    </span></span>`;
  }
  function recalcularRcq(){
    const el = document.getElementById("rcqVal");
    if(!el) return;
    const c = Number((document.getElementById("per_cintura")||{}).value) || null;
    const q = Number((document.getElementById("per_quadril")||{}).value) || null;
    if(!c || !q){ el.innerHTML = `<span class="rcq-num">—</span>`; return; }
    const r = c / q;
    const sexo = (ASSESS_S && ASSESS_S.sex) || "";
    const cl = classificaRcq(r, sexo);
    const tag = cl.tag || "informe o sexo do cliente";
    el.innerHTML = `<span class="rcq-num">${r.toFixed(2)}</span><span class="rcq-tag ${cl.cls}">${tag}</span>${cl.tag?rcqHintHtml():""}`;
  }
  // RCQ para o histórico (a partir das circunferências salvas)
  function rcqDetalhe(circ){
    if(!circ) return "";
    const c = Number(circ.cintura), q = Number(circ.quadril);
    if(!c || !q) return "";
    const r = c / q;
    const cl = classificaRcq(r, AVAL_SEXO);
    return `<div class="rcq-line">
      <span class="rcq-line-tit">Relação Cintura-Quadril</span>
      <span class="rcq-line-res">
        <span class="rcq-num">${r.toFixed(2)}</span>
        ${cl.tag?`<span class="rcq-tag ${cl.cls}">${cl.tag}</span>${rcqHintHtml()}`:`<span class="meta-sm">sexo não informado</span>`}
      </span>
    </div>`;
  }
  function toggleRcqHelp(ev){ ev.stopPropagation(); const i=document.getElementById("rcqInfo"); if(i) i.classList.toggle("show"); }
  document.addEventListener("click", ()=>{ const i=document.getElementById("rcqInfo"); if(i) i.classList.remove("show"); });

  function recalcularComposicao(){
    recalcularRcq();
    if(MANUAL_CALC) return;   // não sobrescreve durante edição manual
    const msg = document.getElementById("calcMsg");
    const bf = document.getElementById("a_bf"), fat = document.getElementById("a_fat"), lean = document.getElementById("a_lean");
    if(!bf) return;
    const s = ASSESS_S || {};
    const sexo  = s.sex || "";
    const idade = idadeAnos(s.birth_date);
    const peso  = Number((document.getElementById("a_weight")||{}).value) || null;
    const sigma = somaSeteDobras();

    const r = calcComposicao(sexo, idade, sigma, peso);
    if(r){
      bf.value  = r.pctFat.toFixed(1);
      fat.value = r.massaGorda.toFixed(1);
      lean.value= r.massaMagra.toFixed(1);
      if(msg){ msg.className="msg ok"; msg.textContent = `Calculado · Σ7 = ${sigma.toFixed(1)} mm · idade ${idade} anos · ${sexo==="M"?"masculino":"feminino"}`; }
    } else {
      bf.value=""; fat.value=""; lean.value="";
      if(msg){
        const faltam = [];
        if(!sexo || idade == null) faltam.push("sexo e data de nascimento do cliente (edite em ⋮ → Dados do cliente)");
        if(!peso)          faltam.push("peso");
        if(sigma == null)  faltam.push("as 7 dobras");
        msg.className = faltam.length ? "msg warn" : "msg";
        msg.textContent = faltam.length ? "Faltam: " + faltam.join("; ") + "." : "";
      }
    }
  }

  function prepararCalculo(s){
    ASSESS_S = s || null;
    MANUAL_CALC = false;
    ["a_bf","a_fat","a_lean"].forEach(id=>{ const e=document.getElementById(id); if(e) e.setAttribute("readonly",""); });
    const info = document.getElementById("assessCliente");
    if(info){
      const idade = idadeAnos(s && s.birth_date);
      const partes = [];
      if(s && s.sex) partes.push(s.sex==="M" ? "Masculino" : "Feminino");
      if(idade != null) partes.push(idade + " anos");
      info.innerHTML = partes.length
        ? `<span class="tag" style="background:#1d2027;color:#1d4ed8;border-color:#c7dbff">${partes.join(" · ")}</span>`
        : `<span class="tag">defina sexo e nascimento em ⋮ → Dados do cliente</span>`;
    }
    const card = document.getElementById("assessCard");
    if(card && !card.dataset.calcOn){
      card.dataset.calcOn = "1";
      card.addEventListener("input", recalcularComposicao);
      card.addEventListener("change", recalcularComposicao);
    }
    recalcularComposicao();
  }

  function fmtDiaMes(v){ const p=String(v).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v; }

  function renderFichaHeader(){
    const h = document.getElementById("fichaHeader");
    if(!h) return;
    const passadas = FICHAS_TODAS.filter(f=>!f.ativa);
    const selPassadas = passadas.length
      ? `<select onchange="if(this.value)abrirPassada(this.value)">
           <option value="">Treinos passados (${passadas.length})…</option>
           ${passadas.map(f=>`<option value="${f.id}">${fmtDiaMes(f.created_at)}</option>`).join("")}
         </select>`
      : `<span class="meta-sm">Sem treinos passados ainda.</span>`;
    const st = STUDENTS.find(x=>x.id===FICHA.student_id);
    const modal = (st && st.modalidade) || "online";
    const presencaBlock = (!FICHA_READONLY && ["presencial","misto"].includes(modal) && FICHA_DIAS.length)
      ? `<div class="presenca-box">
           <div class="presenca-tit">Registrar presença de hoje${modal==="misto"?' <span class="meta-sm">(treinos presenciais)</span>':''}</div>
           <div class="presenca-btns">
             ${FICHA_DIAS.map(d=>`<button class="btn ghost small" onclick="marcarPresenca('${d.id}')">${esc(d.label)}</button>`).join("")}
           </div>
         </div>`
      : "";
    if(FICHA_READONLY){
      h.innerHTML = `
        <div><span class="tag">treino de ${fmtDiaMes(FICHA.created_at)} · somente leitura</span></div>
        <button class="btn small" onclick="voltarAtual()">← Voltar ao treino atual</button>`;
    } else {
      h.innerHTML = `
        <div><b>Treino atual</b> <span class="meta-sm">criado em ${fmtDiaMes(FICHA.created_at)}</span></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          ${selPassadas}
          <button class="btn small" onclick="novoTreino()">＋ Novo treino</button>
        </div>
        ${presencaBlock}`;
    }
  }

  async function marcarPresenca(diaId){
    const dia = FICHA_DIAS.find(d=>d.id===diaId); if(!dia) return;
    if(!confirm(`Marcar "${dia.label}" como treinado hoje?`)) return;
    const { error } = await sb.from("sessoes").insert({
      student_id: FICHA.student_id, professional_id: ME.id,
      dia_id: diaId, ficha_id: FICHA.id, finalizada: true, data: new Date().toISOString()
    });
    if(error){ alert("Erro ao registrar: "+error.message); return; }
    alert(`Presença de "${dia.label}" registrada para hoje! ✅`);
  }

  function novoTreino(){
    if(document.getElementById("novoTreinoModal")) return;
    const ov = document.createElement("div");
    ov.id = "novoTreinoModal"; ov.className = "modal-ov";
    ov.onclick = (e)=>{ if(e.target===ov) fecharNovoTreino(); };
    ov.innerHTML = `
      <div class="modal-cx">
        <h3 style="margin:0 0 6px">Novo treino</h3>
        <p class="meta-sm" style="margin:0 0 16px">O treino atual vira histórico (treinos passados) e o novo fica ativo. Como quer começar?</p>
        <button class="btn" style="width:100%;margin-bottom:8px" onclick="criarNovoTreino(true)">Duplicar o treino atual</button>
        <p class="meta-sm" style="margin:-2px 0 12px">Copia todos os dias e exercícios — você ajusta só o que mudar, mantendo o histórico do treino anterior.</p>
        <button class="btn ghost" style="width:100%;margin-bottom:8px" onclick="criarNovoTreino(false)">Começar em branco</button>
        <button class="btn ghost" style="width:100%" onclick="fecharNovoTreino()">Cancelar</button>
      </div>`;
    document.body.appendChild(ov);
  }
  function fecharNovoTreino(){ const m=document.getElementById("novoTreinoModal"); if(m) m.remove(); }

  async function criarNovoTreino(duplicar){
    fecharNovoTreino();
    const studentId = FICHA.student_id;
    const origem = FICHA;
    await sb.from("fichas").update({ ativa:false }).eq("id", origem.id);
    const { data: nova, error } = await sb.from("fichas")
      .insert({ student_id:studentId, professional_id:ME.id, nome:"Treino", ativa:true }).select().single();
    if(error){ alert("Erro: "+error.message); return; }
    if(duplicar){
      const { data: dias } = await sb.from("ficha_dias").select("*").eq("ficha_id", origem.id).order("ordem");
      for(const d of (dias||[])){
        const { id:_di, created_at:_dc, ...restDia } = d;
        const { data: novoDia, error: eDia } = await sb.from("ficha_dias")
          .insert({ ...restDia, ficha_id: nova.id }).select().single();
        if(eDia || !novoDia) continue;
        const { data: exs } = await sb.from("ficha_exercicios").select("*").eq("dia_id", d.id).order("ordem");
        if(exs && exs.length){
          const linhas = exs.map(x=>{ const { id:_xi, created_at:_xc, ...restEx } = x; return { ...restEx, ficha_id: nova.id, dia_id: novoDia.id }; });
          await sb.from("ficha_exercicios").insert(linhas);
        }
      }
    }
    FICHAS_TODAS.forEach(f=>f.ativa=false);
    FICHAS_TODAS.unshift(nova);
    FICHA = nova; FICHA_READONLY = false;
    await abrirFichaDias();
  }

  async function abrirPassada(fichaId){
    const f = FICHAS_TODAS.find(x=>x.id===fichaId);
    if(!f) return;
    FICHA = f; FICHA_READONLY = true;
    await abrirFichaDias();
  }

  async function voltarAtual(){
    const ativa = FICHAS_TODAS.find(f=>f.ativa);
    if(!ativa){ await carregarFicha(FICHA.student_id); return; }
    FICHA = ativa; FICHA_READONLY = false;
    await abrirFichaDias();
  }

  function renderDias(){
    const box = document.getElementById("fichaDias");
    if(!box) return;
    box.innerHTML = FICHA_DIAS.map(d=>
      `<button class="chip-f ${d.id===FICHA_DIA?"sel":""}" onclick="selDia('${d.id}')">${esc(d.label)}</button>`
    ).join("") + (FICHA_READONLY ? "" : `<button class="chip-f" style="border-style:dashed" onclick="addDia()">＋ Dia</button>`);
    renderConteudoDia();
  }

  function selDia(id){ FICHA_DIA = id; renderDias(); }

  async function addDia(){
    const letras = "ABCDEFGH";
    const label = "Treino " + (letras[FICHA_DIAS.length] || (FICHA_DIAS.length+1));
    const { data, error } = await sb.from("ficha_dias").insert({
      ficha_id:FICHA.id, student_id:FICHA.student_id, professional_id:ME.id, label, ordem:FICHA_DIAS.length
    }).select().single();
    if(error){ alert("Erro: "+error.message); return; }
    FICHA_DIAS.push(data); FICHA_DIA = data.id;
    renderDias();
  }

  async function removerDia(){
    if(!FICHA_DIA) return;
    const d = FICHA_DIAS.find(x=>x.id===FICHA_DIA);
    if(!confirm(`Remover ${d?d.label:"este dia"} e seus exercícios?`)) return;
    await sb.from("ficha_dias").delete().eq("id", FICHA_DIA);
    FICHA_DIAS = FICHA_DIAS.filter(x=>x.id!==FICHA_DIA);
    FICHA_DIA = FICHA_DIAS.length ? FICHA_DIAS[0].id : null;
    renderDias();
  }

  async function renderConteudoDia(){
    const box = document.getElementById("fichaConteudo");
    if(!box) return;
    if(!FICHA_DIA){
      box.innerHTML = `<div class="empty">Crie um dia de treino (A, B, C…) para começar a adicionar exercícios.</div>`;
      return;
    }
    box.innerHTML = `<div class="empty">Carregando…</div>`;
    const { data: exs } = await sb.from("ficha_exercicios").select("*").eq("dia_id", FICHA_DIA).order("ordem");
    const lista = exs || [];

    // modo leitura (treino passado): só mostra, sem editar
    if(FICHA_READONLY){
      box.innerHTML = lista.length ? lista.map(x=>{
        const partes=[];
        if(x.series!=null && x.reps) partes.push(`<b>${x.series}x${esc(x.reps)}</b>`);
        else if(x.series!=null) partes.push(`<b>${x.series} séries</b>`);
        if(x.carga_alvo!=null) partes.push(`${x.carga_alvo} kg`);
        if(x.descanso_seg!=null) partes.push(`descanso ${x.descanso_seg}s`);
        return `<div class="tr-ex"><div class="tr-nome">${esc(x.nome_cache||"Exercício")}</div><div class="tr-presc">${partes.join(" · ")}</div></div>`;
      }).join("") : `<div class="empty">Sem exercícios neste dia.</div>`;
      return;
    }

    const rows = lista.map(x=>`
      <div class="fx-row">
        <div class="fx-topo">
          <div class="fx-nome">${esc(x.nome_cache || "Exercício")}</div>
          <button class="btn small ghost" title="Remover" onclick="removerEx('${x.id}')">🗑</button>
        </div>
        <div class="fx-campos">
          <label>Séries<input type="number" value="${x.series??""}" onchange="updEx('${x.id}','series',this.value)"></label>
          <label>Reps<input type="text" value="${esc(x.reps??"")}" onchange="updEx('${x.id}','reps',this.value)"></label>
          <label>Carga<input type="number" step="0.5" value="${x.carga_alvo??""}" onchange="updEx('${x.id}','carga_alvo',this.value)"></label>
          <label>Desc(s)<input type="number" value="${x.descanso_seg??""}" onchange="updEx('${x.id}','descanso_seg',this.value)"></label>
        </div>
        <input class="fx-obs" type="text" placeholder="Observação para o aluno (ex.: fazer devagar, aumentar a carga na última série)"
               value="${esc(x.obs??"")}" onchange="updEx('${x.id}','obs',this.value)">
      </div>`).join("");

    // não repetir na busca os exercícios já adicionados neste dia
    const jaTem = new Set(lista.map(x=>x.exercicio_id).filter(Boolean));
    const disponiveis = EXERCICIOS.filter(e=>!jaTem.has(e.id));
    const opcoes = disponiveis.map(e=>`<option value="${e.id}">${esc(e.nome)}${e.grupo?" · "+esc(e.grupo):""}</option>`).join("");
    box.innerHTML = `
      ${lista.length ? rows : `<div class="empty">Nenhum exercício neste dia ainda.</div>`}
      <div class="fx-add">
        <select id="fxAdd"><option value="">${disponiveis.length?"+ escolher exercício…":"todos os exercícios já foram adicionados"}</option>${opcoes}</select>
        <button class="btn small" onclick="addEx()">Adicionar</button>
        <button class="btn small ghost" onclick="removerDia()" style="margin-left:auto">Remover dia</button>
      </div>`;
  }

  async function addEx(){
    const sel = document.getElementById("fxAdd");
    const exId = sel.value;
    if(!exId){ return; }
    const ex = EXERCICIOS.find(e=>e.id===exId);
    const { data: exs } = await sb.from("ficha_exercicios").select("id").eq("dia_id", FICHA_DIA);
    const { error } = await sb.from("ficha_exercicios").insert({
      dia_id:FICHA_DIA, ficha_id:FICHA.id, student_id:FICHA.student_id, professional_id:ME.id,
      exercicio_id:exId, nome_cache: ex?ex.nome:null,
      series:3, reps:"12", descanso_seg:60, ordem:(exs?exs.length:0)
    });
    if(error){ alert("Erro: "+error.message); return; }
    renderConteudoDia();
  }

  async function updEx(id, campo, valor){
    const textFields = ["reps","obs"];
    const v = textFields.includes(campo) ? (valor.trim()||null) : (valor===""?null:Number(valor));
    await sb.from("ficha_exercicios").update({ [campo]: v }).eq("id", id);
  }

  async function removerEx(id){
    await sb.from("ficha_exercicios").delete().eq("id", id);
    renderConteudoDia();
  }

  /* ---------- PROFISSIONAL: METAS ---------- */
  async function abrirMetas(id){
    if(!alternarJanela("goalsCard")) return;
    const s = STUDENTS.find(x=>x.id===id);
    document.getElementById("goalsStudentId").value = id;
    document.getElementById("goalsStudentName").textContent = nomeAluno(s);
    const msg = document.getElementById("goalsMsg"); msg.className="msg"; msg.textContent="";
    ["g_peso","g_bf","g_data","g_treinos"].forEach(f=>{const e=document.getElementById(f); if(e) e.value="";});
    document.getElementById("goalsId").value = "";

    const { data, error } = await sb.from("goals").select("*").eq("student_id", id).limit(1);
    if(!error && data && data.length){
      const g = data[0];
      document.getElementById("goalsId").value = g.id;
      if(g.ideal_weight   != null) document.getElementById("g_peso").value = g.ideal_weight;
      if(g.target_bodyfat != null) document.getElementById("g_bf").value   = g.target_bodyfat;
      if(g.target_date)            document.getElementById("g_data").value = String(g.target_date).slice(0,10);
      if(g.monthly_workouts != null) document.getElementById("g_treinos").value = g.monthly_workouts;
    }
    const card = document.getElementById("goalsCard");
    card.style.display = "block"; registrarJanela("goalsCard");
    card.scrollIntoView({behavior:"smooth",block:"center"});
  }
  function fecharMetas(){ fecharJanela("goalsCard"); }

  async function salvarMetas(){
    const msg=document.getElementById("goalsMsg"), btn=document.getElementById("goalsSaveBtn");
    const student_id=document.getElementById("goalsStudentId").value;
    const gid=document.getElementById("goalsId").value;
    const num = id => { const e=document.getElementById(id); return (!e || e.value==="") ? null : Number(e.value); };
    const data = document.getElementById("g_data").value || null;
    const campos = {
      ideal_weight:     num("g_peso"),
      target_bodyfat:   num("g_bf"),
      target_date:      data,
      monthly_workouts: num("g_treinos"),
      updated_at:       new Date().toISOString()
    };
    if(campos.ideal_weight==null && campos.target_bodyfat==null && !data && campos.monthly_workouts==null){
      msg.className="msg err"; msg.textContent="Preencha ao menos uma meta."; return;
    }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    let error;
    if(gid){ ({ error } = await sb.from("goals").update(campos).eq("id", gid)); }
    else   {
      const { data:ins, error:e2 } = await sb.from("goals").insert({ student_id, ...campos }).select("id").single();
      error = e2; if(ins) document.getElementById("goalsId").value = ins.id;
    }
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro ao salvar: "+error.message; return; }
    msg.className="msg ok"; msg.textContent="Metas salvas! Já aparecem no painel do aluno.";
  }

  /* ---------- PROFISSIONAL: CONSULTAS ---------- */
  function novaConsulta(id){
    if(!alternarJanela("consultCard")) return;
    const s = STUDENTS.find(x=>x.id===id);
    document.getElementById("consultStudentId").value = id;
    document.getElementById("consultStudentName").textContent = nomeAluno(s);
    document.getElementById("c_date").value = "";
    document.getElementById("c_time").value = "09:00";
    document.getElementById("c_notes").value = "";
    const card = document.getElementById("consultCard");
    card.style.display = "block"; registrarJanela("consultCard");
    const m = document.getElementById("consultMsg"); m.className="msg"; m.textContent="";
    listarConsultas(id);
    card.scrollIntoView({behavior:"smooth",block:"center"});
  }
  function fecharConsulta(){ fecharJanela("consultCard"); }

  async function listarConsultas(id){
    const box = document.getElementById("consultList");
    const { data, error } = await sb.from("consultations").select("*")
      .eq("student_id", id).order("scheduled_at",{ascending:false});
    if(!box) return;
    if(error){ box.innerHTML = `<div class="empty">Erro: ${esc(error.message)}</div>`; return; }
    if(!data || !data.length){ box.innerHTML = `<div class="empty">Nenhuma consulta agendada para este aluno.</div>`; return; }
    const agora = new Date();
    box.innerHTML = data.map(c=>{
      const futura = new Date(c.scheduled_at) >= agora;
      const et = futura
        ? `<span class="tag" style="background:#1d2027;color:#1d4ed8;border-color:#c7dbff">agendada</span>`
        : `<span class="tag">realizada</span>`;
      return `<div class="student-row">
        <div><div class="name">${fmtDataHora(c.scheduled_at)} ${et}</div>
             ${c.notes?`<div class="meta">${esc(c.notes)}</div>`:""}</div>
        <div class="row-actions"><button class="btn small ghost" onclick="excluirConsulta('${c.id}','${id}')">Remover</button></div>
      </div>`;
    }).join("");
  }

  async function salvarConsulta(){
    const msg=document.getElementById("consultMsg"), btn=document.getElementById("consultSaveBtn");
    const student_id=document.getElementById("consultStudentId").value;
    const d=document.getElementById("c_date").value, h=document.getElementById("c_time").value || "09:00";
    if(!student_id || !d){ msg.className="msg err"; msg.textContent="Escolha a data da consulta."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    const { error } = await sb.from("consultations").insert({
      student_id, scheduled_at: new Date(`${d}T${h}`).toISOString(),
      notes: document.getElementById("c_notes").value.trim() || null,
      created_by: ME.id
    });
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro ao agendar: "+error.message; return; }
    msg.className="msg ok"; msg.textContent="Consulta agendada!";
    document.getElementById("c_notes").value="";
    listarConsultas(student_id);
  }

  async function excluirConsulta(id, studentId){
    if(!confirm("Remover esta consulta?")) return;
    const { error } = await sb.from("consultations").delete().eq("id", id);
    if(error){ alert("Erro ao remover: "+error.message); return; }
    listarConsultas(studentId);
  }

  async function salvarAvaliacao(){
    const msg=document.getElementById("assessMsg"), btn=document.getElementById("assessSaveBtn");
    const student_id=document.getElementById("assessStudentId").value;
    const date=document.getElementById("a_date").value;
    if(!student_id || !date){ msg.className="msg err"; msg.textContent="Escolha aluno e data."; return; }
    const val = id => { const e=document.getElementById(id); return (!e || e.value==="") ? null : Number(e.value); };
    const juntar = (pref, lista) => {
      const o = {};
      lista.forEach(([k])=>{ const v = val(pref+k); if(v!=null) o[k]=v; });
      return Object.keys(o).length ? o : null;
    };
    const row = { student_id, date,
      weight:   val("a_weight"),
      height:   val("a_height"),
      body_fat: val("a_bf"),
      lean_mass:val("a_lean"),
      fat_mass: val("a_fat"),
      skinfolds:      juntar("dob_", DOBRAS),
      circumferences: juntar("per_", PERIMETROS),
      notes:    document.getElementById("a_notes").value.trim() || null,
      created_by: ME.id };
    btn.disabled=true; msg.className="msg"; msg.textContent="";

    let error;
    if(EDIT_ID){
      const { created_by, ...campos } = row;
      ({ error } = await sb.from("assessments").update(campos).eq("id", EDIT_ID));
    } else {
      ({ error } = await sb.from("assessments").insert(row));
    }
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro ao salvar: "+error.message; return; }
    msg.className="msg ok"; msg.textContent = EDIT_ID ? "Alterações salvas!" : "Avaliação salva!";
    const alvo = student_id;
    EDIT_ID = null;
    await loadStudents();
    const lista = document.getElementById("assessList_"+alvo);
    if(lista && lista.innerHTML){ lista.innerHTML=""; verAvaliacoes(alvo); }
    setTimeout(fecharForm, 800);
  }

  init();
</script>
</body>
</html>
