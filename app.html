  function recalcularComposicao(){
    recalcularRcq();
    if(MANUAL_CALC) return;   // não sobrescreve durante edição manual
    const msg = document.getElementById("calcMsg");
    const bf = document.getElementById("a_bf"), fat = document.getElementById("a_fat"), lean = document.getElementById("a_lean");
    if(!bf) return;
    const s = ASSESS_S || {};
    const sexo  = s.sex || "";
    const idade = idadeAnos(s.birth_date);
    const peso  = toNum((document.getElementById("a_weight")||{}).value) || null;
    const sigma = somaSeteDobras();

    const r = calcComposicao(sexo, idade, sigma, peso);
    if(r){
      bf.value  = r.pctFat.toFixed(1);
      fat.value = r.massaGorda.toFixed(1);
      lean.value= r.massaMagra.toFixed(1);
      if(msg){ msg.className="msg ok"; msg.textContent = `Calculado · Σ7 = ${sigma.toFixed(1)} mm · idade ${idade} anos · ${sexo==="M"?"masculino":"feminino"}`; }
    } else {
      bf.value=""; fat.value=""; lean.value="";
      if(msg){
        const faltam = [];
        if(!sexo || idade == null) faltam.push("sexo e data de nascimento do cliente (edite em ⋮ → Dados do cliente)");
        if(!peso)          faltam.push("peso");
        if(sigma == null)  faltam.push("as 7 dobras");
        msg.className = faltam.length ? "msg warn" : "msg";
        msg.textContent = faltam.length ? "Faltam: " + faltam.join("; ") + "." : "";
      }
    }
  }

  function prepararCalculo(s){
    ASSESS_S = s || null;
    MANUAL_CALC = false;
    ["a_bf","a_fat","a_lean"].forEach(id=>{ const e=document.getElementById(id); if(e) e.setAttribute("readonly",""); });
    const info = document.getElementById("assessCliente");
    if(info){
      const idade = idadeAnos(s && s.birth_date);
      const partes = [];
      if(s && s.sex) partes.push(s.sex==="M" ? "Masculino" : "Feminino");
      if(idade != null) partes.push(idade + " anos");
      info.innerHTML = partes.length
        ? `<span class="tag" style="background:var(--pk-surf2,#1d2027);color:#1d4ed8;border-color:#c7dbff">${partes.join(" · ")}</span>`
        : `<span class="tag">defina sexo e nascimento em ⋮ → Dados do cliente</span>`;
    }
    const card = document.getElementById("assessCard");
    if(card && !card.dataset.calcOn){
      card.dataset.calcOn = "1";
      card.addEventListener("input", recalcularComposicao);
      card.addEventListener("change", recalcularComposicao);
    }
    recalcularComposicao();
  }

  // ===== Fotos da avaliação física (bucket privado avaliacoes-fotos) =====
  let AVAL_FOTOS = [];       // itens {path} já salvos ou {file,url} novos
  let AVAL_FOTOS_ORIG = [];  // paths que já existiam (pra apagar os removidos ao salvar)
  async function fotoAvalSignedUrl(path){
    try{ const { data } = await sb.storage.from("avaliacoes-fotos").createSignedUrl(path, 3600); return data ? data.signedUrl : null; }
    catch(e){ return null; }
  }
  function avalFotosSelecionadas(input){
    const files = Array.from(input.files||[]);
    files.forEach(f=>{
      if(!f || !f.type || f.type.indexOf("image/")!==0) return;
      if(f.size > 10*1024*1024){ piikAlert('A foto "'+f.name+'" passa de 10MB. Escolha uma menor.'); return; }
      AVAL_FOTOS.push({ file:f, url:URL.createObjectURL(f) });
    });
    input.value = "";
    renderAvalFotosPrev();
  }
  function removerAvalFoto(i){
    const it = AVAL_FOTOS[i];
    if(it && it.file && it.url){ try{ URL.revokeObjectURL(it.url); }catch(e){} }
    AVAL_FOTOS.splice(i,1);
    renderAvalFotosPrev();
  }
  async function renderAvalFotosPrev(){
    const box = document.getElementById("a_fotos_prev"); if(!box) return;
    box.innerHTML = AVAL_FOTOS.map((it,i)=>`<div class="aval-foto"><img id="afp_${i}" alt="foto"><button type="button" class="rm" title="Remover" onclick="removerAvalFoto(${i})">✕</button></div>`).join("");
    for(let i=0;i<AVAL_FOTOS.length;i++){
      const it = AVAL_FOTOS[i], img = document.getElementById("afp_"+i); if(!img) continue;
      if(it.url){ img.src = it.url; }
      else if(it.path){ const u = await fotoAvalSignedUrl(it.path); if(u) img.src = u; }
    }
  }
  async function uploadFotoAval(file, studentId){
    const ext = (file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
    const path = ME.id + "/" + studentId + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + "." + ext;
    const { error } = await sb.storage.from("avaliacoes-fotos").upload(path, file, { cacheControl:"3600", upsert:false, contentType:file.type||undefined });
    if(error) throw new Error(error.message || "Falha no upload da foto.");
    return path;
  }
  async function hidratarFotosAval(container){
    if(!container) return;
    const els = container.querySelectorAll("[data-foto-path]");
    for(const a of els){
      const p = a.getAttribute("data-foto-path");
      const u = await fotoAvalSignedUrl(p);
      if(u){ a.href = u; const img = a.querySelector("img"); if(img) img.src = u; }
      else { a.style.display = "none"; }  // sem acesso/erro: esconde a caixa vazia
    }
  }

  // ---- Prazo (duração recomendada) do treino ----
  function opcoesMeses(sel){
    let o = "";
    for(let m=1;m<=12;m++) o += `<option value="${m}" ${Number(sel)===m?"selected":""}>${m} ${m===1?"mês":"meses"}</option>`;
    return o;
  }
  function vencimentoDe(f){
    if(!f || !f.created_at || !f.duracao_meses) return null;
    const d = new Date(f.created_at);
    d.setMonth(d.getMonth() + Number(f.duracao_meses));
    return d;
  }
  function diasParaVencer(f){
    const v = vencimentoDe(f); if(!v) return null;
    return Math.ceil((v.getTime() - Date.now())/86400000);
  }
  function textoVencimento(f){
    const v = vencimentoDe(f);
    if(!v) return `<span class="meta-sm" style="opacity:.7">sem prazo definido</span>`;
    const dias = diasParaVencer(f);
    const data = v.toLocaleDateString("pt-BR");
    let cor = "var(--muted)", extra = `em ${dias} dias`;
    if(dias < 0){ cor = "#ff6b6b"; extra = `venceu há ${Math.abs(dias)} dias`; }
    else if(dias <= 7){ cor = "#ffb020"; extra = `vence em ${dias} dia${dias===1?"":"s"}`; }
    else if(dias === 0){ cor = "#ffb020"; extra = "vence hoje"; }
    return `<span class="meta-sm">vence em <b>${data}</b> · <b style="color:${cor}">${extra}</b></span>`;
  }
  async function salvarPrazoFicha(v){
    if(contaCongelada()){ avisoCongelada(); return; }
    if(!FICHA) return;
    const meses = parseInt(v,10) || null;
    const { error } = await sb.from("fichas").update({ duracao_meses:meses }).eq("id", FICHA.id);
    if(error){ piikAlert("Erro ao salvar o prazo: "+error.message); return; }
    FICHA.duracao_meses = meses;
    const f = FICHAS_TODAS.find(x=>x.id===FICHA.id); if(f) f.duracao_meses = meses;
    const el = document.getElementById("fichaVence"); if(el) el.innerHTML = textoVencimento(FICHA);
  }

  async function carregarFicha(studentId){
    const demo = alunoEhDemo(studentId);
    const { data: todas } = await sb.from("fichas").select("*")
      .eq("student_id", studentId).order("created_at", { ascending:false });
    FICHAS_TODAS = todas || [];
    let ativa = FICHAS_TODAS.find(f=>f.ativa) || FICHAS_TODAS[0];
    if(!ativa && !demo){
      const { data: nova } = await sb.from("fichas")
        .insert({ student_id:studentId, professional_id:ME.id, nome:"Treino", ativa:true }).select().single();
      ativa = nova; FICHAS_TODAS.unshift(nova);
    }
    if(!ativa){
      FICHA = null;
      document.getElementById("fichaDias").innerHTML = "";
      document.getElementById("fichaConteudo").innerHTML = `<div class="empty">Este aluno demo ainda não tem treino montado.</div>`;
      return;
    }
    FICHA = ativa; FICHA_READONLY = demo; MONTAGEM_LIBERADA = false; MODO_EDICAO = false;
    await abrirFichaDias();
  }

  async function abrirFichaDias(){

  function fmtDiaMes(v){ const p=String(v).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v; }

  function renderFichaHeader(){
    const h = document.getElementById("fichaHeader");
    if(!h) return;
    const passadas = FICHAS_TODAS.filter(f=>!f.ativa);
    const selPassadas = passadas.length
      ? `<select onchange="if(this.value)abrirPassada(this.value)">
           <option value="">Treinos passados (${passadas.length})…</option>
           ${passadas.map(f=>`<option value="${f.id}">${fmtDiaMes(f.created_at)}</option>`).join("")}
         </select>`
      : `<span class="meta-sm">Sem treinos passados ainda.</span>`;
    const st = STUDENTS.find(x=>x.id===FICHA.student_id);

      ? `<div class="presenca-box">

             ${FICHA_DIAS.map(d=>`<button class="btn ghost small" onclick="marcarPresenca('${d.id}')">${esc(d.label)}</button>`).join("")}
           </div>
         </div>`
      : "";

      h.innerHTML = `

  async function criarNovoTreino(duplicar){
    if(contaCongelada()){ avisoCongelada(); return; }
    const meses = parseInt((document.getElementById("ntMeses")||{}).value || "", 10) || null;
    fecharNovoTreino();
    const studentId = FICHA.student_id;
    const origem = FICHA;
    await sb.from("fichas").update({ ativa:false }).eq("id", origem.id);
    const { data: nova, error } = await sb.from("fichas")
      .insert({ student_id:studentId, professional_id:ME.id, nome:"Treino", ativa:true, duracao_meses:meses }).select().single();
    if(error){ piikAlert("Erro: "+error.message); return; }
    if(duplicar){
      const { data: dias } = await sb.from("ficha_dias").select("*").eq("ficha_id", origem.id).order("ordem");
      for(const d of (dias||[])){
        const { id:_di, created_at:_dc, ...restDia } = d;
        const { data: novoDia, error: eDia } = await sb.from("ficha_dias")
          .insert({ ...restDia, ficha_id: nova.id }).select().single();
        if(eDia || !novoDia) continue;
        const { data: exs } = await sb.from("ficha_exercicios").select("*").eq("dia_id", d.id).order("ordem");
        if(exs && exs.length){
          const linhas = exs.map(x=>{ const { id:_xi, created_at:_xc, ...restEx } = x; return { ...restEx, ficha_id: nova.id, dia_id: novoDia.id }; });
          await sb.from("ficha_exercicios").insert(linhas);
        }
      }
    }
    FICHAS_TODAS.forEach(f=>f.ativa=false);
    FICHAS_TODAS.unshift(nova);
    FICHA = nova; FICHA_READONLY = false;
    await abrirFichaDias();
  }

  function renderDias(){

      box.innerHTML = "";
      if(cont) cont.innerHTML = "";
      return;

    box.innerHTML = FICHA_DIAS.map(d=>
      `<button class="chip-f ${d.id===FICHA_DIA?"sel":""}" onclick="selDia('${d.id}')">${esc(d.label)}</button>`

          vN++;

  // reordenar exercícios: reindexa a lista inteira (robusto a ordem duplicada/nula)
  async function moverEx(id, dir){
    const { data: exs } = await sb.from("ficha_exercicios")
      .select("id,ordem").eq("dia_id", FICHA_DIA)
      .order("ordem", { ascending: true, nullsFirst: false }).order("id", { ascending: true });
    const arr = exs || [];
    const i = arr.findIndex(e=>e.id===id); const j = i + dir;
    if(i<0 || j<0 || j>=arr.length) return;
    const vizinhoId = arr[j].id;
    // FLIP — 1) mede a posição atual dos dois cards antes de re-renderizar
    const antes = {};
    [id, vizinhoId].forEach(exid=>{ const el=document.querySelector('[data-exid="'+exid+'"]'); if(el) antes[exid]=el.getBoundingClientRect().top; });
    // troca as posições no array e regrava a ordem como 0,1,2,3… para todos
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    const y = window.scrollY;
    const updates = arr
      .map((e, idx)=> (e.ordem !== idx) ? sb.from("ficha_exercicios").update({ ordem: idx }).eq("id", e.id) : null)
      .filter(Boolean);
    await Promise.all(updates);
    await renderConteudoDia();
    window.scrollTo(0, y);
    // FLIP — 2) coloca cada card na posição antiga e 3) anima até a nova (o movido passa por cima)
    requestAnimationFrame(()=>{
      [id, vizinhoId].forEach(exid=>{
        const el = document.querySelector('[data-exid="'+exid+'"]');
        if(!el || antes[exid]==null) return;
        const delta = antes[exid] - el.getBoundingClientRect().top;
        if(!delta) return;
        el.style.transition = "none";
        el.style.position = "relative";
        el.style.zIndex = (exid===id) ? "6" : "1";
        if(exid===id) el.classList.add("fx-lift");
        el.style.transform = "translateY(" + delta + "px)";
        void el.offsetWidth;                       // aplica a posição antiga imediatamente
        el.style.transition = "transform .2s ease";
        el.style.transform = "translateY(0)";
        setTimeout(()=>{ el.style.transition=""; el.style.transform=""; el.style.zIndex=""; el.style.position=""; el.classList.remove("fx-lift"); }, 230);
      });
    });
  }

    const y = window.scrollY;

  async function uploadMidiaEx(file){
    if(!file) return null;
    if(file.size > 50*1024*1024) throw new Error("O vídeo passa de 50MB. Escolha um arquivo menor ou use um link.");
    const ext = (file.name.split(".").pop()||"mp4").toLowerCase().replace(/[^a-z0-9]/g,"") || "mp4";
    const path = ME.id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + "." + ext;
    const { error } = await sb.storage.from("exercicios-media").upload(path, file, { cacheControl:"3600", upsert:false, contentType:file.type||undefined });
    if(error) throw new Error(error.message || "Falha no upload do vídeo.");
    const { data } = sb.storage.from("exercicios-media").getPublicUrl(path);
    return data.publicUrl;
  }

  // Replicar SÉRIES e DESCANSO do 1º exercício para todos os outros do dia.
  // (bi-sets mantêm descanso 0 entre eles, pra não quebrar o encadeamento)
  async function replicarSeriesDescanso(){
    if(!FICHA_DIA) return;
    const { data: exs } = await sb.from("ficha_exercicios")
      .select("id,reps,descanso_seg,biset").eq("dia_id", FICHA_DIA)
      .order("ordem",{ascending:true,nullsFirst:false}).order("id",{ascending:true});
    if(!exs || exs.length < 2){ piikAlert("Adicione ao menos 2 exercícios."); return; }
    const base = exs[0];
    const ok = await piikConfirm({
      titulo:"Replicar séries e descanso?",
      msg:`Vou copiar as <b>séries</b> (${esc(base.reps||"—")}) e o <b>descanso</b> (${base.descanso_seg!=null?base.descanso_seg+"s":"—"}) do 1º exercício para <b>todos os outros</b> deste dia.<br><br>Continuar?`,
      ok:"Replicar", cancel:"Cancelar"
    });
    if(!ok) return;
    const y = window.scrollY;
    const updates = exs.slice(1).map(e=>{
      const patch = { reps: base.reps };
      patch.descanso_seg = e.biset ? 0 : base.descanso_seg;  // preserva bi-sets
      return sb.from("ficha_exercicios").update(patch).eq("id", e.id);
    });
    await Promise.all(updates);
    await renderConteudoDia();
    window.scrollTo(0, y);
  }

  async function salvarAvaliacao(){
    const msg=document.getElementById("assessMsg"), btn=document.getElementById("assessSaveBtn");
    const student_id=document.getElementById("assessStudentId").value;
    if(bloqueiaDemo(student_id)) return;
    const date=document.getElementById("a_date").value;
    if(!student_id || !date){ msg.className="msg err"; msg.textContent="Escolha aluno e data."; return; }
    const val = id => { const e=document.getElementById(id); if(!e || e.value==="") return null; const n=toNum(e.value); return isNaN(n)?null:n; };
    const juntar = (pref, lista) => {
      const o = {};
      lista.forEach(([k])=>{ const v = val(pref+k); if(v!=null) o[k]=v; });
      return Object.keys(o).length ? o : null;
    };
    const row = { student_id, date,
      weight:   val("a_weight"),
      height:   val("a_height"),
      body_fat: val("a_bf"),
      lean_mass:val("a_lean"),
      fat_mass: val("a_fat"),
      skinfolds:      juntar("dob_", DOBRAS),
      circumferences: juntar("per_", PERIMETROS),
      notes:    document.getElementById("a_notes").value.trim() || null,
      created_by: ME.id };
    btn.disabled=true; msg.className="msg"; msg.textContent="";

    // Fotos: sobe as novas, mantém as já salvas
    let fotosPaths = [];
    try{
      for(const it of AVAL_FOTOS){
        if(it.path){ fotosPaths.push(it.path); }
        else if(it.file){ if(msg){ msg.className="msg"; msg.textContent="Enviando fotos…"; } fotosPaths.push(await uploadFotoAval(it.file, student_id)); }
      }
    }catch(e){ btn.disabled=false; msg.className="msg err"; msg.textContent="Erro ao enviar foto: "+e.message; return; }
    row.fotos = fotosPaths.length ? fotosPaths : null;

    let error;
    if(EDIT_ID){
      const { created_by, ...campos } = row;
      ({ error } = await sb.from("assessments").update(campos).eq("id", EDIT_ID));
    } else {
      ({ error } = await sb.from("assessments").insert(row));
    }
    btn.disabled=false;
    if(error){ msg.className="msg err"; msg.textContent="Erro ao salvar: "+error.message; return; }
    // apaga do storage as fotos que foram removidas nesta edição
    const removidas = AVAL_FOTOS_ORIG.filter(p => fotosPaths.indexOf(p)===-1);
    if(removidas.length){ try{ await sb.storage.from("avaliacoes-fotos").remove(removidas); }catch(e){} }
    msg.className="msg ok"; msg.textContent = EDIT_ID ? "Alterações salvas!" : "Avaliação salva!";
    const alvo = student_id;
    EDIT_ID = null;
    await loadStudents();
    const lista = document.getElementById("assessList_"+alvo);
    if(lista && lista.innerHTML){ lista.innerHTML=""; verAvaliacoes(alvo); }
    setTimeout(fecharForm, 800);
  }

  init();
</script>
<!-- Piik: item de menu "Personalização" (link para personalizar.html) — visível só para o personal -->
<script>
(async function(){
  try{
    if(!window.supabase) return;
    const _src = await fetch('app.html',{cache:'no-store'}).then(r=>r.text());
    const _URL=(_src.match(/SUPABASE_URL\s*=\s*["']([^"']+)["']/)||[])[1];
    const _ANON=(_src.match(/SUPABASE_ANON\s*=\s*["']([^"']+)["']/)||[])[1];
    if(!_URL||!_ANON) return;
    const _sb=window.supabase.createClient(_URL,_ANON,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
    const { data:{ user } } = await _sb.auth.getUser();
    if(!user) return;
    const { data:perfil } = await _sb.from('profiles').select('role,plano').eq('id',user.id).single();
    if(!perfil || !(perfil.role==='professional'||perfil.role==='creator')) return;
    // Personalização (white-label) é exclusiva do plano mais caro (You Piik). Creator sempre tem.
    const _plano = (perfil.plano||'').toLowerCase();
    const _podePerso = perfil.role==='creator' || _plano==='you_piik' || _plano==='pro';
    if(!_podePerso) return;
    function inject(){
      if(document.getElementById('piik-perso-link')) return true;
      const base = document.getElementById('nav_financeiro') || document.getElementById('nav_desempenho') || document.getElementById('nav_exercicios');
      if(!base || !base.parentElement) return false;
      const item = base.cloneNode(true);
      item.id='piik-perso-link';
      item.removeAttribute('onclick');
      const lbl = item.querySelector('.lbl') || item;
      lbl.textContent='Personalização';
      item.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); window.location.href='personalizar.html'; },true);
      base.parentElement.appendChild(item);
      return true;
    }
    if(!inject()){
      const mo=new MutationObserver(function(){ if(inject()) mo.disconnect(); });
      mo.observe(document.body,{childList:true,subtree:true});
      setTimeout(function(){ mo.disconnect(); },15000);
    }
  }catch(e){ console.warn('piik perso menu:', e); }
})();
</script>

    const _sb=window.supabase.createClient(_URL,_ANON,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
    const { data:{ user } } = await _sb.auth.getUser();
    if(!user) return;
    const { data:perfil } = await _sb.from('profiles').select('embaixador').eq('id',user.id).single();
    if(!perfil || perfil.embaixador!==true) return;

    // Link do manual completo (por enquanto a página que criamos; dá pra trocar por piik.com.br/manual.html depois)
    var MANUAL_URL='https://claude.ai/code/artifact/df5bf1d2-828f-4b0a-bf8b-eb853800a1b8';
    var UP=[];        // prints selecionados: {file,url}
    var selTipo='';

    function estilizaTipos(){
      var bs=document.querySelectorAll('.piik-fb-tipo');
      for(var i=0;i<bs.length;i++){
        var b=bs[i], on=(b.getAttribute('data-t')===selTipo);
        b.style.cssText='flex:1;cursor:pointer;font:inherit;font-size:13px;font-weight:700;padding:9px 6px;border-radius:10px;'+
          (on?'background:rgba(127,255,0,.14);border:1px solid #7fff00;color:#e8eaee'
             :'background:#171c22;border:1px solid #2a2f37;color:#9aa0ab');
      }
    }
    function renderPrev(){
      var box=document.getElementById('piik-fb-prev'); if(!box) return;
      box.innerHTML='';
      UP.forEach(function(it,i){
        var d=document.createElement('div');
        d.style.cssText='position:relative;width:70px;height:70px;border-radius:9px;overflow:hidden;border:1px solid #2a2f37;background:#0e1216';
        d.innerHTML='<img src="'+it.url+'" style="width:100%;height:100%;object-fit:cover;display:block">'+
          '<button data-i="'+i+'" class="piik-fb-rm" style="position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:1;cursor:pointer">×</button>';
        box.appendChild(d);
      });
      var rms=box.querySelectorAll('.piik-fb-rm');
      for(var i=0;i<rms.length;i++){
        rms[i].addEventListener('click',function(){
          var idx=Number(this.getAttribute('data-i'));
          if(UP[idx]&&UP[idx].url){ try{ URL.revokeObjectURL(UP[idx].url); }catch(e){} }
          UP.splice(idx,1); renderPrev();
        });
      }
    }
    function fechar(){ var ov=document.getElementById('piik-bt-ov'); if(ov) ov.remove(); UP=[]; selTipo=''; }

    async function enviar(){
      var msg=document.getElementById('piik-fb-msg');
      var txt=(document.getElementById('piik-fb-txt')||{}).value||'';
      txt=txt.trim();
      if(!selTipo){ msg.style.color='#ff5a5a'; msg.textContent='Escolha: ideia, sugestão ou erro.'; return; }
      if(!txt){ msg.style.color='#ff5a5a'; msg.textContent='Escreva algo antes de enviar.'; return; }
      var btn=document.getElementById('piik-fb-send'); btn.disabled=true;
      msg.style.color='#9aa0ab'; msg.textContent='Enviando…';
      try{
        var paths=[];
        for(var i=0;i<UP.length;i++){
          var f=UP[i].file;
          var ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
          var path=user.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
          var up=await _sb.storage.from('feedback-anexos').upload(path,f,{cacheControl:'3600',upsert:false,contentType:f.type||undefined});
          if(up.error) throw new Error(up.error.message||'Falha ao enviar o print.');
          paths.push(path);
        }
        var res=await _sb.functions.invoke('enviar-feedback',{ body:{ tipo:selTipo, texto:txt, anexos:paths } });
        if(res.error) throw new Error(res.error.message||'Erro ao enviar.');
        msg.style.color='#7fff00'; msg.textContent='✅ Enviado! Muito obrigado pelo retorno. 💚';
        setTimeout(fechar,1400);
      }catch(e){
        btn.disabled=false; msg.style.color='#ff5a5a'; msg.textContent='Erro: '+(e.message||e);
      }
    }

    function missaoCard(icon,titulo,feito,texto){
      return '<div style="background:#12161b;border:1px solid '+(feito?'rgba(127,255,0,.5)':'#2a2f37')+';border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start">'+
        '<div style="font-size:22px;line-height:1">'+icon+'</div>'+
        '<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:15px">'+titulo+'</div>'+
        '<div style="font-size:13px;color:#9aa0ab;margin-top:2px">'+texto+'</div></div>'+
        '<div style="font-size:18px;line-height:1">'+(feito?'✅':'⬜')+'</div></div>';
    }
    async function abrir(){
      if(document.getElementById('piik-bt-ov')) return;
      // progresso das missões (ao vivo)
      var nAl=0,nTr=0,nRe=0;
      try{ var a=await _sb.from('profiles').select('id',{count:'exact',head:true}).eq('professional_id',user.id).is('deletado_em',null); nAl=a.count||0; }catch(e){}
      try{ var t=await _sb.from('fichas').select('id',{count:'exact',head:true}).eq('professional_id',user.id); nTr=t.count||0; }catch(e){}
      try{ var r=await _sb.from('sessoes').select('id',{count:'exact',head:true}).eq('finalizada',true); nRe=r.count||0; }catch(e){}

      var ov=document.createElement('div'); ov.id='piik-bt-ov';
      ov.style.cssText='position:fixed;inset:0;z-index:2147483000;background:#07090b;overflow:auto;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#e8eaee';
      ov.innerHTML=
        '<div style="position:sticky;top:0;background:#0c0f13;border-bottom:1px solid #1e232b;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:2">'+
          '<button id="piik-bt-back" style="background:#171c22;border:1px solid #2a2f37;color:#e8eaee;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer">← Voltar</button>'+
          '<b style="font-size:16px">🧪 Beta Tester</b></div>'+
        '<div style="max-width:720px;margin:0 auto;padding:20px 16px 60px">'+
          '<div style="background:linear-gradient(135deg,rgba(127,255,0,.14),rgba(127,255,0,.03));border:1px solid rgba(127,255,0,.4);border-radius:16px;padding:20px">'+
            '<div style="font-size:22px;font-weight:900">Você é Beta Tester do Piik 🚀</div>'+
            '<p style="color:#c7ccd6;font-size:14px;margin:8px 0 0;line-height:1.5">Obrigado por construir isso com a gente. Use o Piik de verdade com seus alunos e conte o que achar — seu retorno molda o produto.</p></div>'+
          '<a href="'+MANUAL_URL+'" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:14px;margin-top:16px;background:#7fff00;color:#07090b;border-radius:16px;padding:18px 20px;text-decoration:none">'+
            '<div style="font-size:30px;line-height:1">📖</div><div><div style="font-weight:900;font-size:17px">Abrir o manual completo</div>'+
            '<div style="font-size:13px;font-weight:600;opacity:.82">Como usar o Piik passo a passo + o programa do beta</div></div>'+
            '<div style="margin-left:auto;font-size:22px;font-weight:900">→</div></a>'+
          '<h3 style="margin:26px 0 10px;font-size:16px">🎯 Seus objetivos no teste</h3>'+
          '<div style="display:flex;flex-direction:column;gap:10px">'+
            missaoCard('1️⃣','Cadastre 3 alunos', nAl>=3, nAl>=3?('Feito! '+nAl+' alunos cadastrados.'):('Você já tem '+nAl+' de 3.'))+
            missaoCard('2️⃣','Monte 1 treino', nTr>=1, nTr>=1?('Feito! '+nTr+' treino'+(nTr>1?'s':'')+' montado'+(nTr>1?'s':'')+'.'):'Monte o primeiro treino de um aluno.')+
            missaoCard('3️⃣','Receba 1 retorno de treino', nRe>=1, nRe>=1?('Feito! '+nRe+' treino'+(nRe>1?'s':'')+' concluído'+(nRe>1?'s':'')+' por alunos.'):'Peça pro aluno concluir um treino no app.')+
          '</div>'+
          '<h3 style="margin:26px 0 10px;font-size:16px">💬 Enviar feedback</h3>'+
          '<div style="background:#12161b;border:1px solid #2a2f37;border-radius:16px;padding:18px 20px">'+
            '<p style="color:#9aa0ab;font-size:14px;margin:0 0 12px">Ideia, sugestão ou erro? Conta pra gente. 💚</p>'+
            '<div style="display:flex;gap:8px;margin-bottom:12px" id="piik-fb-tipos">'+
              '<button data-t="ideia" class="piik-fb-tipo">💡 Ideia</button>'+
              '<button data-t="sugestao" class="piik-fb-tipo">✍️ Sugestão</button>'+
              '<button data-t="erro" class="piik-fb-tipo">🐞 Erro</button></div>'+
            '<textarea id="piik-fb-txt" rows="5" placeholder="Escreva aqui…" style="width:100%;box-sizing:border-box;background:#0e1216;color:#e8eaee;border:1px solid #2a2f37;border-radius:10px;padding:10px;font:inherit;font-size:14px;resize:vertical"></textarea>'+
            '<div style="margin-top:10px"><input type="file" id="piik-fb-file" accept="image/*" multiple style="display:none">'+
            '<button id="piik-fb-add" style="background:#171c22;color:#e8eaee;border:1px solid #2a2f37;border-radius:10px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer">📎 Anexar print</button>'+
            '<div id="piik-fb-prev" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div></div>'+
            '<button id="piik-fb-send" style="width:100%;margin-top:14px;background:#7fff00;color:#07090b;border:none;border-radius:11px;padding:12px;font:inherit;font-size:15px;font-weight:800;cursor:pointer">Enviar</button>'+
            '<div id="piik-fb-msg" style="font-size:13px;margin-top:8px;min-height:16px"></div></div>'+
        '</div>';
      document.body.appendChild(ov);
      estilizaTipos();
      document.getElementById('piik-bt-back').addEventListener('click',fechar);
      var tbs=ov.querySelectorAll('.piik-fb-tipo');
      for(var i=0;i<tbs.length;i++){ tbs[i].addEventListener('click',function(){ selTipo=this.getAttribute('data-t'); estilizaTipos(); }); }
      var fileInp=document.getElementById('piik-fb-file');
      document.getElementById('piik-fb-add').addEventListener('click',function(){ fileInp.click(); });
      fileInp.addEventListener('change',function(){
        var fs=Array.prototype.slice.call(this.files||[]);
        fs.forEach(function(f){
          if(!f||!f.type||f.type.indexOf('image/')!==0) return;
          if(f.size>10*1024*1024){ alert('A imagem "'+f.name+'" passa de 10MB.'); return; }
          UP.push({file:f,url:URL.createObjectURL(f)});
        });
        this.value=''; renderPrev();
      });
      document.getElementById('piik-fb-send').addEventListener('click',enviar);
    }

    function inject(){
      if(document.getElementById('piik-bt-link')) return true;
      var base=document.getElementById('nav_financeiro')||document.getElementById('nav_desempenho')||document.getElementById('nav_exercicios');
      if(!base||!base.parentElement) return false;
      var item=base.cloneNode(true);
      item.id='piik-bt-link';
      item.removeAttribute('onclick');
      var lbl=item.querySelector('.lbl')||item;
      lbl.textContent='🧪 Beta Tester';
      lbl.style.color='#07090b';
      // destaque: mais para baixo, cor chamativa
      item.style.cssText='margin-top:22px;background:linear-gradient(135deg,#7fff00,#46c93a);color:#07090b;border:none;border-radius:12px;font-weight:800;box-shadow:0 4px 14px rgba(127,255,0,.25);text-align:center';
      item.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); abrir(); },true);
      base.parentElement.appendChild(item);   // sempre no fim da lista (mais para baixo)
      return true;
    }
    if(!inject()){
      var mo=new MutationObserver(function(){ if(inject()) mo.disconnect(); });
      mo.observe(document.body,{childList:true,subtree:true});
      setTimeout(function(){ mo.disconnect(); },15000);
    }
  }catch(e){ console.warn('piik ajuda menu:', e); }
})();
</script>

<!-- Piik white-label: aplica a marca do personal (cores, fundo, textos, logo) no site -->
<script>
(function(){
  function hx(h){h=(h||'').trim().replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');var n=parseInt(h,16);return isNaN(n)?null:[(n>>16)&255,(n>>8)&255,n&255];}
  function toHex(a){return '#'+a.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');}).join('');}
  function lum(h){var r=hx(h);if(!r)return 0;var a=r.map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*a[0]+0.7152*a[1]+0.0722*a[2];}
  function mix(h1,h2,t){var a=hx(h1),b=hx(h2);if(!a||!b)return h1;return toHex([0,1,2].map(function(i){return a[i]+(b[i]-a[i])*t;}));}
  function legivel(bg){return lum(bg)>0.55?'#12141a':'#f2f4f8';}

  function aplicarLogo(url){
    if(!url)return;
    var safe=String(url).replace(/"/g,'&quot;');
    var els=document.querySelectorAll('.logo-piik');
    for(var i=0;i<els.length;i++){
      var el=els[i];
      if(el.getAttribute('data-piik-logo'))continue;
      el.setAttribute('data-piik-logo','1');
      el.innerHTML='<img src="'+safe+'" alt="" style="height:48px;max-width:260px;object-fit:contain;vertical-align:middle;border-radius:6px;display:inline-block">';
    }
  }
  function aplicar(pz){
    var R=document.documentElement.style;
    function set(k,v){ if(v) R.setProperty(k,v,'important'); }
    var accent=pz.accent||null, bg=pz.bg||null;
    if(accent){
      set('--pink',accent);
      set('--pink-deep',mix(accent,'#000000',0.22));
      set('--pink-soft',accent);
      set('--blue',accent); set('--blue-deep',mix(accent,'#000000',0.22)); set('--lilac',accent);
      set('--on-accent',legivel(accent));
    }
    if(bg){
      var towards=lum(bg)>0.55?'#000000':'#ffffff';
      set('--pk-bg',bg);
      set('--pk-surf', mix(bg,towards,0.06));
      set('--pk-surf2',mix(bg,towards,0.12));
      set('--pk-elev', mix(bg,towards,0.03));
      set('--card',    mix(bg,towards,0.06));
      set('--card2',   mix(bg,towards,0.10));
      set('--line',    mix(bg,towards,0.20));
      set('--pk-nav',  mix(bg,towards,0.02));
    }
    var t1=pz.text1||(bg?legivel(bg):null);
    var t2=pz.text2||(t1?(bg?mix(t1,bg,0.38):mix(t1,'#0a0b0d',0.38)):null);
    set('--txt',t1); set('--muted',t2);
    aplicarLogo(pz.logo_url);
    try{ window.PIIK_BRAND = { logo_url: pz.logo_url||null, accent: pz.accent||null }; }catch(e){}   // logo do personal p/ o card de parabéns
  }

  async function run(){
    try{
      var _sb=(typeof sb!=='undefined'&&sb)?sb:(window.sb||null);
      if(!_sb&&window.supabase){
        try{
          var src=await fetch('app.html',{cache:'no-store'}).then(function(r){return r.text();});
          var U=(src.match(/SUPABASE_URL\s*=\s*["']([^"']+)["']/)||[])[1];
          var A=(src.match(/SUPABASE_ANON\s*=\s*["']([^"']+)["']/)||[])[1];
          if(U&&A)_sb=window.supabase.createClient(U,A,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
        }catch(e){}
      }
      if(!_sb)return;
      var ures=await _sb.auth.getUser(); var user=ures&&ures.data?ures.data.user:null;
      if(!user)return;
      var pr=await _sb.from('profiles').select('role,professional_id,brand_off').eq('id',user.id).single();
      var perfil=pr.data; if(!perfil)return;
      if(perfil.brand_off===true) return;   // marca (white-label) desativada só para esta conta — reversível pelo banco
      var profId=(perfil.role==='professional'||perfil.role==='creator')?user.id:perfil.professional_id;
      if(!profId)return;
      // A marca (white-label) só é aplicada se o profissional dono estiver no plano You Piik (mais caro).
      var ppr=await _sb.from('profiles').select('plano,role').eq('id',profId).maybeSingle();
      var pprof=ppr&&ppr.data?ppr.data:null;
      var pplano=(pprof&&pprof.plano||'').toLowerCase();
      var ppodePerso=(pprof&&pprof.role==='creator')||pplano==='you_piik'||pplano==='pro';
      if(!ppodePerso)return;
      var pzr=await _sb.from('personalizacao').select('accent,bg,text1,text2,logo_url,ativo').eq('professional_id',profId).maybeSingle();
      var pz=pzr.data; if(!pz||pz.ativo===false)return;
      aplicar(pz);
      if(pz.logo_url){
        var mo=new MutationObserver(function(){ aplicarLogo(pz.logo_url); });
        mo.observe(document.body,{childList:true,subtree:true});
        setTimeout(function(){ mo.disconnect(); },20000);
      }
    }catch(e){ console.warn('piik brand:',e); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();
</script>

  function criar(){

})();
</script>

/* altura fixa: trocar de categoria (Favoritos etc.) não muda a altura da página, então a tela não pula */
.lib-lista{height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.lib-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card2,#171c22);border:1px solid var(--line,#2a2f37);border-radius:10px;padding:7px 10px;cursor:pointer;color:inherit;font:inherit}
.lib-item:hover{border-color:var(--accent,#7fff00)}
.lib-thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--elev,#0e1216);display:flex;align-items:center;justify-content:center;overflow:hidden}
.lib-thumb.ph{font-size:20px}
.lib-item-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.lib-item-nome{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item-grp{font-size:12px;opacity:.7}
.lib-add{font-size:18px;font-weight:800;color:var(--accent,#7fff00);flex:0 0 auto}
/* estrela sempre visível, mesmo com qualquer cor de personalização (contorno claro+escuro) */
.lib-fav{flex:0 0 auto;font-size:18px;line-height:1;color:#9aa3b0;cursor:pointer;padding:2px 5px;border-radius:6px;text-shadow:0 0 2px rgba(0,0,0,.6),0 0 1px rgba(255,255,255,.5);transition:color .12s}
.lib-fav:hover{color:#ffcf33}
.lib-fav.on{color:#ffcf33}
.lib-pane .fx-grupos{display:flex;flex-wrap:wrap;overflow-x:visible;gap:6px;padding-bottom:0}
.chip-f.chip-fav{border-color:#5a4a12;color:#ffcf33}
.chip-f.chip-fav.sel{background:#ffcf33;border-color:#ffcf33;color:#12161b}
.lib-form{background:var(--card2,#171c22);border:1px solid var(--line,#2a2f37);border-radius:12px;padding:12px;margin-bottom:10px}
.lib-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.lib-form-grid input,.lib-form-grid select{width:100%;background:var(--elev,#0e1216);color:var(--txt,#e8eaee);border:1px solid var(--line,#2a2f37);border-radius:9px;padding:8px 9px;font-size:13px}
.lib-up{display:flex;flex-direction:column;gap:4px;font-size:12px;opacity:.9;margin-bottom:8px}
.lib-form-acoes{display:flex;gap:8px;flex-wrap:wrap}
.ex-thumb-al video,.ex-thumb-al img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
video.ex-thumb{object-fit:cover}
.vidfull-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2147483200;display:flex;align-items:center;justify-content:center;padding:16px}
.vidfull-cx{position:relative;max-width:92vw;max-height:88vh}
.vidfull-el{max-width:92vw;max-height:88vh;border-radius:12px;background:#000;display:block}
.vidfull-x{position:absolute;top:-14px;right:-14px;width:36px;height:36px;border-radius:50%;border:none;background:#fff;color:#000;font-size:16px;cursor:pointer}
@media(max-width:820px){
  .montador{grid-template-columns:1fr}
  .montador-dir{width:100%;position:static}
  .lib-toggle{display:block;width:100%;margin-bottom:8px}
  .lib-pane{display:none}
  .lib-pane.aberta{display:block}
  .lib-form-grid{grid-template-columns:1fr}
}
.fx-replicar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.nota-aluno{margin:6px 0 14px;border:1px solid var(--line,#2a2f37);border-radius:12px;overflow:hidden}
.nota-toggle{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card2,#171c22);border:none;color:var(--txt,#e8eaee);font:inherit;font-weight:700;font-size:14px;padding:11px 14px;cursor:pointer}
.nota-toggle #notaChev{margin-left:auto;opacity:.7}
.nota-box{padding:12px 14px;background:var(--card,#12161b)}
.nota-box textarea{width:100%;background:var(--elev,#0e1216);color:var(--txt,#e8eaee);border:1px solid var(--line,#2a2f37);border-radius:10px;padding:10px;font:inherit;font-size:14px;resize:vertical}
.nota-acoes{display:flex;align-items:center;gap:10px;margin-top:8px}
</style>
</body>
</html>
