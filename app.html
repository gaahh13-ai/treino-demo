<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piik</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{color-scheme:light;--txt:#e8eaee;--muted:#9aa0ab;--line:#262a33;--pink:#7fff00;--pink-deep:#5fbf00}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{min-height:100vh;background:linear-gradient(180deg,var(--pk-bg,#0a0b0d),var(--pk-surf,#15171c) 45%,var(--pk-surf,#15171c));color:var(--txt)}
  nav.top{background:rgba(253,244,248,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  nav.top .in{max-width:1160px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;justify-content:space-between}
  .logo{height:32px}
  .logout{border:1.5px solid var(--pink);color:var(--pink-deep);background:var(--pk-surf,#15171c);border-radius:12px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
  .top-acoes{display:flex;align-items:center;gap:12px}
  .perfil-av{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;padding:0;width:56px}
  .av-thumb{width:38px;height:38px;border-radius:9px;overflow:hidden;background:var(--pk-surf2,#1d2027);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--pink-deep)}
  .av-thumb img{width:100%;height:100%;object-fit:cover}
  .av-thumb.av-money{font-size:20px;font-weight:800;color:var(--pink-deep)}
  .av-thumb.av-help{font-size:20px;font-weight:800;color:var(--pink-deep)}
  .ajuda-dicas{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .aj-item{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
  .aj-item b{font-size:13.5px;color:var(--txt)}
  .aj-item span{font-size:12.5px;color:var(--muted);line-height:1.4}
  .aj-wa{width:100%;display:block;text-align:center;text-decoration:none}
  .ajuda-ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62)}
  .ajuda-pop{position:fixed;top:70px;right:16px;width:min(360px,92vw);background:var(--pk-surf,#15171c);border-radius:16px;padding:20px;
    border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.4)}
  .ajuda-pop h3{font-size:17px;font-weight:800;color:var(--pink-deep)}
  .presenca-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .presenca-tit{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .presenca-btns{display:flex;gap:8px;flex-wrap:wrap}
  /* Assinatura / planos */
  .assin-tabs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .assin-tab{padding:26px 18px;border:2px solid var(--line);border-radius:16px;background:var(--pk-surf,#15171c);cursor:pointer;
    font-size:18px;font-weight:800;color:var(--txt);transition:.15s}
  .assin-tab:hover{border-color:var(--pink)}
  .assin-tab.active{border-color:var(--pink);background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));color:var(--pink-deep)}
  .plano-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .plano-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--pk-surf,#15171c);display:flex;flex-direction:column}
  .plano-card.destaque{border:2px solid var(--pink)}
  .pl-badge{position:absolute;top:-11px;right:16px;background:var(--pink-deep);color:#fff;font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
  .pl-nome{font-size:19px;font-weight:800}
  .pl-preco{font-size:28px;font-weight:800;color:var(--pink-deep);margin:6px 0 16px}
  .pl-preco-sub{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
  .pl-lista{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:9px;flex:1}
  .pl-lista li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.35;color:var(--txt)}
  .pl-lista li.no{color:var(--muted)}
  .pl-ic{font-weight:800;flex:none}
  .pl-lista li.ok .pl-ic{color:#15803d}
  .pl-lista li.no .pl-ic{color:#c2410c}
  .pl-btn{width:100%}
  @media(max-width:760px){ .assin-tabs,.plano-grid{grid-template-columns:1fr} }
  /* assinatura: layout com menu à direita */
  .assin-shell{display:grid;grid-template-columns:1fr 210px;gap:18px;align-items:start}
  .assin-main{min-height:80px}
  .assin-menu{display:flex;flex-direction:column;gap:8px}
  .assin-mi{border:1.5px solid var(--line);background:var(--pk-surf,#15171c);border-radius:12px;padding:12px 14px;
    font-size:14px;font-weight:700;color:var(--txt);cursor:pointer;text-align:left;transition:.15s}
  .assin-mi:hover{border-color:var(--pink)}
  .assin-mi.active{border-color:var(--pink);background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));color:var(--pink-deep)}
  .assin-suporte{border:1px solid var(--line);border-radius:14px;padding:18px}
  @media(max-width:760px){ .assin-shell{grid-template-columns:1fr} .assin-menu{flex-direction:row;flex-wrap:wrap;order:-1} .assin-mi{flex:1;text-align:center} }
  /* assinatura atual + histórico */
  .assin-atual{border:2px solid var(--pink);border-radius:16px;padding:18px 20px;background:linear-gradient(120deg,#0a0b0d,var(--pk-surf,#15171c))}
  .assin-atual.light{border:1px solid var(--line);background:#faf8fb}
  .aa-tag{display:inline-block;background:var(--pink-deep);color:#fff;font-size:11px;font-weight:800;
    padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
  .aa-plano{font-size:22px;font-weight:800;margin-top:8px}
  .aa-info{font-size:20px;font-weight:800;color:var(--pink-deep);margin-top:2px}
  .aa-mes{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
  .aa-sub{font-size:13px;color:var(--muted);margin-top:6px}
  .assin-nenhuma{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
  .assin-hist{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .ah-tit{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .assin-hist-row{display:grid;grid-template-columns:1.3fr .9fr .7fr auto;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .assin-hist-row:last-child{border-bottom:none}
  .ah-plano{font-weight:700}
  .ah-data,.ah-valor{color:var(--muted)}
  @media(max-width:760px){ .assin-hist-row{grid-template-columns:1fr auto;grid-auto-rows:auto} .ah-data{grid-column:1} }
  .av-cap{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}
  /* perfil resumido */
  .perfil-foto{text-align:center;margin:6px 0 20px}
  .foto-btn{position:relative;border:none;background:none;cursor:pointer;padding:0;display:inline-block}
  .foto-preview{width:112px;height:112px;border-radius:50%;overflow:hidden;background:var(--pk-surf2,#1d2027);border:3px solid var(--pink);
    display:flex;align-items:center;justify-content:center;font-size:46px}
  .foto-preview img{width:100%;height:100%;object-fit:cover}
  .foto-plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:34px;font-weight:700;
    text-shadow:0 1px 8px rgba(0,0,0,.55);pointer-events:none}
  .foto-cap{margin-top:8px;font-weight:700;font-size:13px;color:var(--pink-deep)}
  .acc{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--pk-surf,#15171c);overflow:hidden}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px;background:none;border:none;cursor:pointer;text-align:left}
  .acc-txt{display:flex;flex-direction:column;gap:3px}
  .acc-tit{font-weight:800;font-size:15px;color:var(--txt)}
  .acc-sub{font-size:12.5px;color:var(--pink-deep);font-weight:600}
  .acc-chev{color:var(--pink-deep);font-size:22px;line-height:1;transition:transform .2s}
  .acc.open .acc-chev{transform:rotate(90deg)}
  .acc-body{display:none;padding:0 16px 16px}
  .acc.open .acc-body{display:block}
    .acc-dados.open .acc-sub{display:none}
  .wrap{max-width:1160px;margin:0 auto;padding:26px 20px 60px}
  .hello{font-size:21px;font-weight:800;margin-bottom:4px}
  .role-chip{display:inline-block;font-size:12px;font-weight:800;padding:4px 12px;border-radius:999px;margin-bottom:18px}
  .chip-creator{background:var(--pk-surf2,#1d2027);color:var(--pink,#7fff00)}
  .chip-professional{background:var(--pk-surf2,#1d2027);color:#1d4ed8}
  .chip-student{background:var(--pk-surf2,#1d2027);color:var(--pink,#7fff00)}

  .shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:20px;align-items:start}
  .panel{min-width:0}
  .sidebar{background:var(--pk-surf,#15171c);border:1px solid var(--line);border-radius:18px;padding:10px;
           box-shadow:0 8px 22px rgba(180,90,140,.06);position:sticky;top:86px}
  .navitem{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;
           padding:11px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--txt);cursor:pointer;text-align:left}
  .navitem:hover{background:var(--pk-surf2,#1d2027)}
  .navitem.active{background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));color:var(--pink-deep);font-weight:800}
  .navitem .ico{font-size:15px;line-height:1}
  .navgroup{display:flex;flex-direction:column;gap:2px}
  .navsubs{display:none;margin:2px 0 4px 10px;padding-left:10px;border-left:1px solid var(--line);
           flex-direction:column;gap:2px}
  .navgroup.open .navsubs{display:flex}
  .navsub{padding:9px 12px;font-size:13px;font-weight:600;opacity:.92}
  .navhead{display:flex;align-items:center;justify-content:space-between}
  .navchev{font-size:11px;opacity:.6;transition:transform .15s;margin-left:8px}
  .navgroup.open .navchev{transform:rotate(180deg)}
  /* banner de pedido de vínculo (aluno) */
  .vinc-banner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    border:2px solid var(--pink);border-radius:16px;padding:16px 18px;margin:0 0 16px;
    background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33))}
  .vb-txt{font-size:14px;line-height:1.5;flex:1;min-width:240px}
  .vb-acoes{display:flex;gap:8px;flex-wrap:wrap}
  .vb-acoes .btn{white-space:nowrap}
  /* Financeiro */
  .fin-topo{display:flex;align-items:center;gap:12px}
  .fin-mes{font-weight:800;font-size:16px;min-width:150px;text-align:center}
  .fin-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .fin-kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .fin-kpi .fk-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .fin-kpi b{font-size:18px}
  .fin-kpi.ok b{color:#15803d}
  .fin-kpi.warn b{color:#be123c}
  .fin-row{display:grid;grid-template-columns:1.4fr .9fr 1fr .8fr auto;align-items:center;gap:10px;
           padding:11px 4px;border-bottom:1px solid var(--line)}
  .fin-nome{font-weight:700;font-size:14px}
  .fin-campo{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .fin-in{width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .fin-in.fin-dia{width:56px}
  .fin-tag{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
  .fin-tag.pg{background:#122110;color:#15803d}
  .fin-tag.pe{background:#2a2410;color:#b45309}
  .fin-tag.at{background:#2a1416;color:#be123c}
  .fin-btn{padding:8px 12px;font-size:13px;white-space:nowrap}
  .fin-aluno{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .fin-al-plano{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .fin-al-mes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .fin-al-mesnome{font-weight:800;font-size:14px;min-width:140px}
  .fin-al-hist{border-top:1px dashed var(--line);padding-top:10px}
  .fin-hist-tit{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .fin-hist-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px}
  @media(max-width:760px){
    .fin-cards{grid-template-columns:repeat(2,1fr)}
    .fin-row{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
    .fin-nome{grid-column:1/-1}
    .fin-ac{grid-column:1/-1}
    .fin-btn{width:100%}
  }

  .panel h2{font-size:18px;font-weight:800;margin-bottom:14px}
  .card{background:var(--pk-surf,#15171c);border:1px solid var(--line);border-radius:18px;padding:22px;
        box-shadow:0 8px 22px rgba(180,90,140,.06);margin-bottom:16px}
  .card h3{font-size:15px;font-weight:800;color:var(--pink-deep);margin-bottom:8px}
  .card p{font-size:14px;color:var(--muted);line-height:1.55}
  .btn{display:inline-block;border:none;border-radius:12px;padding:11px 20px;font-weight:700;font-size:14px;color:#fff;cursor:pointer;text-decoration:none;
       background:linear-gradient(120deg,var(--pink,#7fff00),var(--pink-deep,#5fbf00));box-shadow:0 6px 16px rgba(236,72,153,.2);margin-top:8px}
  .btn.small{padding:8px 14px;font-size:13px;box-shadow:none}
  .btn.ghost{background:var(--pk-surf,#15171c);color:var(--pink-deep);border:1.5px solid var(--line)}
  .tag{display:inline-block;background:#2a2410;color:#b45309;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;border:1px solid #fed7aa}
  #loading{text-align:center;padding:80px 20px;color:var(--muted)}
  .student-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .student-row:last-child{border-bottom:none}
  .student-row .name{font-weight:700;font-size:14px}
  .student-row .meta{font-size:12px;color:var(--muted)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
  .field input:focus,.field textarea:focus{outline:2px solid var(--pink-deep,#5fbf00);border-color:var(--pink-deep,#5fbf00)}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .msg{margin-top:10px;font-size:13px;padding:9px 11px;border-radius:9px;display:none;line-height:1.45}
  .msg.err{display:block;background:#2a1416;color:#c0392b}
  .msg.ok{display:block;background:#122110;color:#1a8a4a}
  .msg.warn{display:block;background:#2a2410;color:#b45309}
  .field input[readonly]{background:var(--pk-surf2,#1d2027);color:var(--pink-deep);font-weight:800;cursor:not-allowed}
  .meta-cliente{margin-top:2px}

  /* tela "Meus alunos": detalhe + coluna de alunos */
  .alunos-layout{display:grid;grid-template-columns:1fr 258px;gap:16px;align-items:start;margin-bottom:16px}
  .alunos-col{background:var(--pk-surf,#15171c);border:1px solid var(--line);border-radius:18px;padding:14px;
    box-shadow:0 8px 22px rgba(180,90,140,.06);position:sticky;top:86px}
  .alunos-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .alunos-head h3{font-size:14px;font-weight:800;color:var(--pink-deep)}
  .aluno-search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;margin-bottom:10px;font-family:inherit;background:var(--elev,#0e1216);color:var(--txt,#e8eaee)}
  .aluno-search:focus{outline:2px solid var(--pink-deep,#5fbf00);border-color:var(--pink-deep,#5fbf00)}
  #alunosLista{max-height:60vh;overflow-y:auto}
  .aluno-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
    border:none;background:none;padding:10px 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--txt);cursor:pointer}
  .aluno-item:hover{background:var(--pk-surf2,#1d2027)}
  .aluno-item.sel{background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));color:var(--pink-deep);font-weight:800}
  .aluno-item .ai-n{font-size:11px;font-weight:800;color:var(--muted);background:var(--pk-surf2,#1d2027);border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
  .aluno-detalhe{min-height:130px}
  .det-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .det-nome{font-size:18px;font-weight:800}
  .det-sub{font-size:12.5px;color:var(--muted);margin-top:3px;margin-bottom:16px}
  .demo-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--pink,#7fff00);color:#0a0b0d;vertical-align:middle}
  .det-acoes{display:flex;flex-direction:column;gap:8px;max-width:280px}
  .det-acoes .btn{width:100%;text-align:center}
  .det-acoes .btn.ativo{border-color:var(--pink-deep);color:var(--pink-deep);background:#0a0b0d;font-weight:800}
  .prox-aval{background:var(--pk-surf2,#1d2027);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
  .prox-aval .pa-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .prox-aval .pa-lbl{font-size:13px;font-weight:700}
  .prox-aval .pa-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .prox-aval input{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .det-acoes .btn{margin-top:0}
  @media(max-width:760px){
    .alunos-layout{grid-template-columns:1fr}
    .alunos-col{position:static;order:-1}
    #alunosLista{max-height:230px}
  }

  /* biblioteca de exercícios */
  .chip-f{border:1px solid var(--line);background:var(--pk-surf,#15171c);color:var(--muted);border-radius:999px;
    padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .chip-f.sel{background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));color:var(--pink-deep);border-color:transparent}
  .ex-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ex-row:last-child{border-bottom:none}
  .ex-thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;border:1px solid var(--line)}
  .ex-thumb.ph{display:flex;align-items:center;justify-content:center;background:var(--pk-surf2,#1d2027);font-size:20px}
  .ex-info{flex:1;min-width:0}
  .ex-nome{font-weight:700;font-size:14px}
  .ex-meta{font-size:12px;color:var(--muted);margin-top:2px}

  /* montador de ficha (profissional) */
  /* cada exercício num card bem demarcado (não confunde ao olhar rápido) */
  /* cada exercício num card bem demarcado (não confunde ao olhar rápido) */
  .fx-row{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(127,255,0,.02);margin-bottom:10px}
  .fx-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  /* reordenar: card que se move fica elevado e passa por cima do outro */
  .fx-row.fx-lift{box-shadow:0 10px 26px rgba(0,0,0,.4);border-color:var(--pink)}
  .fx-nome{font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px}
  .fx-campos{display:flex;gap:8px;flex-wrap:wrap}
  .fx-campos label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;gap:3px}
  .fx-campos input{width:64px;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--elev,#0e1216);color:var(--txt,#e8eaee)}
  .fx-campos label.fx-series input{width:168px}
  .fx-campos label.fx-carga input{width:96px}
  .fx-biset-chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
  .fx-biset-chk input{width:18px;height:18px;accent-color:var(--pink);cursor:pointer;flex:0 0 auto}
  .fx-biset-chk:has(input:checked){color:var(--pink)}
  .fx-biset-btn{margin-top:10px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .fx-biset-btn:hover{border-color:var(--pink);color:var(--pink)}
  .fx-biset-btn.on{background:rgba(127,255,0,.10);border:1px solid var(--pink);border-style:solid;color:var(--pink)}
  .fx-row.biset-top{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom:none;margin-bottom:0}
  .fx-row.biset-cont{border-top-left-radius:0;border-top-right-radius:0;border-left:3px solid var(--pink);margin-top:0}
  .biset-ic{color:var(--pink)}
  .biset-grupo{border:1px solid var(--pink);border-radius:14px;padding:8px;margin:12px 0;background:rgba(127,255,0,.05)}
  .biset-grupo .tr-ex,.biset-grupo .ex-card{margin:6px 0}
  .biset-tag{font-size:11px;font-weight:800;color:var(--pink);text-transform:uppercase;letter-spacing:.03em;padding:4px 6px 8px}
  .biset-tag-exec{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .biset-check{flex:0 0 auto}
  /* bi-set: a caixa fica sempre com a borda verde; ao marcar como feito o ✓ fica verde */
  .biset-grupo.done{background:#12160b}
  .biset-check.on,
  .biset-grupo.done .biset-check{background:var(--pink)!important;border-color:var(--pink)!important;color:#0a0b0d!important;font-weight:800}
  .ex-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .ex-add-cta{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  .ex-form-card{border:1px solid var(--pink);box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .ex-form-card h3{color:var(--pink)}
  .star-btn{background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px;transition:.12s;flex:0 0 auto}
  .star-btn:hover{color:#ffcc00;transform:scale(1.15)}
  .star-btn.on{color:#ffcc00}
  .al-carga{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .al-carga input{width:84px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--txt);background:transparent}
  .fx-obs{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;font-family:inherit;color:var(--txt,#e8eaee);background:var(--elev,#0e1216);resize:vertical;min-height:40px;line-height:1.45}
  .fx-obs:focus{outline:2px solid var(--pink-deep,#5fbf00);border-color:var(--pink-deep,#5fbf00)}
  .fx-add{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .fx-add select{flex:1;min-width:160px;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:13px}
  /* treino (aluno) */
  .tr-ex{border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--pk-surf,#15171c)}
  .tr-nome{font-weight:800;font-size:14.5px}
  .tr-presc{font-size:13px;color:var(--txt);margin-top:3px}
  /* cabeçalho com a contagem de exercícios */
  .tr-head{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px}
  /* selo com o número do exercício */
  .ex-num{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--pink);color:#0a0b0d;font-weight:800;font-size:12px;flex:0 0 auto}
  .tr-ex-top{display:flex;align-items:center;gap:10px}
  .tr-presc b{color:var(--pink-deep)}
  .ficha-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 12px;background:var(--pk-surf2,#1d2027);border:1px solid var(--line);border-radius:12px}
  .ficha-head select{padding:8px;border:1px solid var(--line);border-radius:9px;font-size:12.5px}

  /* botão Voltar no topo (só durante a execução) */
  .nav-voltar{display:none;margin-left:auto;border:1.5px solid var(--pink);color:var(--pink-deep);background:var(--pk-surf,#15171c);
    border-radius:12px;padding:8px 18px;font-weight:800;font-size:13px;cursor:pointer}
  body.exec-modo #topAcoes{display:none!important}
  body.exec-modo .nav-voltar{display:inline-block}
  /* execução do treino (aluno, tela dedicada) */
  .exec-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:66px;z-index:5;
    background:linear-gradient(180deg,var(--pk-bg,#0a0b0d),#0a0b0dee);padding:10px 0}
  .exec-titulo{font-size:16px;font-weight:800}
  .foco-enter{width:100%;margin:0 0 14px;background:#0a0b0d;color:var(--pink);border:1.5px solid var(--pink);font-weight:800}
  /* Modo Foco */
  .foco-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .foco-crono{font-size:30px;font-weight:800;color:var(--pink-deep);font-variant-numeric:tabular-nums}
  .foco-prog{text-align:center;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .foco-card{border:2px solid var(--pink);border-radius:20px;padding:22px;min-height:44vh;display:flex;flex-direction:column;
    justify-content:center;background:rgba(127,255,0,.04);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .foco-card.done{border-color:#bbeccb;background:#12160b}
  .foco-nome{font-size:26px;font-weight:800;line-height:1.15;text-align:center}
  .foco-presc{text-align:center;font-size:14px;color:var(--txt);margin-top:8px}
  .foco-check{width:100%;margin-top:18px;font-size:17px;padding:16px}
  .foco-prox{text-align:center;font-size:13px;color:var(--muted);margin:16px 0 4px;line-height:1.5}
  .foco-prox b{color:var(--txt);font-size:16px}
  .foco-nav{display:flex;gap:8px;margin-top:12px}
  .foco-nav .btn{flex:1;justify-content:center;text-align:center}
  .foco-card{position:relative}
  .foco-obs{position:absolute;top:12px;right:12px}
  /* ===== Card de parabéns no fim do treino (instagramável) ===== */
  .parabens-ov{position:fixed;inset:0;z-index:100000;background:rgba(6,8,10,.96);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;overflow:auto}
  .parabens-card{width:100%;max-width:360px;border-radius:26px;padding:40px 26px 30px;text-align:center;
    background:linear-gradient(165deg,#141a20,#0a0c0f);border:1px solid var(--line,#232830);color:var(--txt,#e8eaee);
    box-shadow:0 24px 70px rgba(0,0,0,.6);position:relative;overflow:hidden}
  .parabens-card::before{content:"";position:absolute;top:-110px;left:50%;transform:translateX(-50%);width:300px;height:300px;
    background:radial-gradient(circle,var(--accent,var(--pink,#7fff00)),transparent 62%);opacity:.20;pointer-events:none}
  .pb-emoji{font-size:56px;line-height:1;position:relative}
  .pb-title{font-size:26px;font-weight:900;margin-top:10px;letter-spacing:-.02em;position:relative}
  .pb-sub{color:var(--muted,#9aa0ab);font-weight:600;margin-top:4px;font-size:14px;position:relative}
  .pb-stats{display:flex;justify-content:center;gap:12px;margin:24px 0 6px;position:relative;flex-wrap:wrap}
  .pb-stat{background:rgba(255,255,255,.04);border:1px solid var(--line,#232830);border-radius:14px;padding:14px 12px;min-width:78px}
  .pb-stat b{display:block;font-size:27px;font-weight:900;line-height:1;color:var(--accent,var(--pink,#7fff00))}
  .pb-stat span{font-size:11px;font-weight:600;color:var(--muted,#9aa0ab);margin-top:4px;display:block}
  .pb-stars{color:var(--accent,var(--pink,#7fff00));font-size:20px;letter-spacing:3px;margin-top:10px;position:relative}
  .pb-frase{font-weight:700;font-size:15px;margin-top:18px;position:relative;line-height:1.45}
  .pb-brand{margin-top:24px;font-weight:900;font-size:20px;color:var(--txt,#e8eaee);opacity:.9;position:relative}
  .pb-brand span{color:var(--accent,var(--pink,#7fff00))}
  .pb-actions{display:flex;gap:12px;width:100%;max-width:360px}
  .pb-hint{color:var(--muted,#9aa0ab);font-size:12.5px;text-align:center}
  /* versão minimalista: saudação, frase em destaque, data e logo */
  .parabens-card{padding:48px 28px 36px}
  .pb-eyebrow{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted,#9aa0ab);position:relative}
  .pb-frase-big{font-size:clamp(24px,7vw,30px);font-weight:900;line-height:1.22;margin:20px 0 24px;letter-spacing:-.02em;position:relative}
  .pb-date{font-size:13px;color:var(--muted,#9aa0ab);font-weight:600;position:relative}
  .pb-logo-text{margin-top:30px;font-weight:900;font-size:22px;color:var(--txt,#e8eaee);opacity:.92;position:relative}
  .pb-logo-text span{color:var(--accent,var(--pink,#7fff00))}
  .pb-logo-img{margin-top:30px;max-height:46px;max-width:190px;object-fit:contain;position:relative;display:inline-block}
  /* nível de esforço (fim de treino) */
  .esf-ops{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
  .esf-op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card2,#171c22);
    border:1px solid var(--line,#2a2f37);border-radius:12px;padding:11px 13px;cursor:pointer;color:inherit;font:inherit;transition:.14s}
  .esf-op:hover{border-color:var(--accent,var(--pink,#7fff00))}
  .esf-op.sel{border-color:var(--accent,var(--pink,#7fff00));background:rgba(127,255,0,.08);box-shadow:0 0 0 1px var(--accent,var(--pink,#7fff00)) inset}
  .esf-emoji{font-size:26px;flex:0 0 auto;line-height:1}
  .esf-txt{display:flex;flex-direction:column}
  .esf-txt b{font-size:15px;font-weight:800}
  .esf-txt span{font-size:12px;color:var(--muted,#9aa0ab)}
  /* velocímetro de esforço */
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;margin:2px 0 12px;user-select:none;-webkit-user-select:none}
  .gauge-val{text-align:center;margin-top:-6px}
  .gauge-val b{font-size:36px;font-weight:900;display:block;line-height:1}
  .gauge-lbl{font-size:15px;font-weight:800}
  /* retorno dos treinos (visão do personal) */
  .retorno-lista{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .retorno-item{background:var(--card2,#171c22);border:1px solid var(--line,#2a2f37);border-radius:10px;padding:10px 12px}
  .retorno-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .retorno-data{font-size:12px;color:var(--muted,#9aa0ab);font-weight:600}
  .retorno-esf{font-size:13px;font-weight:800}
  .retorno-com{margin-top:6px;font-size:14px;font-style:italic;color:var(--txt,#e8eaee)}
  /* anotações inline (botão próprio) */
  .nota-inline{background:var(--card2,#171c22);border:1px solid var(--line,#2a2f37);border-radius:12px;padding:12px;margin-top:8px}
  .nota-inline-acoes{display:flex;align-items:center;gap:10px;margin-top:8px}
  .exec-timer{background:linear-gradient(120deg,var(--pink,#7fff00),var(--pink-deep,#5fbf00));color:#fff;font-weight:800;text-align:center;
    padding:12px;border-radius:14px;margin-bottom:12px;font-size:16px}
  .ex-card{background:var(--pk-surf,#15171c);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(180,90,140,.05)}
  /* histórico de treinos (aluno) */
  .hist-btn{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;margin:12px 0 0;
    background:transparent;border:1px dashed var(--line);color:var(--muted);border-radius:12px;
    padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .hist-btn:hover{border-color:var(--pink);color:var(--pink)}
  .hist-chev{transition:.15s}
  .hist-btn.open .hist-chev{transform:rotate(180deg)}
  #histTreinos{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:330px;overflow-y:auto;padding-right:4px}
  .hist-row{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(127,255,0,.03)}
  .hist-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hist-dia{font-weight:800;font-size:14px;flex:1}
  .hist-data{font-size:12px;color:var(--muted);font-weight:700}
  .hist-del{background:transparent;border:0;cursor:pointer;font-size:15px;opacity:.6;padding:0 2px;line-height:1}
  .hist-del:hover{opacity:1}
  .hist-meta{font-size:12px;color:var(--muted);margin-top:4px}
  /* fichas anteriores */
  #fichasAnt{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;padding-right:4px}
  .fa-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    background:transparent;border:1px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;color:var(--txt)}
  .fa-row:hover{border-color:var(--pink)}
  .fa-row.open .hist-chev{transform:rotate(180deg)}
  .fa-nome{font-weight:800;font-size:14px}
  .fa-det{padding:4px 4px 6px;display:flex;flex-direction:column;gap:10px}
  .fa-dia{border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:10px;padding:10px 12px}
  .fa-dia-tit{font-weight:800;font-size:13.5px;margin-bottom:6px}
  .fa-ex{font-size:13px;padding:3px 0;border-top:1px solid var(--line)}
  .fa-ex:first-of-type{border-top:none}
  .ex-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .ex-card-nome{font-weight:800;font-size:15px;flex:1;min-width:0}
  .ex-card-acoes{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .ex-card.done .ex-obs-btn{display:none}   /* some o comentário quando o exercício está feito */
  /* histórico de comentários no modal */
  .com-lista{max-height:34vh;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
  .com-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(127,255,0,.05)}
  .com-item-txt{font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .com-item-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
  .com-item-data{font-size:11px;color:var(--muted);font-weight:700}
  /* Fotos da avaliação física */
  .aval-fotos-prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .aval-foto{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--elev,#0e1216)}
  .aval-foto img{width:100%;height:100%;object-fit:cover;display:block}
  .aval-foto .rm{position:absolute;top:2px;right:2px;width:20px;height:20px;border:none;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .aval-fotos-view{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .aval-fotos-view a{width:88px;height:88px;border-radius:10px;overflow:hidden;border:1px solid var(--line);display:block;background:var(--elev,#0e1216)}
  .aval-fotos-view img{width:100%;height:100%;object-fit:cover;display:block}
  .com-del{border:none;background:none;cursor:pointer;font-size:15px;padding:2px 4px;line-height:1}
  .ex-obs-btn{border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;
    width:40px;height:40px;font-size:22px;font-weight:800;line-height:1;cursor:pointer;position:relative;flex:0 0 auto}
  .ex-obs-btn:hover,.ex-obs-btn.tem{border-color:var(--pink);color:var(--pink)}
  .ex-obs-btn.tem::after{content:"";position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;
    background:var(--pink);box-shadow:0 0 0 2px rgba(0,0,0,.45)}
  .ex-check{border:1.5px solid var(--line);background:var(--pk-surf,#15171c);border-radius:10px;width:40px;height:40px;
    font-size:18px;cursor:pointer;color:var(--muted);flex:0 0 auto;transition:.15s}
  .ex-check:hover{border-color:var(--pink)}
  .ex-card.done{background:#12160b;border-color:#bbeccb}
  .ex-card.done .ex-check{background:var(--pink);border-color:var(--pink);color:#0a0b0d;font-weight:800}
  .ex-card.done .ex-card-nome{color:#1a8a4a;text-decoration:line-through;text-decoration-color:#bbeccb}
  .ex-card.done .ex-detalhe{display:none}
  .ser-head{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;font-size:10px;font-weight:800;color:var(--muted);
    text-transform:uppercase;margin:12px 0 6px;text-align:center}
  .ser-row{display:grid;grid-template-columns:40px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
  .ser-num{font-weight:800;color:var(--pink-deep);text-align:center;font-size:13px}
  .ser-in{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center}
  .ser-in:focus{outline:2px solid var(--pink-deep,#5fbf00);border-color:var(--pink-deep,#5fbf00)}
  .ser-ok{border:1.5px solid var(--line);background:var(--pk-surf,#15171c);border-radius:10px;padding:10px 0;font-size:15px;cursor:pointer;color:var(--muted)}
  .ser-ok.done{background:#122110;border-color:#bbeccb;color:#1a8a4a;font-weight:800}
  .carga-linha{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .carga-linha label{font-size:12px;font-weight:700;color:var(--muted)}
  .carga-in{width:110px;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px;text-align:center;font-weight:700}
  .carga-in:focus{outline:2px solid var(--pink-deep,#5fbf00);border-color:var(--pink-deep,#5fbf00)}
  .carga-un{font-size:13px;color:var(--muted);font-weight:700}
  .exec-crono{font-size:12px;font-weight:800;color:var(--pink-deep);background:var(--pk-surf,#15171c);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;white-space:nowrap}
  /* acesso destacado ao treino (dashboard do aluno) */
  .treino-hero{background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));border:1px solid transparent;border-radius:16px;
    padding:20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .treino-hero .ico-big{font-size:38px;line-height:1}
  .treino-hero h3{margin:0 0 4px;color:var(--pink-deep)}
  .treino-hero p{margin:0;font-size:13px;color:var(--txt)}
  .treino-hero .btn{margin-top:0;min-width:210px;text-align:center;justify-content:center}
  @media(max-width:560px){ .treino-hero .btn{min-width:100%} }
  /* resumo de treinos disponíveis x último treinado */
  .treino-lista{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
  .treino-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;
    border:1px solid var(--line);background:var(--pk-surf,#15171c);border-radius:12px;padding:11px 14px;cursor:pointer;transition:.15s}
  .treino-linha:hover{border-color:var(--pink)}
  .treino-linha.sel{background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));border-color:transparent}
  .treino-linha .tl-nome{font-weight:800;font-size:14px;color:var(--txt)}
  .treino-linha .tl-ult{font-size:11.5px;color:var(--muted);margin-top:2px}
  .treino-linha .tl-seta{color:var(--pink-deep);font-weight:800}
  /* exercício na visão do aluno com imagem e descanso clicável */
  .ex-thumb-al{width:56px;height:56px;border-radius:12px;flex:0 0 auto;background:linear-gradient(135deg,var(--pk-surf2,#1d2027),var(--line,#262a33));
    display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
  .ex-thumb-al img{width:100%;height:100%;object-fit:cover}
  .tr-ex-row{display:flex;gap:12px;align-items:flex-start}
  .tr-ex-body{flex:1;min-width:0}
  .desc-btn{border:1px solid var(--pink);background:var(--pk-surf,#15171c);color:var(--pink-deep);border-radius:999px;
    padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:5px}
  .desc-btn:hover{background:#0a0b0d}
  .tr-obs{margin-top:8px;font-size:12.5px;line-height:1.5;color:var(--txt);background:#12140b;
    border-left:3px solid var(--pink);border-radius:0 10px 10px 0;padding:8px 11px}
  /* cronômetro flutuante de descanso (qualquer tela) */
  /* cronômetro de descanso: ocupa ~1/3 da tela, alto contraste (fácil de ver de longe) */
  .desc-float{position:fixed;left:0;right:0;bottom:0;z-index:80;
    min-height:33vh;background:var(--pink);color:#0a0b0d;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:restSlideUp .32s cubic-bezier(.18,.85,.25,1)}
  @keyframes restSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  /* enquanto o descanso ocupa a parte de baixo, dá espaço p/ rolar e ver o fim da página */
  body.com-descanso{padding-bottom:38vh}
  .desc-float .df-lbl{font-size:18px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
  .desc-float .df-num{font-size:min(30vw,180px);line-height:.95;font-weight:800;font-variant-numeric:tabular-nums}
  .desc-float .df-un{font-size:16px;font-weight:700;opacity:.75;margin-top:-4px}
  .desc-float .df-parar{margin-top:16px;background:#0a0b0d;color:var(--pink);border:none;
    border-radius:12px;padding:12px 30px;font-weight:800;font-size:16px;cursor:pointer}
  /* modal (sair do treino) */
  .modal-ov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.68);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-cx{background:var(--pk-surf,#15171c);border-radius:18px;padding:22px;max-width:340px;width:100%;
    box-shadow:0 20px 50px rgba(30,20,40,.3)}
  .modal-cx h3{font-size:17px;font-weight:800;color:var(--pink-deep)}
  /* modo treino: esconde menu lateral e saudação, foca só no treino */
  .modo-treino .sidebar,
  .modo-treino .hello,
  .modo-treino .role-chip{display:none !important}
  .modo-treino .shell{grid-template-columns:1fr}
  /* pílula "treino em andamento" (fora da tela de execução) */
  .treino-pill{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;
    display:flex;align-items:center;gap:16px;background:var(--pk-surf,#15171c);border:3px solid var(--pink,#7fff00);
    border-radius:18px;padding:18px 18px 18px 24px;outline:2px solid rgba(127,255,0,.45);outline-offset:2px;
    box-shadow:0 0 0 3px rgba(127,255,0,.35), 0 0 26px rgba(127,255,0,.6), 0 16px 44px rgba(0,0,0,.6);width:min(96%,560px)}
  .treino-pill .tp-lbl{font-size:17px;font-weight:800;color:var(--pink-deep)}
  .treino-pill .tp-crono{font-size:34px;font-weight:800;color:var(--txt);font-variant-numeric:tabular-nums;margin-left:auto}
  .treino-pill .tp-go{border:none;background:linear-gradient(120deg,var(--pink,#7fff00),var(--pink-deep,#5fbf00));color:#fff;
    font-weight:800;border-radius:14px;padding:14px 24px;cursor:pointer;font-size:16px}
  .treino-pill .tp-x{border:none;background:var(--pk-surf2,#1d2027);color:var(--muted);border-radius:50%;
    width:40px;height:40px;font-size:16px;cursor:pointer;font-weight:800;flex:0 0 auto}
  /* alerta de fim de descanso: o verde SOBE do painel (33vh) e preenche a tela inteira */
  .rest-done-ov{position:fixed;inset:0;z-index:90;padding:24px;
    background:var(--pink);
    display:flex;align-items:center;justify-content:center;animation:restFill .5s cubic-bezier(.2,.85,.2,1)}
  @keyframes restFill{from{clip-path:inset(67% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
  .rest-done-cx{text-align:center;color:#0a0b0d;animation:restFade .3s ease .3s both}
  .rest-done-ico{width:140px;height:140px;margin:0 auto;border-radius:50%;
    background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;
    font-size:82px;font-weight:800;animation:restPop .4s ease .3s both}
  .rest-done-txt{font-size:28px;font-weight:800;margin-top:16px}
  .rest-done-sub{font-size:15px;opacity:.92;margin:6px 0 18px}
  .rest-done-passou{font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.9;margin:0 0 24px;line-height:1.5}
  .rest-done-passou b{font-size:34px;font-weight:800;display:block;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:0}
  .rest-done-cx .btn{background:var(--pk-surf,#15171c);color:var(--pink-deep);font-size:17px;font-weight:800;padding:15px 34px}
  @keyframes restFade{from{opacity:0}to{opacity:1}}
  @keyframes restPop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  /* avaliação do treino */
  .rate-stars{display:flex;justify-content:center;gap:6px;margin:4px 0 6px}
  .rate-star{background:none;border:none;font-size:38px;line-height:1;cursor:pointer;color:#e5d3e0;transition:.12s;padding:0}
  .rate-star.on{color:#f59e0b}
  .rate-star:hover{transform:scale(1.08)}
  .rate-lbl{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px;min-height:18px}
  .rate-txt{width:100%;min-height:88px;padding:11px;border:1px solid var(--line);border-radius:12px;font-size:14px;
    font-family:inherit;resize:vertical;margin-bottom:6px}
  .rate-txt:focus{outline:2px solid var(--pink-deep,#5fbf00);border-color:var(--pink-deep,#5fbf00)}
  .empty{font-size:13px;color:var(--muted);padding:8px 0}
  /* desempenho / retenção (profissional) */
  .ret-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:560px){ .ret-cards{grid-template-columns:1fr 1fr} }
  .ret-card{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
  .ret-card:hover{filter:brightness(.98)}
  .ret-card.sel{outline:2px solid var(--pink-deep);outline-offset:1px}
  .ret-card .rc-num{font-size:24px;font-weight:800;line-height:1}
  .ret-card .rc-lbl{font-size:11.5px;font-weight:700;margin-top:3px}
  .ret-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;background:var(--pk-surf,#15171c)}
  .ret-row .rr-nome{font-weight:800;font-size:14px}
  .ret-row .rr-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .ret-badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .ades-row{margin-bottom:12px}
  .ades-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
  .ades-num{font-size:13px;font-weight:800;color:var(--txt)}
  .qt-tog{background:transparent;border:0;color:var(--muted);font-weight:800;font-size:13px;padding:8px 16px;cursor:pointer}
  .qt-tog.on{background:var(--accent,var(--pink,#7fff00));color:#0a0b0d}
  .qt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;background:var(--pk-surf,#15171c)}
  .qt-row .rr-nome{font-weight:800;font-size:14px}
  .qt-num{font-size:13px;font-weight:800;color:var(--accent,var(--pink,#7fff00));white-space:nowrap}
  .prazo-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:transparent;border:0;color:var(--txt,#e8eaee);font-weight:800;font-size:16px;cursor:pointer;padding:2px 0}
  .prazo-badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;
    margin-left:6px;border-radius:999px;background:#ff6b6b;color:#0a0b0d;font-size:12px;font-weight:800;vertical-align:middle}
  .prazo-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;
    background:var(--card2,#12161b);border:1px solid var(--line,#2a2f37);border-radius:10px;padding:8px 12px}
  .prazo-edit select{background:var(--card,var(--pk-surf,#0f1216));color:var(--txt,#e8eaee);border:1px solid var(--line,#2a2f37);border-radius:8px;padding:6px 8px;font-size:13px}
  .grupos-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .grp-chip{background:var(--card2,#12161b);border:1px solid var(--line,#2a2f37);color:var(--txt,#e8eaee);
    border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer}
  .grp-chip.on{background:var(--accent,var(--pink,#7fff00));border-color:var(--accent,var(--pink,#7fff00));color:#0a0b0d}
  .grp-chip.add{font-weight:800;padding:6px 12px}
  .grp-chip.ghost{background:transparent;color:var(--muted);font-weight:600}
  .grupos-lista{display:flex;flex-direction:column;gap:8px}
  .grupo-row{display:flex;align-items:center;gap:8px}
  .grupo-nome{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pk-surf2,#1d2027);border:1px solid var(--line,#262a33);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--txt,#e8eaee)}
  .gn-nome{font-weight:700;font-size:15px}
  .gn-count{font-size:12px;color:var(--muted)}
  .grupo-acao{background:transparent;border:1px solid var(--line,#262a33);border-radius:10px;width:40px;height:40px;cursor:pointer;color:var(--muted);font-size:15px}
  .grupo-acao:hover{border-color:var(--pink,#7fff00);color:var(--pink,#7fff00)}
  .grupos-aluno-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 4px}
  .grupos-aluno{display:inline-flex;gap:6px;flex-wrap:wrap}
  .email-help-wrap{position:relative;display:inline-flex}
  .email-help{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:11px;font-weight:800;cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .email-info{display:none;position:absolute;right:0;top:24px;z-index:30;background:var(--pk-surf,#15171c);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:12px;color:var(--txt);width:220px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .email-info.show{display:block}
  .ades-bar{height:9px;border-radius:999px;background:#eee;overflow:hidden}
  .ades-fill{height:100%;border-radius:999px;transition:width .3s}
  .treino-resumo-al{font-size:12.5px;color:var(--txt);background:var(--pk-surf2,#1d2027);border:1px solid var(--line);
    border-radius:10px;padding:8px 11px;margin:2px 0 10px}
  .treino-resumo-al b{color:var(--pink-deep)}
  .wk-mini{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:0 4px}
  .wk-lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .wk-row{display:flex;gap:5px;flex-wrap:wrap}
  .wk-sq{min-width:42px;height:34px;padding:0 4px;border-radius:7px;border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}
  .wk-sq.pre{background:transparent!important;color:var(--muted)!important;border-style:dashed}
  .wk-sq.atual{outline:1.5px solid var(--pink-deep);outline-offset:1px}
  .assess-item{font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .assess-item:last-child{border-bottom:none}
  .assess-item b{color:var(--pink-deep)}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-weight:800;font-size:18px;line-height:1}

  /* avaliações e consultas do aluno */
  .aval{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--pk-surf,#15171c)}
  .aval-head{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px}
  .meds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .med{background:var(--pk-surf2,#1d2027);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;
       display:flex;gap:7px;align-items:center;justify-content:space-between}
  @media(max-width:520px){ .meds{grid-template-columns:1fr} }
  .aval-body{display:none;margin-top:12px}
  .aval.open .aval-body{display:block}
  .chev{border:none;background:none;cursor:pointer;color:var(--pink-deep);font-size:13px;line-height:1;
        padding:4px 6px;border-radius:8px;transition:transform .18s ease}
  .chev:hover{background:var(--pk-surf2,#1d2027)}
  .aval.open .chev{transform:rotate(90deg)}
  .med span{color:var(--muted);font-weight:600}
  .med b{color:var(--pink-deep);font-weight:800}
  .dif{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:-4px}
  .dif.up{background:#2a1416;color:#be123c}
  .dif.down{background:#122110;color:#1a8a4a}
  .obs{margin-top:11px;font-size:13px;line-height:1.55;color:var(--txt);background:#12140b;border-left:3px solid var(--pink);border-radius:0 10px 10px 0;padding:10px 12px}
  .meta-sm{font-size:12px;color:var(--muted);margin-top:8px}
  .proxima{background:linear-gradient(120deg,var(--pk-surf2,#1d2027),var(--line,#262a33));border-radius:14px;padding:18px}
  .proxima .quando{font-size:19px;font-weight:800;color:var(--pink-deep)}

  /* menu de 3 pontinhos */
  .menu-wrap{position:relative;display:inline-block}
  .top-tiles{display:flex;align-items:center;gap:6px}
  .menu-anchor{position:relative;display:inline-flex;flex-direction:column;align-items:center}
  .menu-drop{display:none;position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 8px);z-index:30;background:var(--pk-surf,#15171c);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(120,60,100,.16);
    min-width:170px;overflow:hidden;padding:4px}
  .menu-drop.open{display:block}
  .menu-drop button{display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
    padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--txt);border-radius:9px}
  .menu-drop button:hover{background:var(--pk-surf2,#1d2027);color:var(--pink-deep)}
  .dots{font-size:16px;line-height:1;letter-spacing:1px}
  .card.cta{background:linear-gradient(135deg,var(--pk-surf2,#1d2027),var(--line,#262a33));border:1px solid var(--pink-deep,#5fbf00)}
  .card.cta p{color:#c7ccd6}

  /* formulário de avaliação */
  .form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  /* biblioteca de exercícios: filtros numa linha só (rola na horizontal) */
  #exFiltros{ -ms-overflow-style:none; scrollbar-width:thin }
  #exFiltros .chip-f{ flex:0 0 auto; white-space:nowrap }
  /* montagem do treino: seletor de exercícios por grupo muscular */
  .fx-picker{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .fx-pick-tit{font-size:13px;font-weight:800;margin:0 0 8px}
  .fx-pick-busca{width:100%;max-width:280px;margin-bottom:10px}
  .fx-grupos{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
  .fx-grupos .chip-f{flex:0 0 auto;white-space:nowrap}
  .fx-pick-lista{display:flex;flex-wrap:wrap;gap:8px}
  .fx-added{margin-top:16px}
  /* caixa de bi-set na montagem: os dois exercícios lado a lado, área bem destacada */
  .biset-box{border:2px solid var(--pink);border-radius:14px;padding:10px;margin:0 0 12px;background:rgba(127,255,0,.05)}
  .biset-box-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px}
  .biset-box-head span{font-size:11px;font-weight:800;color:var(--pink);text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
  .biset-box-cards{display:flex;gap:10px;align-items:stretch}
  .biset-box-cards .fx-row{flex:1 1 0;min-width:0;margin-bottom:0;background:rgba(0,0,0,.22)}
  .biset-box-cards .fx-campos{flex-direction:column;gap:8px}
  .biset-box-cards .fx-campos label{width:100%}
  .biset-box-cards .fx-campos label.fx-series input,
  .biset-box-cards .fx-campos label.fx-carga input,
  .biset-box-cards .fx-campos label input{width:100%}
  @media(max-width:560px){ .biset-box-cards{flex-direction:column} }
  .fx-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .fx-edit-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .fx-move{display:flex;gap:4px;align-items:center}
  .fx-move .btn{padding:5px 8px;font-size:12px}
  .fx-pick-item{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--txt);cursor:pointer;text-align:left;transition:.12s}
  .fx-pick-item:hover{border-color:var(--pink);color:var(--pink)}
  .fpi-nome{font-weight:700;font-size:13px}
  .fpi-grp{font-size:11px;color:var(--muted)}
  /* popup "Adicionar exercícios" — lista vertical limpa, sem bagunça */
  /* altura fixa: a modal não "recentraliza" a cada clique — cabeçalho fica estático */
  #pickerOv .modal-cx{padding:18px;height:min(82vh,640px)}
  /* só a lista cresce/rola; cabeçalho, busca e chips mantêm a altura (não encolhem "pela metade") */
  #pickerOv .modal-cx > *{flex:0 0 auto}
  #pickerOv .fx-pick-busca{width:100%;max-width:none;margin:0 0 10px}
  #pickerOv .fx-grupos{flex:0 0 auto;align-items:center;min-height:38px;margin:0 0 10px}
  #pickerOv .fx-grupos .chip-f{align-self:center}
  #pickerOv .fx-pick-lista{display:flex;flex-direction:column;flex-wrap:nowrap;gap:6px;flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:4px}
  #pickerOv .fx-pick-item{flex-direction:row;align-items:center;justify-content:space-between;width:100%;gap:12px;padding:11px 14px}
  #pickerOv .fx-pick-item::after{content:"＋";font-size:16px;font-weight:800;color:var(--pink);flex:0 0 auto}
  #pickerOv .fpi-nome{font-size:14px;flex:1 1 auto;min-width:0}
  #pickerOv .fpi-grp{text-align:right;flex:0 0 auto;white-space:nowrap;margin-left:auto}
  .grupo{margin-top:16px}
  .grupo-tit{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
    padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
  @media(max-width:520px){ .form-grid2{grid-template-columns:1fr} }
  /* Relação Cintura-Quadril */
  .rcq-box{background:var(--pk-surf2,#1d2027);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .rcq-box .grupo-tit{border-bottom:none;margin-bottom:0;padding-bottom:0;color:var(--txt);text-transform:none}
  .rcq-box .grupo-tit > span:first-child{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .rcq-help{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--pk-surf,#15171c);

  function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

  function cpfValido(cpf){
    cpf = soDigitos(cpf);
    if(cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
    let s=0; for(let i=0;i<9;i++) s+=parseInt(cpf[i])*(10-i);
    let d1=(s*10)%11; if(d1===10) d1=0; if(d1!==parseInt(cpf[9])) return false;

          <div style="text-align:center;margin-top:8px"><a id="gateCpfCorr" class="link muted" style="display:none;cursor:pointer">Corrigir CPF</a></div>
        </div>`;
      document.body.appendChild(ov);
      const inp = ov.querySelector("#gateCpf");
      const btn = ov.querySelector("#gateCpfBtn");
      const msg = ov.querySelector("#gateCpfMsg");
      const corr = ov.querySelector("#gateCpfCorr");
      inp.focus();
      let etapa = "input";
      corr.onclick = ()=>{
        etapa = "input"; inp.disabled = false; inp.focus();
        msg.className = "msg"; msg.textContent = "";
        btn.textContent = "Continuar"; corr.style.display = "none";
      };
      btn.onclick = async ()=>{
        const raw = soDigitos(inp.value);
        if(etapa === "input"){
          if(!cpfValido(raw)){ msg.className="msg err"; msg.textContent="Digite um CPF válido."; return; }
          etapa = "confirm"; inp.disabled = true;
          msg.className = "msg warn";
          msg.innerHTML = `Confirme: seu CPF é <b>${mascaraCpf(raw)}</b>? A alteração depois é feita <b>somente pelo suporte</b>, então confira com atenção.`;
          btn.textContent = "Confirmar e continuar";
          corr.style.display = "inline";
          return;
        }
        btn.disabled = true; msg.className="msg"; msg.textContent="Salvando…";
        // regra: cada CPF só pode ter uma conta de aluno
        const voltarInput = ()=>{ btn.disabled=false; etapa="input"; inp.disabled=false; corr.style.display="none"; btn.textContent="Continuar"; };
        try{
          const { data: emUso } = await sb.rpc("cpf_em_uso", { p_cpf: raw, p_categoria: "aluno" });
          if(emUso){ voltarInput(); msg.className="msg err";
            msg.innerHTML = "Já existe uma conta de aluno com esse CPF. Se essa conta é sua, saia e entre com o e-mail dela — cada CPF pode ter só uma conta de aluno.";
            return; }
        }catch(_){}
        const { error } = await sb.from("profiles").update({ cpf: raw }).eq("id", ME.id);
        if(error){
          voltarInput(); msg.className="msg err";
          msg.textContent = /cpf_categoria_uniq|duplicate|23505/i.test(error.message||"")
            ? "Já existe uma conta de aluno com esse CPF. Entre com o e-mail dessa conta."
            : ("Erro: "+error.message);
          return;
        }
        ME.cpf = raw; ov.remove(); resolve();
      };
    });
  }

  /* ================= INÍCIO ================= */
  function telaPrimeiroAcesso(token){
    const o = document.createElement("div"); o.className="modal-ov"; o.style.zIndex="99999";
    o.innerHTML = `<div class="modal-cx" style="max-width:400px">
      <div style="text-align:center;margin:0 0 12px;font-weight:800;font-style:italic;font-size:22px;letter-spacing:1px;color:#fff">P<span style="color:var(--pink,#7fff00)">ii</span>k</div>
      <h3 style="margin:0 0 6px;text-align:center">Bem-vindo! Defina sua senha</h3>
      <p class="meta-sm" style="margin:0 0 14px;text-align:center">Crie uma senha para acessar seu treino. Da próxima vez, você entra com seu e-mail e essa senha.</p>
      <div class="field"><label>Nova senha</label><input id="pa1" type="password" placeholder="mín. 6 caracteres"></div>
      <div class="field" style="margin-top:8px"><label>Confirmar senha</label><input id="pa2" type="password" placeholder="repita a senha"></div>
      <button class="btn" style="width:100%;margin-top:12px" id="paBtn">Definir senha e entrar</button>
      <div class="msg" id="paMsg" style="margin-top:8px"></div>
    </div>`;
    document.body.appendChild(o);
    const btn=o.querySelector("#paBtn"), msg=o.querySelector("#paMsg");
    btn.onclick = async ()=>{
      const p1=o.querySelector("#pa1").value, p2=o.querySelector("#pa2").value;
      if(p1.length<6){ msg.className="msg err"; msg.textContent="A senha precisa ter ao menos 6 caracteres."; return; }
      if(p1!==p2){ msg.className="msg err"; msg.textContent="As senhas não coincidem."; return; }
      btn.disabled=true; msg.className="msg"; msg.textContent="Definindo…";
      const resp = await sb.functions.invoke("ativar-acesso", { body:{ token, senha:p1 } });
      let errMsg="";
      if(resp.data && resp.data.error) errMsg=resp.data.error;
      if(resp.error){ try{ const b=await resp.error.context.json(); if(b&&b.error) errMsg=b.error; }catch(_){}; if(!errMsg) errMsg=resp.error.message; }
      if(errMsg || !(resp.data && resp.data.ok)){ btn.disabled=false; msg.className="msg err"; msg.textContent=errMsg||"Não consegui ativar o acesso."; return; }
      const emailAluno = resp.data.email;
      const { error: eLogin } = await sb.auth.signInWithPassword({ email: emailAluno, password: p1 });
      if(eLogin){ btn.disabled=false; msg.className="msg err"; msg.textContent="Senha definida! Vá para a tela de login e entre com seu e-mail e a senha que você criou."; return; }
      location.href = location.origin + location.pathname;
    };
  }

  async function init(){
    // Primeiro acesso por link (aluno pré-criado pelo personal): ?acesso=<token>
    const _acesso = new URLSearchParams(location.search).get("acesso");
    if(_acesso){ telaPrimeiroAcesso(_acesso); return; }

    let { data:{ session } } = await sb.auth.getSession();
    if(!session){
      session = await new Promise(res=>{
        const t=setTimeout(()=>res(null), 2500);
        sb.auth.onAuthStateChange((_e,s)=>{ if(s){ clearTimeout(t); res(s); } });
      });
    }
    if(!session){ location.href = "login.html"; return; }
    marcarInicio();
    if(await expirouSessao()) return;
    const user = session.user;
    let { data: profile } = await sb.from("profiles").select("*").eq("id", user.id).single();
    if(!profile){
      // conta recém-criada (auto-cadastro): garante um perfil no banco (aluno, plano Light)
      const meta = user.user_metadata || {};
      const novo = {
        id:user.id, role:(meta.role === "professional" ? "professional" : "student"),
        status:"active", plano:"light",
        full_name: meta.full_name || null,
        cpf: meta.cpf || null,
        email:user.email
      };
      try{
        const { data: ins } = await sb.from("profiles").insert(novo).select().single();
        profile = ins || novo;
      }catch(e){ profile = novo; }
    }
    ME = { ...profile, email: user.email };
    // preenche o CPF a partir do cadastro (metadados) se ainda não estiver salvo no perfil
    if(!ME.cpf && user.user_metadata && user.user_metadata.cpf){
      try{ await sb.from("profiles").update({ cpf:user.user_metadata.cpf }).eq("id", ME.id); ME.cpf = user.user_metadata.cpf; }catch(e){}
    }
    // conta já excluída → sem acesso
    if(ME.deletado_em){
      await sb.auth.signOut();
      location.href = "login.html?conta=excluida";
      return;
    }
    // exclusão pendente (dentro dos 30 dias) → pergunta se quer cancelar e continuar
    if(ME.delecao_solicitada_at){
      const ok = await piikConfirm({
        titulo:"Exclusão de conta pendente",
        msg:"Você solicitou a exclusão da sua conta. Se prosseguir, a exclusão será <b>cancelada</b> e sua conta volta ao normal.",
        ok:"Prosseguir e cancelar exclusão", cancel:"Sair"
      });
      if(ok){ try{ await sb.rpc("cancelar_exclusao_conta"); ME.delecao_solicitada_at = null; }catch(e){} }
      else { await sb.auth.signOut(); location.href = "login.html"; return; }
    }
    // aluno sem CPF (cadastrado pelo personal / conta antiga) → exige o CPF para continuar
    if(ME.role === "student" && (ME.status||"active") === "active" && !ME.cpf){
      await pedirCpfObrigatorio();
    }
    // aluno: só mostra "Meu treino" se o profissional já montou algum treino
    if(ME.role === "student"){
      const { count } = await sb.from("ficha_dias").select("id",{count:"exact",head:true}).eq("student_id", ME.id);
      ALUNO_TREINO = (count||0) > 0;
    }
    // profissional voltando do dashboard de um aluno (?aluno=<id>): reabrir esse aluno
    const alunoParam = new URLSearchParams(location.search).get("aluno");
    if(ME.role !== "student" && alunoParam) PENDING_SELECT = alunoParam;
    if(ME.role === "creator"){ montarPainelGestao(); return; }
    montar();
    aberturaPosLogin();
    checarConsentimentoContato();
  }

  async function carregarKpisGestao(){
    const el=document.getElementById("gestKpis"); if(!el) return;
    let perfis=[];
    try{
      const { data } = await sb.from("profiles")
        .select("id, role, plano, embaixador, professional_id, deletado_em, is_demo, created_at, assinatura_status");
      perfis=(data||[]).filter(u=>!u.is_demo);
    }catch(e){}
    const ativos = perfis.filter(u=>!u.deletado_em);
    const personais = ativos.filter(u=>u.role==="professional");
    const alunos = ativos.filter(u=>u.role==="student");
    const pagantes = personais.filter(u=>["fit","you_piik","pro"].includes((u.plano||"").toLowerCase()) && (u.assinatura_status||"")!=="cancelado");
    const embs = ativos.filter(u=>u.role==="professional" && u.embaixador===true);
    const now=new Date(); const mesIni=new Date(now.getFullYear(),now.getMonth(),1).getTime();
    const cadMes = ativos.filter(u=>u.created_at && new Date(u.created_at).getTime()>=mesIni).length;

    // ativação dos embaixadores (>=3 alunos + >=1 treino)
    const alunosPorProf={};
    ativos.forEach(u=>{ if(u.professional_id) alunosPorProf[u.professional_id]=(alunosPorProf[u.professional_id]||0)+1; });
    const embIds = embs.map(e=>e.id);
    const treinosPorProf={};
    try{ if(embIds.length){ const { data:fis } = await sb.from("fichas").select("professional_id").in("professional_id",embIds);
      (fis||[]).forEach(f=>{ if(f.professional_id) treinosPorProf[f.professional_id]=(treinosPorProf[f.professional_id]||0)+1; }); } }catch(e){}
    const embAtivados = embs.filter(e=>(alunosPorProf[e.id]||0)>=3 && (treinosPorProf[e.id]||0)>=1).length;
    const taxaAtiv = embs.length ? Math.round(100*embAtivados/embs.length) : 0;

    // e-mails enviados (email_log)
    let emailsTotal=0, emailsMes=0;
    try{ const { data:logs } = await sb.from("email_log").select("created_at");
      emailsTotal=(logs||[]).length;
      emailsMes=(logs||[]).filter(l=>l.created_at && new Date(l.created_at).getTime()>=mesIni).length; }catch(e){}

    const kpi=(v,l,s,soft)=>'<div class="kpi'+(soft?' soft':'')+'"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';
    el.innerHTML =
      kpi(personais.length,"Personais","ativos no Piik") +
      kpi(pagantes.length,"Pagantes","Fit + You Piik") +
      kpi(alunos.length,"Alunos","ativos") +
      kpi(cadMes,"Cadastros no mês","novos perfis") +
      kpi(embs.length,"Embaixadores","marcados") +
      kpi(embAtivados+"/"+embs.length,"Ativação embaixadores",taxaAtiv+"% cumpriram a meta") +
      kpi(emailsTotal,"E-mails enviados",emailsMes+" neste mês") +
      kpi("—","Lista de espera","captura ainda não criada",true) +
      kpi("—","Trial → pagante","precisa rastrear pagamentos",true) +
      kpi("—","Churn mensal","precisa rastrear pagamentos",true) +
      kpi("—","CAC","precisa rastrear investimento",true);
  }

  function piikConfirm(opts){
    if(typeof opts === "string") opts = { msg: opts };
    return new Promise(res=>{
      const o=document.createElement("div"); o.className="modal-ov";
      o.innerHTML=`<div class="modal-cx" style="max-width:380px">
        <div style="text-align:center;margin:0 0 12px;font-weight:800;font-style:italic;font-size:22px;letter-spacing:1px;color:#fff">P<span style="color:var(--pink,#7fff00)">ii</span>k</div>

        ${opts.msg?`<p class="meta-sm" style="margin:0 0 18px;text-align:center">${opts.msg}</p>`:`<div style="height:10px"></div>`}
        <button class="btn" style="width:100%;margin-bottom:8px" id="lcOk">${opts.ok||"Confirmar"}</button>
        <button class="btn ghost" style="width:100%" id="lcNo">${opts.cancel||"Cancelar"}</button>
      </div>`;
      document.body.appendChild(o);
      const done=v=>{ o.remove(); res(v); };
      o.querySelector("#lcOk").onclick=()=>done(true);
      o.querySelector("#lcNo").onclick=()=>done(false);
      o.addEventListener("click",e=>{ if(e.target===o) done(false); });
    });
  }

      const resp = await fetch(SUPABASE_URL + "/functions/v1/aprovar-vinculo", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+session.access_token },
        body: JSON.stringify({ vinculo_id: id })

      const data = await resp.json().catch(()=>({}));
      if(!resp.ok || !data.ok){ await piikAlert({ titulo:"Não consegui aprovar", msg:(data.error||("erro "+resp.status)) }); return; }
      await piikAlert({ emoji:"💪", titulo:"Vínculo aprovado!", msg:`Agora você treina com <b>${prof}</b>.` });

  // Eleva a sessão para AAL2 usando o código do app autenticador (necessário p/ trocar senha com 2FA ligado)
  async function elevarAAL2(code){
    try{
      const { data: fdata, error: ferr } = await sb.auth.mfa.listFactors();
      if(ferr) return { ok:false, erro:ferr.message };
      const totp = (fdata && fdata.totp && fdata.totp[0]) || null;
      if(!totp) return { ok:false, erro:"Nenhum fator de 2FA encontrado nesta conta." };
      const { data: ch, error: cerr } = await sb.auth.mfa.challenge({ factorId: totp.id });
      if(cerr) return { ok:false, erro:cerr.message };
      const { error: verr } = await sb.auth.mfa.verify({ factorId: totp.id, challengeId: ch.id, code });
      if(verr) return { ok:false, erro:"Código inválido. Confira no app autenticador e tente de novo." };
      return { ok:true };
    }catch(e){ return { ok:false, erro:String(e && e.message || e) }; }
  }
  async function definirSenha(){
    const p1=document.getElementById("np1").value, p2=document.getElementById("np2").value;
    const msg=document.getElementById("pwMsg"), btn=document.getElementById("pwBtn");
    const mfaWrap=document.getElementById("npMfaWrap"), mfaInp=document.getElementById("npMfa");
    if(p1.length<6){ msg.className="msg err"; msg.textContent="A senha precisa ter ao menos 6 caracteres."; return; }
    if(p1!==p2){ msg.className="msg err"; msg.textContent="As senhas não coincidem."; return; }
    btn.disabled=true; msg.className="msg"; msg.textContent="";
    try{
      // Se o campo de 2FA está visível, primeiro eleva a sessão com o código
      if(mfaWrap && mfaWrap.style.display!=="none"){
        const code=((mfaInp&&mfaInp.value)||"").replace(/\D/g,"");
        if(code.length<6){ btn.disabled=false; msg.className="msg err"; msg.textContent="Digite o código de 6 dígitos do app autenticador."; return; }
        msg.className="msg"; msg.textContent="Verificando o código…";
        const el=await elevarAAL2(code);
        if(!el.ok){ btn.disabled=false; msg.className="msg err"; msg.textContent="Erro no 2FA: "+el.erro; return; }
      }
      const { error } = await sb.auth.updateUser({ password:p1 });
      if(error){
        // 2FA exigido: revela o campo do código e pede pra salvar de novo
        if(/AAL2|aal2|MFA|assurance|factor/i.test(error.message||"")){
          if(mfaWrap) mfaWrap.style.display="";
          btn.disabled=false; msg.className="msg"; msg.textContent="Sua conta tem verificação em 2 fatores. Digite o código de 6 dígitos do seu app autenticador e toque em Salvar de novo.";
          if(mfaInp) mfaInp.focus();
          return;
        }
        btn.disabled=false; msg.className="msg err"; msg.textContent="Erro: "+error.message; return;
      }
      btn.disabled=false;
      msg.className="msg ok"; msg.textContent="Senha salva! Já pode entrar com e-mail e senha.";
      document.getElementById("np1").value=""; document.getElementById("np2").value="";
      if(mfaInp) mfaInp.value=""; if(mfaWrap) mfaWrap.style.display="none";
    }catch(e){ btn.disabled=false; msg.className="msg err"; msg.textContent="Erro: "+String(e && e.message || e); }
  }

  async function renderHistorico(){
    const box = document.getElementById("histTreinos"); if(!box) return;
    box.innerHTML = `<div class="empty">Carregando…</div>`;
    const { data: sess, error } = await sb.from("sessoes")
      .select("id,data,fim,dia_id,ficha_dias(label)")
      .eq("student_id", ME.id).eq("finalizada", true)
      .order("data", { ascending:false }).limit(200);
    if(error){ box.innerHTML = `<div class="empty">Não consegui carregar o histórico.</div>`; return; }
    if(!sess || !sess.length){ box.innerHTML = `<div class="empty">Você ainda não finalizou nenhum treino.</div>`; return; }
    const p = n => String(n).padStart(2,"0");
    const hh = d => d ? p(d.getHours())+":"+p(d.getMinutes()) : "—";
    const dm = d => p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2);
    box.innerHTML = sess.map(s=>{
      const ini = new Date(s.data);
      const fim = s.fim ? new Date(s.fim) : null;
      const durSeg = fim ? Math.max(0, Math.round((fim-ini)/1000)) : null;
      const durTxt = durSeg!=null ? (Math.floor(durSeg/60)+" min"+(durSeg%60?" "+(durSeg%60)+"s":"")) : "—";
      const label = (s.ficha_dias && s.ficha_dias.label) ? s.ficha_dias.label : "Treino";
      return `<div class="hist-row">
          <div class="hist-top"><span class="hist-dia">${esc(label)}</span><span class="hist-data">${dm(ini)}</span>
            <button class="hist-del" title="Excluir este treino" onclick="excluirTreino('${s.id}')">🗑️</button></div>
          <div class="hist-meta">início ${hh(ini)} · fim ${hh(fim)} · ${durTxt}</div>
        </div>`;
    }).join("");
  }

  // "há X dias" a partir de uma data
  function haQuantoTempo(v){
    if(!v) return null;
    const d = new Date(v); if(isNaN(d)) return null;
    const dias = Math.floor((Date.now() - d.getTime())/86400000);
    if(dias <= 0) return "hoje";
    if(dias === 1) return "ontem";
    return "há " + dias + " dias";
  }

  async function carregarMeuTreino(){
    const { data: fichas } = await sb.from("fichas").select("*").eq("student_id", ME.id).eq("ativa", true).limit(1);
    const box = document.getElementById("treinoBoxAluno");
    if(!fichas || !fichas.length){ if(box) box.innerHTML = `<div class="empty">Seu personal ainda não montou um treino.</div>`; return; }
    const ficha = fichas[0];
    { const me = document.getElementById("treinoMontadoEm");
      if(me) me.textContent = ficha.created_at ? ("Montado pelo seu personal em " + fmtDataCurta(ficha.created_at)) : ""; }
    const { data: dias } = await sb.from("ficha_dias").select("*").eq("ficha_id", ficha.id).order("ordem");

    renderResumoTreinos();
    renderAlunoExs();
    await retomarTreinoLS();

  // retoma um treino em andamento após recarregar a página (via localStorage)
  async function retomarTreinoLS(){
    if(EXEC_SESSAO) { atualizarPill(); return; }
    let t; try{ t = JSON.parse(localStorage.getItem("treino_ativo")||"null"); }catch(e){ t=null; }
    if(!t || !t.id) return;
    const { data: s } = await sb.from("sessoes").select("*").eq("id", t.id).single();
    if(!s || s.finalizada){ limparTreinoLS(); return; }
    const dia = ALUNO_DIAS.find(d=>d.id===t.diaId);
    if(!dia){ limparTreinoLS(); return; }
    EXEC_SESSAO = s; EXEC_INICIO = t.inicio || Date.now();
    EXEC_DIA = dia; EXEC_EXS = ALUNO_EXS.filter(x=>x.dia_id===t.diaId);
    EXEC_FEITOS = new Set(); EXEC_LOGS = {};
    // recupera as cargas já registradas nesta sessão
    const { data: sf } = await sb.from("series_feitas").select("id,ficha_exercicio_id,carga").eq("sessao_id", s.id);
    (sf||[]).forEach(r=>{ if(r.ficha_exercicio_id) EXEC_LOGS[r.ficha_exercicio_id] = { id:r.id, carga:r.carga }; });
    retomarCrono(); iniciarInatividade(); atualizarPill();
  }

  // ícone/emoji por grupo muscular (placeholder até termos imagens/GIFs reais)
  function iconeExercicio(x){
    const t = ((x.grupo||"") + " " + (x.nome_cache||"")).toLowerCase();
    if(/perna|quadr|leg|agach?|afundo|glúte|gluteo|panturr|coxa/.test(t)) return "🦵";
    if(/peito|supino|crucifixo|peck/.test(t)) return "🫁";
    if(/costa|remada|pux|puxada|barra|dorsal/.test(t)) return "🔙";
    if(/ombro|desenvolv|elevação|elevacao|deltoid/.test(t)) return "🙆";
    if(/bíceps|biceps|rosca/.test(t)) return "💪";
    if(/tríceps|triceps|testa|corda|francês|frances/.test(t)) return "🦾";
    if(/abd|core|prancha|obliqu/.test(t)) return "🧘";
    if(/aeró|aero|corrida|esteira|bike|cardio/.test(t)) return "🏃";
    return "🏋️";

  // texto do esquema de séries/reps (novo: só texto em x.reps; legado: "3x12")
  function esquemaPresc(x){
    const reps = (x.reps!=null) ? String(x.reps).trim() : "";
    if(reps){
      // dado antigo: reps era um número puro e series o nº de séries → "3x12"
      if(x.series!=null && /^\d+$/.test(reps)) return `${x.series}x${reps}`;
      // novo modelo: o professor digita o esquema completo no campo (ex.: "2 x 15") → mostra como está
      return reps;
    }
    if(x.series!=null) return `${x.series} séries`;
    return "";
  }
  // agrupa exercícios em bi-set: um exercício com biset=true segue ligado ao próximo
  function agruparBiset(lista){
    const grupos=[]; let atual=[];
    lista.forEach((x,i)=>{ atual.push(x); if(!x.biset || i===lista.length-1){ grupos.push(atual); atual=[]; } });
    if(atual.length) grupos.push(atual);
    return grupos;
  }
