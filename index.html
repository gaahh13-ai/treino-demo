<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piik — Lançamento em breve</title>
<meta name="description" content="O app que deixa o personal trainer mais profissional. Lançamento em breve.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap">
<style>
  :root{ --ac:#8bff1f; --ink:#07090b; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    min-height:100vh;font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#e9eee4;background:#07090b;overflow:hidden;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
  /* fundos / brilho */
  .bg{position:fixed;inset:0;z-index:0;
    background:radial-gradient(120% 90% at 50% 8%,#1a2414 0%,#0c1109 52%,#07090b 100%)}
  .orb{position:fixed;z-index:0;border-radius:50%;filter:blur(90px);opacity:.5;
    background:radial-gradient(circle,rgba(139,255,31,.35),transparent 70%);
    width:620px;height:620px;left:50%;top:8%;transform:translateX(-50%);animation:pulse 6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:translateX(-50%) scale(1)}50%{opacity:.6;transform:translateX(-50%) scale(1.08)}}
  .content{position:relative;z-index:2;max-width:640px;width:100%}

  /* topo: Entrar (usuários existentes) */
  .top{position:fixed;top:22px;right:22px;z-index:3}
  .entrar{display:inline-block;color:#cfe8b0;text-decoration:none;font-weight:700;font-size:14px;
    border:1px solid rgba(139,255,31,.35);border-radius:999px;padding:9px 18px;background:rgba(139,255,31,.06);transition:all .15s}
  .entrar:hover{background:rgba(139,255,31,.14);border-color:var(--ac);color:#fff}

  .kicker{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:13px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--ac);margin-bottom:26px}
  .kicker .dot{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 rgba(139,255,31,.7);animation:blink 1.8s ease-in-out infinite}
  @keyframes blink{0%{box-shadow:0 0 0 0 rgba(139,255,31,.6)}70%{box-shadow:0 0 0 12px rgba(139,255,31,0)}100%{box-shadow:0 0 0 0 rgba(139,255,31,0)}}

  .logo{font-weight:900;font-size:clamp(72px,16vw,150px);line-height:.9;letter-spacing:-.03em;color:#fff}
  .logo i{color:var(--ac);font-style:normal}
  .tag{margin-top:18px;font-size:clamp(16px,3.6vw,22px);font-weight:700;color:#c7cdbf}
  .tag b{color:var(--ac)}

  .bar{margin:34px auto 0;width:min(320px,80%);height:6px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;position:relative}
  .bar > i{position:absolute;left:0;top:0;bottom:0;width:85%;border-radius:99px;
    background:linear-gradient(90deg,#46c93a,var(--ac))}
  .barlabel{margin-top:12px;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8a927f}

  .cta{display:inline-flex;align-items:center;gap:10px;margin-top:40px;background:var(--ac);color:var(--ink);
    text-decoration:none;font-weight:800;font-size:16px;padding:15px 26px;border-radius:14px;
    box-shadow:0 10px 30px rgba(139,255,31,.22);transition:transform .15s}
  .cta:hover{transform:translateY(-2px)}
  .ctahint{margin-top:14px;font-size:13px;color:#8a927f}

  .foot{position:fixed;bottom:22px;left:0;right:0;z-index:2;text-align:center;color:#6f7865;font-size:12.5px;font-weight:600}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb"></div>

  <div class="top"><a class="entrar" href="login.html">Entrar &rarr;</a></div>

  <div class="content">
    <div class="kicker"><span class="dot"></span> Lançamento em breve</div>
    <div class="logo">P<i>ii</i>k</div>
    <div class="tag">Seu método, <b>com a sua marca.</b></div>

    <div class="bar"><i></i></div>
    <div class="barlabel">Estamos chegando</div>

    <a class="cta" href="https://www.instagram.com/usepiik/" target="_blank" rel="noopener">📸 Acompanhe os bastidores &nbsp;·&nbsp; @usepiik</a>
    <div class="ctahint">Siga pra ser um dos primeiros a saber quando abrir.</div>
  </div>

  <div class="foot">O app que deixa o personal trainer mais profissional. · Piik</div>
</body>
</html>
