<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piik</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  html,body{height:100%}
  body{background:#0a0b0d;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:radial-gradient(1200px 600px at 50% 35%, #101317 0%, #0a0b0d 70%)}
  .login-btn{position:fixed;top:22px;right:22px;z-index:10;
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:transparent;color:#7fff00;border:1.5px solid #34401f;border-radius:12px;
    padding:10px 18px;font-weight:700;font-size:14px;transition:.15s}
  .login-btn:hover{border-color:#7fff00;background:rgba(127,255,0,.08)}
  .center{text-align:center;padding:24px}
  .wordmark{font-family:'Rajdhani',sans-serif;font-style:italic;font-weight:700;
    font-size:clamp(64px,16vw,150px);letter-spacing:6px;line-height:1;color:#fff}
  .wordmark .ac{color:#7fff00}
  .bar{width:min(360px,70vw);height:6px;background:#7fff00;border-radius:99px;margin:18px auto 0;opacity:.9}
  .slogan{margin-top:22px;font-size:clamp(14px,3.4vw,20px);letter-spacing:1px;color:#c7ccd6}
  .slogan b{color:#7fff00;font-weight:700}
  .soon{margin-top:34px;font-size:12.5px;color:#6b7079;letter-spacing:.5px}
</style>
</head>
<body>
  <a class="login-btn" href="login.html">Entrar →</a>
  <div class="center">
    <div class="wordmark">P<span class="ac">ii</span>k</div>
    <div class="bar"></div>
    <div class="slogan">Seu método, <b>com a sua marca.</b></div>
    <div class="soon">site em construção</div>
  </div>
  <script>
    const SUPABASE_URL = "https://qpsraxnzgybehbwrtqjd.supabase.co";
    const SUPABASE_ANON = "sb_publishable_NEniZZkP5vimXDwv-pnuaw_FFpma8g_";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth:{ flowType:"implicit", detectSessionInUrl:true, persistSession:true, autoRefreshToken:true }
    });
    const DURACAO_MS = 12*60*60*1000;
    (async ()=>{
      try{
        const { data:{ session } } = await sb.auth.getSession();
        if(!session) return;
        const ini = Number(localStorage.getItem("sessao_inicio")||0);
        if(ini && Date.now()-ini > DURACAO_MS) return;   // sessão de 12h expirada
        let nome = session.user.email || "Minha conta";
        try{
          const { data:p } = await sb.from("profiles").select("full_name").eq("id", session.user.id).single();
          if(p && p.full_name) nome = p.full_name.trim().split(/\s+/)[0];
        }catch(e){}
        const btn = document.querySelector(".login-btn");
        if(btn){ btn.textContent = nome + " →"; btn.href = "app.html"; }
      }catch(e){}
    })();
  </script>
</body>
</html>
