<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Piik</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark;--txt:#e8eaee;--muted:#9aa0ab;--line:#262a33;--ac:#7fff00}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(140deg,#0a0b0d,#15171c 55%,#15171c);color:var(--txt)}
  .card{background:#15171c;border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.45);width:100%;max-width:400px;padding:34px}
  .logo{text-align:center;margin-bottom:6px}
  .logo span{font-weight:800;font-size:24px;letter-spacing:1px;color:var(--ac)}
  h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:4px;color:#fff}
  .sub{color:var(--muted);font-size:13px;text-align:center;margin-bottom:20px;line-height:1.45}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;padding:12px;border:1px solid #2a2e37;border-radius:12px;font-size:14px;background:#0f1116;color:#e8eaee}
  .field input::placeholder{color:#6b7079}
  .field input:focus{outline:2px solid var(--ac);border-color:var(--ac)}
  .btn{width:100%;border:none;border-radius:14px;padding:13px;font-weight:800;font-size:15px;color:#0a0b0d;cursor:pointer;
    background:var(--ac);box-shadow:0 8px 20px rgba(127,255,0,.18);margin-top:6px}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{margin-top:14px;font-size:13px;text-align:center;padding:10px;border-radius:10px;display:none;line-height:1.45}
  .msg.err{display:block;background:#2a1416;color:#f2a2a2}
  .msg.ok{display:block;background:#122110;color:#7fff00}
  .back{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--muted);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo" style="display:block;text-decoration:none"><span>Piik</span></a>
  <h1>Criar nova senha</h1>
  <div class="sub" id="sub">Digite sua nova senha abaixo.</div>

  <div id="form">
    <div class="field"><label>Nova senha</label><input id="pw1" type="password" placeholder="••••••••"></div>
    <div class="field"><label>Confirmar nova senha</label><input id="pw2" type="password" placeholder="••••••••"></div>
    <button class="btn" id="btn" onclick="salvar()">Salvar nova senha</button>
  </div>
  <div class="msg" id="msg"></div>
  <a class="back" href="login.html">← Voltar ao login</a>
</div>

<script>
  const SUPABASE_URL = "https://qpsraxnzgybehbwrtqjd.supabase.co";
  const SUPABASE_ANON = "sb_publishable_NEniZZkP5vimXDwv-pnuaw_FFpma8g_";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
  });
  let ready = false;

  function showMsg(t, ok){ const el=document.getElementById("msg"); el.className="msg"+(t?(ok?" ok":" err"):""); el.textContent=t; }

  // O SDK detecta o token de recuperação na URL e dispara este evento
  sb.auth.onAuthStateChange((event, session)=>{ if(event==="PASSWORD_RECOVERY" && session){ ready=true; } });

  // fallback: se já há sessão de recuperação
  sb.auth.getSession().then(({data})=>{ if(data.session) ready=true; });

  async function salvar(){
    const p1=document.getElementById("pw1").value, p2=document.getElementById("pw2").value;
    if(p1.length<6){ showMsg("A senha precisa ter ao menos 6 caracteres."); return; }
    if(p1!==p2){ showMsg("As senhas não coincidem."); return; }
    const { data:{ session } } = await sb.auth.getSession();
    if(!session && !ready){ showMsg("Link inválido ou expirado. Volte ao login e use \"Esqueci minha senha\" de novo."); return; }
    document.getElementById("btn").disabled=true; showMsg("");
    try{
      const { error } = await sb.auth.updateUser({ password:p1 });
      if(error) throw error;
      showMsg("Senha alterada com sucesso! Redirecionando para o login…", true);
      await sb.auth.signOut();
      setTimeout(()=>location.href="login.html", 1800);
    }catch(e){ showMsg(e.message || "Erro ao salvar."); document.getElementById("btn").disabled=false; }
  }
</script>
</body>
</html>
