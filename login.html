<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Piik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --pink:#7fff00; --pink-deep:#5fbf00;
  --bg:#0a0b0d; --surf:#15171c; --field:#262a33;
  --txt:#e8eaee; --muted:#9aa0ab; --line:#2a2e37;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;max-width:100%}
a{color:inherit;text-decoration:none}

.page{display:grid;grid-template-columns:48% 52%;min-height:100vh;width:100%;max-width:100%}

/* ===== ESQUERDA: FOTO ===== */
.hero{position:relative;min-width:0;overflow:hidden;background:#000}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:48% 42%}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 26%,transparent 55%,rgba(0,0,0,.8) 100%)}
.brand{position:absolute;top:clamp(28px,4vw,46px);left:clamp(26px,3.5vw,48px);z-index:3}
.brand a{display:inline-block} .brand img{height:clamp(28px,3vw,38px);width:auto;display:block;cursor:pointer;filter:drop-shadow(0 2px 12px rgba(0,0,0,.6))}
.cap{position:absolute;left:clamp(26px,3.5vw,48px);bottom:clamp(112px,15vh,176px);z-index:3;
  font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#0a0b0d;background:var(--pink);padding:6px 12px;border-radius:8px}
.htitle{position:absolute;left:clamp(26px,3.5vw,48px);right:clamp(30px,4vw,64px);bottom:clamp(46px,7vh,74px);z-index:3;
  font-family:Rajdhani,sans-serif;font-weight:700;font-size:clamp(24px,2.1vw,32px);line-height:1.14;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.htitle span{color:var(--pink)}

/* ===== DIREITA: CARD DE LOGIN ===== */
.side{position:relative;min-width:0;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg);overflow-x:hidden}
.card{position:relative;min-width:0;width:100%;max-width:min(430px,100%);
  background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:clamp(28px,3vw,38px)}
h1{font-family:Rajdhani,sans-serif;font-weight:700;font-size:26px;color:#fff;text-align:center}
.sub{font-size:14px;color:var(--muted);text-align:center;margin:4px 0 26px}
.field{margin-bottom:16px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
input.inp{width:100%;height:54px;background:var(--field);border:1px solid transparent;border-radius:13px;color:var(--txt);
  font-size:15px;padding:0 16px;outline:none;transition:border-color .15s,box-shadow .15s}
input.inp::placeholder{color:#7a808b}
input.inp:focus{border-color:var(--pink-deep);box-shadow:0 0 0 3px rgba(127,255,0,.12)}
/* impede o Chrome de deixar o campo claro ao preencher automaticamente */
input.inp:-webkit-autofill,
input.inp:-webkit-autofill:hover,
input.inp:-webkit-autofill:focus,
input.inp:-webkit-autofill:active{
  -webkit-text-fill-color:var(--txt);
  -webkit-box-shadow:0 0 0 1000px var(--field) inset;
  box-shadow:0 0 0 1000px var(--field) inset;
  caret-color:var(--txt);
  border:1px solid transparent;
  transition:background-color 9999s ease-out 0s;
}
input.inp:-webkit-autofill:focus{border-color:var(--pink-deep)}
.btn{width:100%;height:54px;margin-top:4px;border-radius:13px;border:none;cursor:pointer;background:var(--pink);color:#08130a;
  font-family:Rajdhani,sans-serif;font-weight:700;font-size:19px;letter-spacing:.3px;
  box-shadow:0 10px 30px rgba(127,255,0,.24);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:translateY(1px)}
.links{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between;margin-top:18px}
.links .primeiro{font-size:13.5px;font-weight:700;color:var(--pink-deep);cursor:pointer}
.links .esqueci{font-size:13.5px;color:var(--muted);cursor:pointer}
.links a:hover,.links span:hover{text-decoration:underline}
.voltar{display:block;text-align:center;margin-top:22px;font-size:13.5px;color:var(--muted)}
.voltar:hover{color:var(--txt)}
.err,.info{display:none;font-size:13px;padding:10px 14px;border-radius:12px;margin-bottom:16px;line-height:1.4}
.err{background:rgba(220,40,60,.1);border:1px solid rgba(220,40,60,.4);color:#ff8a9a}
.info{background:rgba(127,255,0,.08);border:1px solid rgba(127,255,0,.35);color:#cdeeb0}

@media (max-width:980px){
  .page{grid-template-columns:1fr}
  .hero{display:none}
  .side{min-height:100vh}
}
</style>
</head>

    <div class="cap">Treino na palma da mão</div>
    <div class="htitle">Seus alunos treinam com <span>você</span> onde estiverem.</div>
  </div>

  <!-- LOGIN -->
  <div class="side">
    <!-- Card principal -->
    <form class="card" id="loginForm" onsubmit="return entrar(event)">
      <h1>Área do aluno</h1>
      <div class="sub">Acompanhe sua evolução com a Piik.</div>

      <div class="info" id="info"></div>
      <div class="err" id="err"></div>

      <div class="field">
        <label for="email">E-mail</label>
        <input class="inp" id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input class="inp" id="senha" name="senha" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button class="btn" type="submit" id="btnEntrar">Entrar</button>

      <div class="links">
        <span class="primeiro" id="primeiro" onclick="primeiroAcesso()">Primeiro acesso</span>
        <span class="esqueci" id="esqueci" onclick="esqueci()">Esqueci minha senha</span>
      </div>
      <a class="voltar" href="https://piik.com.br">← Voltar ao site</a>
    </form>

    <!-- Card de redefinição de senha -->
    <form class="card" id="resetForm" style="display:none" onsubmit="return redefinir(event)">
      <h1>Nova senha</h1>
      <div class="sub">Defina a sua nova senha de acesso.</div>
      <div class="err" id="errReset"></div>
      <div class="field">
        <label for="novaSenha">Nova senha</label>
        <input class="inp" id="novaSenha" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres" required>
      </div>
      <div class="field">
        <label for="novaSenha2">Confirmar senha</label>
        <input class="inp" id="novaSenha2" type="password" autocomplete="new-password" placeholder="repita a senha" required>
      </div>
      <button class="btn" type="submit" id="btnReset">Salvar nova senha</button>
    </form>
  </div>

</div>

<script>
  const SUPABASE_URL  = "https://qpsraxnzgybehbwrtqjd.supabase.co";
  const SUPABASE_ANON = "sb_publishable_NEniZZkP5vimXDwv-pnuaw_FFpma8g_";
  const APP_URL = "app.html";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { flowType:"implicit", detectSessionInUrl:true, persistSession:true, autoRefreshToken:true }
  });

  const $ = (s)=>document.querySelector(s);
  const showErr  = (m)=>{ const e=$("#err");  e.textContent=m; e.style.display="block"; $("#info").style.display="none"; };
  const hideErr  = ()=>{ $("#err").style.display="none"; };
  const showInfo = (m)=>{ const e=$("#info"); e.textContent=m; e.style.display="block"; $("#err").style.display="none"; };

  // Mensagens vindas do app
  (function(){
    const q = new URLSearchParams(location.search);
    if(q.get("expirou"))                            showInfo("Sua sessão expirou. Entre novamente para continuar.");
    else if(q.get("conta")==="excluida")            showInfo("Sua conta foi excluída.");
    else if(q.get("conta")==="exclusao_solicitada") showInfo("Recebemos seu pedido de exclusão de conta.");
    else if(q.get("redefinida"))                    showInfo("Senha definida! Entre com a sua nova senha.");
  })();

  // Fluxo de redefinicao/primeiro acesso (link do e-mail traz #type=recovery)
  const isRecovery = /type=recovery/.test(location.hash) || new URLSearchParams(location.search).get("type")==="recovery";
  function mostrarReset(){ $("#loginForm").style.display="none"; $("#resetForm").style.display="block"; }
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="PASSWORD_RECOVERY") mostrarReset(); });
  if(isRecovery) mostrarReset();

  // Se ja estiver logado (e nao for recovery), vai direto pro app
  if(!isRecovery){
    sb.auth.getSession().then(({data})=>{ if(data && data.session) location.replace(APP_URL); });
  }

  async function entrar(ev){
    ev.preventDefault();
    hideErr();
    const email = $("#email").value.trim();
    const senha = $("#senha").value;
    const btn   = $("#btnEntrar");
    if(!email || !senha) return false;

    btn.disabled = true; const label = btn.textContent; btn.textContent = "Entrando…";
    try{
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if(error){
        showErr(
          /invalid login/i.test(error.message)       ? "E-mail ou senha incorretos. Tente novamente." :
          /email not confirmed/i.test(error.message) ? "Confirme seu e-mail antes de entrar." :
          (error.message || "Não foi possível entrar. Tente novamente.")
        );
        btn.disabled=false; btn.textContent=label; return false;
      }
      try{ localStorage.setItem("sessao_inicio", String(Date.now())); }catch(e){}
      location.replace(APP_URL);
    }catch(e){
      showErr("Erro de conexão. Verifique sua internet e tente novamente.");
      btn.disabled=false; btn.textContent=label;
    }
    return false;
  }

  async function enviarLink(msgOk){
    const email = $("#email").value.trim();
    if(!email){ showErr("Digite seu e-mail no campo acima primeiro."); $("#email").focus(); return; }
    try{ await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + "/login.html" }); }catch(e){}
    showInfo(msgOk);
  }
  function esqueci(){ enviarLink("Se este e-mail tiver conta no Piik, enviamos um link para redefinir a senha. Confira sua caixa de entrada."); }
  function primeiroAcesso(){ enviarLink("Enviamos um link para o seu e-mail para você criar a sua senha de acesso. Confira a caixa de entrada."); }

  async function redefinir(ev){
    ev.preventDefault();
    const e=$("#errReset"); e.style.display="none";
    const p1=$("#novaSenha").value, p2=$("#novaSenha2").value;
    if(p1.length<6){ e.textContent="A senha precisa ter ao menos 6 caracteres."; e.style.display="block"; return false; }
    if(p1!==p2){ e.textContent="As senhas não conferem."; e.style.display="block"; return false; }
    const btn=$("#btnReset"); btn.disabled=true; const l=btn.textContent; btn.textContent="Salvando…";
    try{
      const { error } = await sb.auth.updateUser({ password: p1 });
      if(error){ e.textContent=error.message||"Não foi possível salvar a senha."; e.style.display="block"; btn.disabled=false; btn.textContent=l; return false; }
      await sb.auth.signOut();
      location.replace("login.html?redefinida=1");
    }catch(err){
      e.textContent="Erro de conexão. Tente novamente."; e.style.display="block"; btn.disabled=false; btn.textContent=l;
    }
    return false;
  }
</script>
</body>
</html>
